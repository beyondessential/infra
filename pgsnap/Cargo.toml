[package]
name = "pgsnap"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "operator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
futures = "0.3"
jiff = { version = "0.2", features = ["serde"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
kube = { version = "3.1", default-features = false, features = ["runtime", "client", "rustls-tls"] }
prometheus = "0.14"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
