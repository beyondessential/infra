- name: Sanity check
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if the tamanu_version is set
      tags: [pre, go]
      assert:
        that: tamanu_version is defined
        msg: "tamanu_version is not defined. Please set it in the inventory file."

    # - name: Check tamanu-run works and the version exists before doing anything
    #   tags: [pre, go]
    #   ansible.builtin.command: tamanu-run {{ tamanu_version }} help

- name: Central pre-upgrade (if needed)
  hosts: central
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [pre, postgres]

    - role: tamanu-single-install
      type: central
      db_name: tamanu
      tags: [pre, tamanu]

- name: Facility pre-upgrade  (if needed)
  hosts: facility
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [pre, postgres]

    - role: tamanu-single-install
      type: facility
      db_name: tamanu
      tags: [pre, tamanu]

    - role: msupply-install
      tags: [pre, msupply]

- name: Central upgrade
  hosts: central
  roles:
    - role: tamanu-single-upgrade
      type: central
      tags: [go, tamanu]

- name: Facility upgrade
  hosts: facility
  roles:
    - role: tamanu-single-upgrade
      type: facility
      tags: [go, tamanu]

    - role: msupply-upgrade
      tags: [go, msupply]
