---
- name: Get IMDSv2 token
  when: ansible_system_vendor == 'Amazon EC2'
  ansible.builtin.uri:
    url: http://169.254.169.254/latest/api/token
    method: PUT
    headers:
      X-aws-ec2-metadata-token-ttl-seconds: "60"
    return_content: true
  register: imds_token

- name: Fetch EC2 tag from metadata service
  when: ansible_system_vendor == 'Amazon EC2'
  ansible.builtin.uri:
    url: "http://169.254.169.254/latest/meta-data/tags/instance/{{ ec2_tag_name }}"
    headers:
      X-aws-ec2-metadata-token: "{{ imds_token.content }}"
    return_content: true
    status_code: [200, 404]
  register: ec2_tag_result
  failed_when: false

- name: Set EC2 tag fact
  when: ansible_system_vendor == 'Amazon EC2' and ec2_tag_result.status == 200
  ansible.builtin.set_fact:
    "ansible_ec2_tag_{{ ec2_tag_name }}": "{{ ec2_tag_result.content }}"
