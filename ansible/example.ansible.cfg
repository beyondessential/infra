[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

[defaults]
interpreter_python = auto_silent
# Bundled collections still import the soon-to-be-removed ansible.module_utils._text;
# that's third-party noise we can't fix here. ansible-lint still flags deprecations
# in our own playbooks via its own rules, so suppress the runtime spam.
deprecation_warnings = False

#stdout_callback = dense
callback_enabled = yaml, timer, timestamp
