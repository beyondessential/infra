[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

;; Disabled automatically when you enable mitogen via setup.sh
pipelining = True

[defaults]
interpreter_python = auto_silent

;; Mitogen is configured automatically when you run setup.sh
;; If you want to enable it manually, uncomment these lines with the correct path
; strategy_plugins = /usr/lib/python3.12/site-packages/ansible_mitogen/plugins/strategy
; strategy = mitogen_linear

stdout_callback = dense
callback_enabled = yaml, timer, timestamp
