- name: Common setup
  hosts: all
  roles:
    - role: ebs-volume
      volume: sdl
      mount: /var/log
      fs_type: btrfs
      mount_opts: defaults,compress=zstd:6
      tags: [base, volumes]
    - role: ebs-volume
      volume: sdp
      mount: /var/lib/postgresql
      fs_type: ext4
      mount_opts: defaults,noatime,discard
      tags: [base, volumes]

    - role: base
      tags: [base, packages]

    - role: postgres
      tags: [base, postgres]
    - role: tailscale
      tags: [base, tailscale]
    - role: caddy
      tags: [base, caddy]
    - role: podman
      tags: [base, podman]


