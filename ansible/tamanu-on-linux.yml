- name: Common setup
  hosts: all
  roles:
    - role: ebs-volume
      volume: sdl
      mount: /var/log
      fs_type: btrfs
      mount_opts: defaults,compress=zstd:6
      tags: [base, volumes]
    - role: ebs-volume
      volume: sdp
      mount: /var/lib/postgresql
      fs_type: ext4
      mount_opts: defaults,noatime,discard
      tags: [base, volumes]

    - role: baseline
      tags: [base, baseline]
    - role: toolbox
      tags: [base, toolbox]

    - role: postgres
      tags: [base, postgres]
    - role: tailscale
      tags: [base, tailscale]
    - role: caddy
      tags: [base, caddy]
    - role: podman
      tags: [base, podman]

- name: Central server setup
  hosts: central
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [app, postgres]

- name: Facility all servers setup
  hosts: facility
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [app, postgres]
