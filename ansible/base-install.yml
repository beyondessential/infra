- name: Install
  hosts: all
  pre_tasks:
    - when: ansible_system_vendor == 'Amazon EC2'
      amazon.aws.ec2_metadata_facts:
  roles:
    - role: baseline
      tags: [base, baseline]
    - role: toolbox
      tags: [base, toolbox]
    - role: tailscale
      tags: [base, tailscale]
      when: tailscale_name is defined
    - role: podman
      tags: [base, podman]

