- name: Common setup
  hosts: all
  pre_tasks:
    - when: ansible_system_vendor == 'Amazon EC2'
      amazon.aws.ec2_metadata_facts:
  roles:
    - role: baseline
      tags: [base, baseline]
    - role: toolbox
      tags: [base, toolbox]

    - role: kopia
      tags: [base, kopia]
    #- role: metrics
    #  tags: [base, metrics]

    - role: postgres
      tags: [base, postgres]
    - role: tailscale
      tags: [base, tailscale]
      when: tailscale_name is defined
    - role: caddy
      tags: [base, caddy]
    - role: podman
      tags: [base, podman]

- name: Central server setup
  hosts: central
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [app, postgres]

    - role: tamanu-single-install
      type: central
      db_name: tamanu
      tags: [app, tamanu]

- name: Facility all servers setup
  hosts: facility
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [app, postgres]

    - role: tamanu-single-install
      type: facility
      db_name: tamanu
      tags: [app, tamanu]
