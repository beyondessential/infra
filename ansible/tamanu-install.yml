- name: Common setup
  hosts: all
  pre_tasks:
    - when: ansible_system_vendor == 'Amazon EC2'
      amazon.aws.ec2_metadata_facts:
  roles:
    - role: ebs-volume
      when: ansible_system_vendor == 'Amazon EC2' and ansible_ec2_tag_Partitioning is defined and ansible_ec2_tag_Partitioning == 'split-data-logs'
      volume: sdl
      mount: /var/log
      fs_type: btrfs
      mount_opts: defaults,compress=zstd:6
      tags: [base, volumes]
    - role: ebs-volume
      when: ansible_system_vendor == 'Amazon EC2' and ansible_ec2_tag_Partitioning is defined and ansible_ec2_tag_Partitioning == 'split-data-logs'
      volume: sdp
      mount: /var/lib/postgresql
      fs_type: "{{ 'ext4' if (aws_postgres_uses_ext4 is defined and aws_postgres_uses_ext4) else 'btrfs' }}"
      mount_opts: defaults,noatime,discard
      tags: [base, volumes]

    - role: baseline
      tags: [base, baseline]
    - role: toolbox
      tags: [base, toolbox]

    - role: kopia
      tags: [base, kopia]
    #- role: metrics
    #  tags: [base, metrics]

    - role: postgres
      tags: [base, postgres]
    - role: tailscale
      tags: [base, tailscale]
      when: tailscale_name is defined
    - role: caddy
      tags: [base, caddy]
    - role: podman
      tags: [base, podman]

- name: Central server setup
  hosts: central
  pre_tasks:
    - when: ansible_system_vendor == 'Amazon EC2'
      amazon.aws.ec2_metadata_facts:
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [app, postgres]

    - role: tamanu-single-install
      type: central
      db_name: tamanu
      tags: [app, tamanu]

- name: Facility all servers setup
  hosts: facility
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [app, postgres]

    - role: tamanu-single-install
      type: facility
      db_name: tamanu
      tags: [app, tamanu]
