---
- name: Common setup
  hosts: all
  pre_tasks:
    - name: Gather EC2 metadata facts
      when: ansible_facts['system_vendor'] == 'Amazon EC2'
      amazon.aws.ec2_metadata_facts:
    - name: Gather PostgreSQL facts
      ansible.builtin.include_tasks: tasks/gather-postgres-version.yml
    - name: Fetch Partitioning EC2 tag
      ansible.builtin.include_tasks: tasks/fetch-ec2-tag.yml
      vars:
        ec2_tag_name: Partitioning
  roles:
    - role: ebs-volume
      when: ansible_facts['system_vendor'] == 'Amazon EC2' and ansible_ec2_tag_Partitioning is defined and ansible_ec2_tag_Partitioning == 'split-data-logs'
      volume: sdl
      mount: /var/log
      fs_type: btrfs
      mount_opts: defaults,compress=zstd:6
      tags: [base, volumes]
    - role: ebs-volume
      when: ansible_facts['system_vendor'] == 'Amazon EC2' and ansible_ec2_tag_Partitioning is defined and ansible_ec2_tag_Partitioning == 'split-data-logs'
      volume: sdp
      mount: /var/lib/postgresql
      fs_type: btrfs
      mount_opts: defaults,noatime,discard
      tags: [base, volumes]

    - role: baseline
      tags: [base, baseline]
    - role: toolbox
      tags: [base, toolbox]

    - role: postgres
      tags: [base, postgres]
    - role: tailscale
      tags: [base, tailscale]
      when: tailscale_name is defined
    - role: caddy
      tags: [base, caddy]
    - role: podman
      tags: [base, podman]

    - role: kopia
      tags: [base, kopia]
    - role: elastic-agent
      tags: [base, elastic]

    - role: ufw
      when: not (dangerously_leave_ufw_alone | bool)
      tags: [base, ufw]
    - role: iti
      when: is_iti | default(false)
      tags: [base, iti]

- name: Central server setup
  hosts: central
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [app, postgres]

    - role: tamanu-single-install
      type: central
      db_name: tamanu
      tags: [app, tamanu]

- name: Facility all servers setup
  hosts: facility
  roles:
    - role: postgres-database
      dbname: tamanu
      tags: [app, postgres]

    - role: tamanu-single-install
      type: facility
      db_name: tamanu
      tags: [app, tamanu]

    - role: msupply-install
      tags: [app, msupply]
