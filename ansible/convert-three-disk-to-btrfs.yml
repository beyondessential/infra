---
- name: Convert three-disk setup to single-root btrfs
  hosts: all
  gather_facts: true
  become: true

  vars:
    # Device names are auto-detected from the system
    minimum_final_size_gb: 50
    extra_space_gb: 20
    # Metadata file version - bump this when schema changes to avoid compatibility issues
    metadata_version: v2

  tasks:
    - name: Load or detect conversion metadata
      tags: [always]
      block:
        - name: Check if conversion metadata file exists
          ansible.builtin.stat:
            path: /root/.disk-conversion-metadata-{{ metadata_version }}.json
          register: metadata_file

        - name: Read existing metadata file if it exists
          ansible.builtin.slurp:
            path: /root/.disk-conversion-metadata-{{ metadata_version }}.json
          register: metadata_slurp
          when: metadata_file.stat.exists

        - name: Parse metadata from file
          ansible.builtin.set_fact:
            conversion_metadata: "{{ metadata_slurp.content | b64decode | from_json }}"
          when: metadata_file.stat.exists

        - name: Load conversion metadata if it exists
          ansible.builtin.set_fact:
            root_uuid: "{{ conversion_metadata.root_uuid }}"
            root_partuuid: "{{ conversion_metadata.root_partuuid }}"
            var_log_uuid: "{{ conversion_metadata.var_log_uuid }}"
            postgresql_uuid: "{{ conversion_metadata.postgresql_uuid }}"
            uses_p_separator: "{{ conversion_metadata.uses_p_separator }}"
            intermediate_partition_number: "{{ conversion_metadata.intermediate_partition_number }}"
            sector_size: "{{ conversion_metadata.sector_size }}"
            root_start_sector: "{{ conversion_metadata.root_start_sector }}"
            root_end_sector: "{{ conversion_metadata.root_end_sector }}"
            total_sectors: "{{ conversion_metadata.total_sectors }}"
            boot_overhead_sectors: "{{ conversion_metadata.boot_overhead_sectors }}"
            intermediate_size_sectors: "{{ conversion_metadata.intermediate_size_sectors }}"
            final_partition_size_sectors: "{{ conversion_metadata.final_partition_size_sectors }}"
            intermediate_start_sector: "{{ conversion_metadata.intermediate_start_sector }}"
            intermediate_end_sector: "{{ conversion_metadata.intermediate_end_sector }}"
            final_end_sector: "{{ conversion_metadata.final_end_sector }}"
            total_used_bytes: "{{ conversion_metadata.total_used_bytes }}"
            total_disk_space_needed_gb: "{{ conversion_metadata.total_disk_space_needed_gb }}"
            total_disk_space_needed_bytes: "{{ conversion_metadata.total_disk_space_needed_bytes }}"
          when: metadata_file.stat.exists

    - name: Derive device names from UUIDs when metadata exists
      tags: [always]
      when: metadata_file.stat.exists
      block:
        - name: Find root partition by PARTUUID
          ansible.builtin.shell: |
            blkid -t PARTUUID="{{ root_partuuid }}" -o device
          register: current_root_partition
          changed_when: false

        - name: Derive root device from current root partition
          ansible.builtin.shell: |
            echo "{{ current_root_partition.stdout }}" | sed 's/p\?[0-9]*$//'
          register: current_root_device
          changed_when: false

        - name: Set current device names
          ansible.builtin.set_fact:
            root_partition: "{{ current_root_partition.stdout }}"
            root_device: "{{ current_root_device.stdout }}"
            intermediate_btrfs_partition: "{{ current_root_device.stdout }}{{ 'p' if uses_p_separator else '' }}{{ intermediate_partition_number }}"
            final_btrfs_partition: "{{ current_root_partition.stdout }}"

        - name: Find var/log partition by UUID if it exists
          ansible.builtin.shell: |
            blkid -t UUID="{{ var_log_uuid }}" -o device
          register: current_var_log_partition
          changed_when: false
          failed_when: false
          when: var_log_uuid != ''

        - name: Set var/log partition
          ansible.builtin.set_fact:
            var_log_partition: "{{ current_var_log_partition.stdout }}"
          when: var_log_uuid != '' and current_var_log_partition.rc == 0

        - name: Find postgresql partition by UUID if it exists
          ansible.builtin.shell: |
            blkid -t UUID="{{ postgresql_uuid }}" -o device
          register: current_postgresql_partition
          changed_when: false
          failed_when: false
          when: postgresql_uuid != ''

        - name: Set postgresql partition
          ansible.builtin.set_fact:
            postgresql_partition: "{{ current_postgresql_partition.stdout }}"
          when: postgresql_uuid != '' and current_postgresql_partition.rc == 0

        - name: Verify we found the correct root partition
          ansible.builtin.fail:
            msg: "Could not find root partition with PARTUUID {{ root_partuuid }}"
          when: current_root_partition.stdout == ''

    - name: Phase 1 - Gather information and validate
      tags: [never, phase1, gather]
      block:
        - name: Detect root partition and UUID
          ansible.builtin.shell: |
            root_part=$(findmnt -n -o SOURCE /)
            root_uuid=$(blkid -s UUID -o value "$root_part")
            root_partuuid=$(blkid -s PARTUUID -o value "$root_part")
            echo "partition=$root_part"
            echo "uuid=$root_uuid"
            echo "partuuid=$root_partuuid"
          register: root_info_raw
          changed_when: false

        - name: Parse root partition info
          ansible.builtin.set_fact:
            root_partition: "{{ root_info_raw.stdout | regex_search('partition=(.+)', '\\1') | default([''], true) | first }}"
            root_uuid: "{{ root_info_raw.stdout | regex_search('uuid=(.+)', '\\1') | default([''], true) | first }}"
            root_partuuid: "{{ root_info_raw.stdout | regex_search('partuuid=(.+)', '\\1') | default([''], true) | first }}"

        - name: Derive root device from partition
          ansible.builtin.shell: |
            echo "{{ root_partition }}" | sed 's/p\?[0-9]*$//'
          register: root_device_raw
          changed_when: false

        - name: Set root device
          ansible.builtin.set_fact:
            root_device: "{{ root_device_raw.stdout }}"

        - name: Detect var/log filesystem UUID
          ansible.builtin.shell: |
            log_part=$(findmnt -n -o SOURCE /var/log)
            log_uuid=$(blkid -s UUID -o value "$log_part")
            echo "partition=$log_part"
            echo "uuid=$log_uuid"
          register: log_info_raw
          changed_when: false
          failed_when: false

        - name: Parse var/log info
          ansible.builtin.set_fact:
            var_log_partition: "{{ log_info_raw.stdout | regex_search('partition=(.+)', '\\1') | first | default('') }}"
            var_log_uuid: "{{ log_info_raw.stdout | regex_search('uuid=(.+)', '\\1') | first | default('') }}"
          when: log_info_raw.rc == 0

        - name: Detect postgresql filesystem UUID
          ansible.builtin.shell: |
            pg_part=$(findmnt -n -o SOURCE /var/lib/postgresql)
            pg_uuid=$(blkid -s UUID -o value "$pg_part")
            echo "partition=$pg_part"
            echo "uuid=$pg_uuid"
          register: pg_info_raw
          changed_when: false
          failed_when: false

        - name: Parse postgresql info
          ansible.builtin.set_fact:
            postgresql_partition: "{{ pg_info_raw.stdout | regex_search('partition=(.+)', '\\1') | first | default('') }}"
            postgresql_uuid: "{{ pg_info_raw.stdout | regex_search('uuid=(.+)', '\\1') | first | default('') }}"
          when: pg_info_raw.rc == 0

        - name: Derive device names from partitions
          ansible.builtin.shell: |
            echo "{{ var_log_partition }}" | sed 's/[0-9]*$//'
          register: var_log_device_raw
          changed_when: false
          when: var_log_partition is defined and var_log_partition != ''

        - name: Set var/log device
          ansible.builtin.set_fact:
            var_log_device: "{{ var_log_device_raw.stdout }}"
          when: var_log_device_raw is not skipped

        - name: Derive postgresql device from partition
          ansible.builtin.shell: |
            echo "{{ postgresql_partition }}" | sed 's/[0-9]*$//'
          register: postgresql_device_raw
          changed_when: false
          when: postgresql_partition is defined and postgresql_partition != ''

        - name: Set postgresql device
          ansible.builtin.set_fact:
            postgresql_device: "{{ postgresql_device_raw.stdout }}"
          when: postgresql_device_raw is not skipped

        - name: Derive partition naming convention
          ansible.builtin.set_fact:
            uses_p_separator: "{{ root_partition is regex('^.+p\\d+$') }}"

        - name: Get existing partition numbers
          ansible.builtin.shell: |
            parted {{ root_device }} print | grep '^\s*[0-9]' | awk '{print $1}' | sort -n
          register: existing_partitions
          changed_when: false

        - name: Calculate next available partition number
          ansible.builtin.shell: |
            next_num=1
            for num in {{ existing_partitions.stdout_lines | join(' ') }}; do
              if [ "$num" -eq "$next_num" ]; then
                next_num=$((next_num + 1))
              fi
            done
            echo $next_num
          register: intermediate_partition_number_raw
          changed_when: false

        - name: Set partition facts
          ansible.builtin.set_fact:
            intermediate_partition_number: "{{ intermediate_partition_number_raw.stdout }}"
            intermediate_btrfs_partition: "{{ root_device }}{{ 'p' if uses_p_separator else '' }}{{ intermediate_partition_number_raw.stdout }}"
            final_btrfs_partition: "{{ root_partition }}"

        - name: Display detected devices and UUIDs
          ansible.builtin.debug:
            msg:
              - "Root device: {{ root_device }}"
              - "Root partition: {{ root_partition }}"
              - "Root UUID: {{ root_uuid }}"
              - "Root PARTUUID: {{ root_partuuid }}"
              - "Intermediate partition: {{ intermediate_btrfs_partition }}"
              - "Final partition: {{ final_btrfs_partition }}"
              - "Log partition: {{ var_log_partition | default('not detected') }}"
              - "Log UUID: {{ var_log_uuid | default('not detected') }}"
              - "PostgreSQL partition: {{ postgresql_partition | default('not detected') }}"
              - "PostgreSQL UUID: {{ postgresql_uuid | default('not detected') }}"

        - name: Check if root is already btrfs
          ansible.builtin.shell: |
            findmnt -n -o FSTYPE /
          register: root_fstype
          changed_when: false

        - name: Abort if root is already btrfs
          ansible.builtin.fail:
            msg:
              - "ERROR: Root filesystem is already btrfs!"
              - "This playbook is for converting three-disk ext4 setups to btrfs"
              - "Root filesystem type: {{ root_fstype.stdout }}"
              - "It appears this system may already be converted"
          when: root_fstype.stdout == "btrfs"

        - name: Check if /var/log btrfs spans multiple devices
          ansible.builtin.shell: |
            if mountpoint -q /var/log; then
              log_fstype=$(findmnt -n -o FSTYPE /var/log)
              if [ "$log_fstype" = "btrfs" ]; then
                device_count=$(btrfs filesystem show /var/log | grep -c 'devid')
                echo "$device_count"
              else
                echo "1"
              fi
            else
              echo "1"
            fi
          register: log_device_count
          changed_when: false

        - name: Abort if /var/log btrfs is multi-device
          ansible.builtin.fail:
            msg:
              - "ERROR: /var/log btrfs spans multiple devices!"
              - "This playbook only supports single-device filesystems"
              - "/var/log has {{ log_device_count.stdout }} devices"
              - "Cannot safely convert multi-device btrfs or RAID setups"
          when: log_device_count.stdout | int > 1

        - name: Validate three-disk setup
          ansible.builtin.fail:
            msg:
              - "ERROR: Not a three-disk setup!"
              - "This playbook requires separate devices for root, /var/log, and /var/lib/postgresql"
              - "Root device: {{ root_device }}"
              - "Log device: {{ var_log_device | default('NONE') }}"
              - "PostgreSQL device: {{ postgresql_device | default('NONE') }}"
          when: >
            (var_log_device is not defined or var_log_device == '') or
            (postgresql_device is not defined or postgresql_device == '') or
            root_device == var_log_device or
            root_device == postgresql_device or
            var_log_device == postgresql_device

        - name: Verify three-disk setup
          ansible.builtin.shell: |
            set -e
            root_mount=$(findmnt -n -o SOURCE,TARGET,FSTYPE / | awk '{print $1 "," $3}')
            log_mount=$(findmnt -n -o SOURCE,TARGET,FSTYPE /var/log | awk '{print $1 "," $3}')
            pg_mount=$(findmnt -n -o SOURCE,TARGET,FSTYPE /var/lib/postgresql | awk '{print $1 "," $3}')

            echo "root=$root_mount"
            echo "log=$log_mount"
            echo "pg=$pg_mount"
          register: mount_verification
          changed_when: false

        - name: Display current mount configuration
          ansible.builtin.debug:
            var: mount_verification.stdout_lines

        - name: Gather actual disk usage in bytes using sector sizes and compsize
          ansible.builtin.shell: |
            set -e

            # Get root partition actual usage in bytes (df shows 1K blocks by default)
            root_used_bytes=$(df -B1 / | tail -1 | awk '{print $3}')

            # For btrfs /var/log, use compsize to get referenced bytes (uncompressed size)
            # This is conservative - we ignore compression savings
            if mountpoint -q /var/log && [ "$(findmnt -n -o FSTYPE /var/log)" = "btrfs" ]; then
              log_used_bytes=$(compsize -bx /var/log | grep '^TOTAL' | awk '{print $4}')
            else
              log_used_bytes=$(df -B1 /var/log | tail -1 | awk '{print $3}')
            fi

            # Get postgresql usage in bytes
            pg_used_bytes=$(df -B1 /var/lib/postgresql | tail -1 | awk '{print $3}')

            total_used_bytes=$((root_used_bytes + log_used_bytes + pg_used_bytes))

            echo "root_used_bytes=${root_used_bytes}"
            echo "log_used_bytes=${log_used_bytes}"
            echo "pg_used_bytes=${pg_used_bytes}"
            echo "total_used_bytes=${total_used_bytes}"
          register: disk_usage_raw
          changed_when: false

        - name: Parse disk usage in bytes
          ansible.builtin.set_fact:
            root_used_bytes: "{{ disk_usage_raw.stdout | regex_search('root_used_bytes=(\\d+)', '\\1') | first | int }}"
            log_used_bytes: "{{ disk_usage_raw.stdout | regex_search('log_used_bytes=(\\d+)', '\\1') | first | int }}"
            pg_used_bytes: "{{ disk_usage_raw.stdout | regex_search('pg_used_bytes=(\\d+)', '\\1') | first | int }}"
            total_used_bytes: "{{ disk_usage_raw.stdout | regex_search('total_used_bytes=(\\d+)', '\\1') | first | int }}"

        - name: Get disk geometry and partition info in sectors
          ansible.builtin.shell: |
            fdisk -l {{ root_device }} | grep '^Sector size' | awk '{print $4}'
          register: sector_size_bytes
          changed_when: false

        - name: Get root partition start and end sectors
          ansible.builtin.shell: |
            fdisk -l {{ root_device }} | grep '^{{ root_partition }}' | awk '{print $2,$3}'
          register: root_partition_sectors
          changed_when: false

        - name: Get disk total sectors
          ansible.builtin.shell: |
            fdisk -l {{ root_device }} | grep '^Disk {{ root_device }}:' | awk '{print $(NF-1)}'
          register: disk_total_sectors
          changed_when: false

        - name: Parse partition and disk info
          ansible.builtin.set_fact:
            sector_size: "{{ sector_size_bytes.stdout | int }}"
            root_start_sector: "{{ root_partition_sectors.stdout.split()[0] | int }}"
            root_end_sector: "{{ root_partition_sectors.stdout.split()[1] | int }}"
            total_sectors: "{{ disk_total_sectors.stdout | int }}"

        - name: Calculate sizes for intermediate and final partitions in sectors
          ansible.builtin.set_fact:
            boot_overhead_sectors: "{{ root_start_sector | int }}"
            boot_overhead_bytes: "{{ root_start_sector | int * sector_size | int }}"
            buffer_bytes: "{{ 2 * 1024 * 1024 * 1024 }}"
            extra_space_bytes: "{{ extra_space_gb | int * 1024 * 1024 * 1024 }}"
            minimum_final_disk_size_bytes: "{{ minimum_final_size_gb | int * 1024 * 1024 * 1024 }}"
            intermediate_size_bytes: "{{ total_used_bytes | int + (2 * 1024 * 1024 * 1024) }}"
            calculated_final_size_bytes: "{{ total_used_bytes | int + (extra_space_gb | int * 1024 * 1024 * 1024) }}"

        - name: Determine final partition size (subtract boot overhead from minimum final disk size)
          ansible.builtin.set_fact:
            minimum_final_partition_bytes: "{{ (minimum_final_size_gb | int * 1024 * 1024 * 1024) - (root_start_sector | int * sector_size | int) }}"
            final_partition_size_bytes: "{{ [((minimum_final_size_gb | int * 1024 * 1024 * 1024) - (root_start_sector | int * sector_size | int)), calculated_final_size_bytes | int] | max }}"

        - name: Convert sizes to sectors
          ansible.builtin.set_fact:
            intermediate_size_sectors: "{{ ((intermediate_size_bytes | int + sector_size | int - 1) / sector_size | int) | int }}"
            final_partition_size_sectors: "{{ ((final_partition_size_bytes | int + sector_size | int - 1) / sector_size | int) | int }}"

        - name: Calculate human-readable sizes in GB for display
          ansible.builtin.set_fact:
            boot_overhead_gb: "{{ (boot_overhead_sectors | int * sector_size | int / 1024 / 1024 / 1024) | round(1) }}"
            intermediate_size_gb: "{{ (intermediate_size_bytes | int / 1024 / 1024 / 1024) | round(1) }}"
            final_partition_size_gb: "{{ (final_partition_size_bytes | int / 1024 / 1024 / 1024) | round(1) }}"
            total_used_gb: "{{ (total_used_bytes | int / 1024 / 1024 / 1024) | round(1) }}"

        - name: Get current root disk size
          ansible.builtin.shell: |
            lsblk -b -n -o SIZE {{ root_device }} | head -1
          register: current_disk_size_bytes
          changed_when: false

        - name: Calculate current disk size in GB
          ansible.builtin.set_fact:
            current_disk_size_gb: "{{ (current_disk_size_bytes.stdout | int / 1024 / 1024 / 1024) | round(0, 'ceil') | int }}"

        - name: Calculate minimum disk space needed (will extend intermediate to fill)
          ansible.builtin.set_fact:
            minimum_disk_space_needed_gb: "{{ (boot_overhead_gb | int + final_partition_size_gb | int + intermediate_size_gb | int) }}"

        - name: Calculate intermediate partition start sector
          ansible.builtin.set_fact:
            final_end_sector: "{{ (root_start_sector | int + final_partition_size_sectors | int - 1) }}"
            intermediate_start_sector: "{{ (root_start_sector | int + final_partition_size_sectors | int) }}"

        - name: Calculate minimum disk space needed (bytes)
          ansible.builtin.set_fact:
            minimum_disk_space_needed_bytes: "{{ boot_overhead_sectors | int * sector_size | int + final_partition_size_sectors | int * sector_size | int + intermediate_size_sectors | int * sector_size | int }}"

        - name: Calculate total disk space needed in GB (rounded up for AWS)
          ansible.builtin.set_fact:
            total_disk_space_needed_gb: "{{ (minimum_disk_space_needed_bytes | int / 1024 / 1024 / 1024) | round(0, 'ceil') | int }}"
            total_disk_space_needed_bytes: "{{ (((minimum_disk_space_needed_bytes | int / 1024 / 1024 / 1024) | round(0, 'ceil') | int) * 1024 * 1024 * 1024) }}"

        - name: Calculate intermediate partition end to fill disk
          ansible.builtin.set_fact:
            theoretical_total_sectors: "{{ ((total_disk_space_needed_bytes | int + sector_size | int - 1) / sector_size | int) | int }}"
            intermediate_end_sector: "{{ (((total_disk_space_needed_bytes | int + sector_size | int - 1) / sector_size | int) | int) - 1 }}"

        - name: Write conversion metadata to file
          ansible.builtin.copy:
            content: |
              {{ {
                'root_uuid': root_uuid,
                'root_partuuid': root_partuuid,
                'var_log_uuid': var_log_uuid | default(''),
                'postgresql_uuid': postgresql_uuid | default(''),
                'uses_p_separator': uses_p_separator,
                'intermediate_partition_number': intermediate_partition_number,
                'sector_size': sector_size,
                'root_start_sector': root_start_sector,
                'root_end_sector': root_end_sector,
                'total_sectors': total_sectors,
                'boot_overhead_sectors': boot_overhead_sectors,
                'intermediate_size_sectors': intermediate_size_sectors,
                'final_partition_size_sectors': final_partition_size_sectors,
                'intermediate_start_sector': intermediate_start_sector,
                'intermediate_end_sector': intermediate_end_sector,
                'final_end_sector': final_end_sector,
                'total_used_bytes': total_used_bytes,
                'total_disk_space_needed_gb': total_disk_space_needed_gb,
                'total_disk_space_needed_bytes': total_disk_space_needed_bytes
              } | to_nice_json }}
            dest: /root/.disk-conversion-metadata-{{ metadata_version }}.json
            mode: "0600"

        - name: Display saved metadata location
          ansible.builtin.debug:
            msg: "Conversion metadata saved to /root/.disk-conversion-metadata-{{ metadata_version }}.json"

        - name: Calculate display values
          ansible.builtin.set_fact:
            root_used_gb: "{{ (root_used_bytes | int / 1024 / 1024 / 1024) | round(1) }}"
            log_used_gb: "{{ (log_used_bytes | int / 1024 / 1024 / 1024) | round(1) }}"
            pg_used_gb: "{{ (pg_used_bytes | int / 1024 / 1024 / 1024) | round(1) }}"
            boot_overhead_gb: "{{ (boot_overhead_sectors | int * sector_size | int / 1024 / 1024 / 1024) | round(1) }}"
            intermediate_size_gb: "{{ (intermediate_size_sectors | int * sector_size | int / 1024 / 1024 / 1024) | round(1) }}"
            final_partition_size_gb: "{{ (final_partition_size_sectors | int * sector_size | int / 1024 / 1024 / 1024) | round(1) }}"

        - name: Display storage information
          ansible.builtin.debug:
            msg:
              - "Root partition usage: {{ root_used_gb }}GB"
              - "Log partition usage: {{ log_used_gb }}GB"
              - "PostgreSQL partition usage: {{ pg_used_gb }}GB"
              - "Total usage: {{ total_used_gb }}GB"
              - "Current root disk size: {{ current_disk_size_gb }}GB"
              - "Boot/EFI overhead: {{ boot_overhead_gb }}GB"
              - "Final partition size: {{ final_partition_size_gb }}GB"
              - "Intermediate partition size: {{ intermediate_size_gb }}GB"
              - "Total disk space needed: {{ total_disk_space_needed_gb }}GB (boot + final + intermediate)"
              - "{% if current_disk_size_gb | int < total_disk_space_needed_gb | int %}WARNING: Root disk is too small! Need {{ total_disk_space_needed_gb }}GB but have {{ current_disk_size_gb }}GB{% else %}Root disk size is sufficient{% endif %}"

        - name: Get all partitions for display
          ansible.builtin.shell: |
            fdisk -l {{ root_device }} | grep '^{{ root_device }}' | awk '{print $1 " " $2 " " $3 " " $4 " " $5}'
          register: all_partitions_raw
          changed_when: false

        - name: Display current partition table
          ansible.builtin.shell: |
            echo "=== CURRENT PARTITION TABLE ==="
            fdisk -l {{ root_device }}
          register: current_partition_table
          changed_when: false

        - name: Show current partition table
          ansible.builtin.debug:
            var: current_partition_table.stdout_lines

        - name: Calculate current root size in bytes
          ansible.builtin.set_fact:
            root_current_size_bytes: "{{ ((root_end_sector | int - root_start_sector | int + 1) * sector_size | int) }}"

        - name: Calculate space between partitions
          ansible.builtin.set_fact:
            space_between_gb: "{{ ((intermediate_start_sector | int - root_end_sector | int - 1) * sector_size | int / 1024 / 1024 / 1024) | round(1) }}"

        - name: Build expected intermediate partition table
          ansible.builtin.shell: |
            echo "=== EXPECTED INTERMEDIATE STATE (after phase 2-5, before reboot1) ==="
            echo "Device                Start        End    Sectors   Size Type"
            fdisk -l {{ root_device }} | grep '^{{ root_device }}' | grep -v '^{{ root_device }}p1\s'
            echo "{{ root_partition }}     {{ '%10d' | format(root_start_sector | int) }} {{ '%10d' | format(root_end_sector | int) }} {{ '%10d' | format(root_end_sector | int - root_start_sector | int + 1) }} {{ ((root_end_sector | int - root_start_sector | int + 1) * sector_size | int / 1024 / 1024 / 1024) | round(1) }}G Linux filesystem"
            echo "(free space)          {{ '%10d' | format(root_end_sector | int + 1) }} {{ '%10d' | format(intermediate_start_sector | int - 1) }} {{ '%10d' | format(intermediate_start_sector | int - root_end_sector | int - 1) }} {{ ((intermediate_start_sector | int - root_end_sector | int - 1) * sector_size | int / 1024 / 1024 / 1024) | round(1) }}G"
            echo "{{ intermediate_btrfs_partition }} {{ '%10d' | format(intermediate_start_sector | int) }} {{ '%10d' | format(intermediate_end_sector | int) }} {{ '%10d' | format(intermediate_end_sector | int - intermediate_start_sector | int + 1) }} {{ ((intermediate_end_sector | int - intermediate_start_sector | int + 1) * sector_size | int / 1024 / 1024 / 1024) | round(1) }}G Linux filesystem"
          register: intermediate_table
          changed_when: false

        - name: Display expected intermediate partition table
          ansible.builtin.debug:
            var: intermediate_table.stdout_lines

        - name: Build expected final partition table
          ansible.builtin.shell: |
            echo "=== EXPECTED FINAL STATE (after phase 7-11) ==="
            echo "Device                Start        End    Sectors   Size Type"
            fdisk -l {{ root_device }} | grep '^{{ root_device }}' | grep -v '^{{ root_partition }}\s'
            echo "{{ root_partition }}  {{ '%10d' | format(root_start_sector | int) }} {{ '%10d' | format(final_end_sector | int) }} {{ '%10d' | format(final_end_sector | int - root_start_sector | int + 1) }} {{ ((final_end_sector | int - root_start_sector | int + 1) * sector_size | int / 1024 / 1024 / 1024) | round(1) }}G Linux filesystem"
            echo "  Subvolumes: @, @log, @containers, @postgres"
          register: final_table
          changed_when: false

        - name: Display expected final partition table
          ansible.builtin.debug:
            var: final_table.stdout_lines

        - name: Display EBS extension requirements (if disk too small)
          ansible.builtin.debug:
            msg:
              - "==============================================================================="
              - "ACTION REQUIRED: EBS VOLUME EXTENSION"
              - "==============================================================================="
              - ""
              - "Current root disk size: {{ current_disk_size_gb }}GB"
              - "Required disk size: {{ total_disk_space_needed_gb }}GB"
              - ""
              - "⚠️  YOU MUST EXTEND THE ROOT EBS VOLUME TO {{ total_disk_space_needed_gb }}GB BEFORE PROCEEDING"
              - ""
              - "Steps:"
              - "  1. Go to AWS Console → EC2 → Instances"
              - "  2. Find the instance named {{ inventory_hostname }}"
              - "  3. Go to Storage tab → Click on the root volume"
              - "  4. Actions → Modify volume"
              - "  5. Change size to {{ total_disk_space_needed_gb }}GB and confirm"
              - "  6. Wait for modification to complete (state: optimizing)"
              - "  7. Run phase2 to create the intermediate partition"
              - ""
              - "Note: The root ext4 partition will NOT be extended - the new space"
              - "      will be used to create the intermediate btrfs partition."
              - ""
              - "==============================================================================="
          when: current_disk_size_gb | int < total_disk_space_needed_gb | int

        - name: Display EBS extension requirements (if disk sufficient)
          ansible.builtin.debug:
            msg:
              - "==============================================================================="
              - "DISK SIZE CHECK"
              - "==============================================================================="
              - ""
              - "✓ Current disk size ({{ current_disk_size_gb }}GB) is sufficient"
              - "✓ Required: {{ total_disk_space_needed_gb }}GB"
              - "✓ You can proceed with phase2"
              - ""
              - "==============================================================================="
          when: current_disk_size_gb | int >= total_disk_space_needed_gb | int

        - name: Check for EFI partition
          ansible.builtin.shell: |
            fdisk -l {{ root_device }} | grep -i 'EFI' | head -1 | awk '{print $1}'
          register: efi_check
          changed_when: false
          failed_when: false

        - name: Display EFI partition info
          ansible.builtin.debug:
            msg: "EFI partition detected: {{ efi_check.stdout }}"
          when: efi_check.stdout | length > 0

    - name: Phase 2 - Extend root disk and create intermediate btrfs
      tags: [never, phase2, extend]
      block:
        - name: Ensure conversion metadata exists
          ansible.builtin.fail:
            msg: "Conversion metadata not found. Run with --tags=phase1 first to detect and save conversion parameters."
          when: not metadata_file.stat.exists

        - name: Check current disk size before extension
          ansible.builtin.shell: |
            lsblk -b -n -o SIZE {{ root_device }} | head -1
          register: current_disk_size_bytes_check
          changed_when: false

        - name: Calculate current disk size in GB
          ansible.builtin.set_fact:
            current_disk_size_gb_check: "{{ (current_disk_size_bytes_check.stdout | int / 1024 / 1024 / 1024) | round(0, 'ceil') | int }}"

        - name: Display disk size check
          ansible.builtin.debug:
            msg:
              - "Current disk size: {{ current_disk_size_gb_check }}GB"
              - "Required disk size: {{ total_disk_space_needed_gb }}GB"
              - "Disk size {% if current_disk_size_gb_check | int >= total_disk_space_needed_gb | int %}is sufficient{% else %}needs extension{% endif %}"

        - name: Fail if disk is too small
          ansible.builtin.fail:
            msg: |
              ERROR: Root disk is too small!
              Current size: {{ current_disk_size_gb_check }}GB
              Required size: {{ total_disk_space_needed_gb }}GB

              You must extend the EBS volume to at least {{ total_disk_space_needed_gb }}GB in AWS Console before running phase2.

              Steps:
                1. Go to AWS Console → EC2 → Volumes
                2. Find the root volume for {{ inventory_hostname }}
                3. Modify volume size to {{ total_disk_space_needed_gb }}GB
                4. Wait for modification to complete
                5. Re-run phase2 (this will automatically run growpart)
          when: current_disk_size_gb_check | int < total_disk_space_needed_gb | int

        - name: Get root partition number
          ansible.builtin.shell: |
            echo "{{ root_partition }}" | sed 's/.*[^0-9]\([0-9]*\)$/\1/'
          register: root_partition_number
          changed_when: false

        - name: Verify disk has been extended (but do NOT extend the root partition)
          ansible.builtin.debug:
            msg: |
              ✓ Disk size verified: {{ current_disk_size_gb_check }}GB
              ✓ Root partition remains at current size (will NOT be extended)
              ✓ New space will be used for intermediate btrfs partition

        - name: Check current partitions
          ansible.builtin.shell: |
            parted {{ root_device }} print
          register: partition_layout_before
          changed_when: false

        - name: Display current partition layout
          ansible.builtin.debug:
            var: partition_layout_before.stdout_lines

        - name: Stop services to reduce disk activity
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          loop:
            - postgresql
            - podman
          failed_when: false

        - name: Sync filesystem
          ansible.builtin.command: sync
          changed_when: false

        - name: Drop caches
          ansible.builtin.shell: echo 3 > /proc/sys/vm/drop_caches
          changed_when: false

        - name: Get last usable sector from GPT
          ansible.builtin.shell: |
            sgdisk -E {{ root_device }}
          register: last_usable_sector
          changed_when: false

        - name: Calculate actual intermediate end sector
          ansible.builtin.set_fact:
            actual_intermediate_end_sector: "{{ last_usable_sector.stdout }}"

        - name: Display partition creation info
          ansible.builtin.debug:
            msg:
              - "Intermediate start sector: {{ intermediate_start_sector }}"
              - "Calculated end sector: {{ intermediate_end_sector }}"
              - "Last usable sector: {{ last_usable_sector.stdout }}"
              - "Using end sector: {{ actual_intermediate_end_sector }}"

        - name: Create intermediate btrfs partition
          ansible.builtin.shell: |
            parted -s {{ root_device }} unit s mkpart primary {{ intermediate_start_sector }} {{ actual_intermediate_end_sector }}
          register: partition_create
          changed_when: true

        - name: Display partition creation output
          ansible.builtin.debug:
            msg:
              - "Partition creation stdout:"
              - "{{ partition_create.stdout }}"
              - "Partition creation stderr:"
              - "{{ partition_create.stderr }}"
              - "Return code: {{ partition_create.rc }}"

        - name: Reload partition table
          ansible.builtin.command: partprobe {{ root_device }}
          changed_when: true

        - name: Wait for partition device node
          ansible.builtin.wait_for:
            path: "{{ intermediate_btrfs_partition }}"
            timeout: 15

        - name: Verify partition was created
          ansible.builtin.shell: |
            lsblk {{ intermediate_btrfs_partition }}
          register: verify_partition
          changed_when: false

        - name: Create btrfs filesystem on intermediate partition
          ansible.builtin.command: |
            mkfs.btrfs --label ROOT_TEMP --checksum xxhash --features block-group-tree,squota {{ intermediate_btrfs_partition }}
          changed_when: true

        - name: Verify btrfs creation
          ansible.builtin.shell: |
            blkid {{ intermediate_btrfs_partition }}
          register: blkid_check
          changed_when: false

        - name: Display new partition info
          ansible.builtin.debug:
            var: blkid_check.stdout

    - name: Phase 3 - Setup intermediate btrfs
      tags: [never, phase3, setup]
      block:
        - name: Ensure conversion metadata exists
          ansible.builtin.fail:
            msg: "Conversion metadata not found. Run with --tags=stage0 first to detect and save conversion parameters."
          when: not metadata_file.stat.exists

        - name: Ensure mount point exists
          ansible.builtin.file:
            path: /mnt/btrfsroot
            state: directory
            mode: "0755"

        - name: Mount intermediate btrfs
          ansible.builtin.shell: |
            mount -o compress=zstd:6 {{ intermediate_btrfs_partition }} /mnt/btrfsroot
          changed_when: true

        - name: Verify mount
          ansible.builtin.shell: |
            findmnt | grep /mnt/btrfsroot
          register: intermediate_mount
          changed_when: false

        - name: Display intermediate mount
          ansible.builtin.debug:
            var: intermediate_mount.stdout_lines

        - name: Create btrfs swap file
          ansible.builtin.command: btrfs filesystem mkswapfile --size 4G /mnt/btrfsroot/swap.img
          changed_when: true

    - name: Phase 4 - Copy system data
      tags: [never, phase4, copy]
      block:
        - name: Ensure conversion metadata exists
          ansible.builtin.fail:
            msg: "Conversion metadata not found. Run with --tags=stage0 first to detect and save conversion parameters."
          when: not metadata_file.stat.exists

        - name: Rsync root filesystem excluding mounted filesystems
          ansible.builtin.shell: |
            rsync -aAXH --info=progress2 \
              --exclude={"/dev/*","/proc/*","/sys/*","/tmp/*","/run/*","/mnt/*","/media/*","/lost+found","/swap.img","/var/log/*","/var/lib/postgresql/*"} \
              / /mnt/btrfsroot/
          register: rsync_root
          changed_when: true

        - name: Rsync var/log
          ansible.builtin.shell: |
            rsync -aAXH --info=progress2 /var/log/ /mnt/btrfsroot/var/log/
          register: rsync_log
          changed_when: true

        - name: Stop postgresql before final copy
          ansible.builtin.systemd:
            name: postgresql
            state: stopped
          failed_when: false

        - name: Rsync postgresql data
          ansible.builtin.shell: |
            rsync -aAXH --info=progress2 /var/lib/postgresql/ /mnt/btrfsroot/var/lib/postgresql/
          register: rsync_pg
          changed_when: true

        - name: Get UUID for intermediate btrfs
          ansible.builtin.shell: |
            blkid -s UUID -o value {{ intermediate_btrfs_partition }}
          register: intermediate_uuid
          changed_when: false

        - name: Display UUID
          ansible.builtin.debug:
            msg: "Intermediate btrfs UUID: {{ intermediate_uuid.stdout }}"

        - name: Backup original fstab
          ansible.builtin.copy:
            src: /mnt/btrfsroot/etc/fstab
            dest: /mnt/btrfsroot/etc/fstab.pre-btrfs
            remote_src: true
            mode: preserve

        - name: Update fstab for intermediate btrfs
          ansible.builtin.shell: |
            set -e
            uuid="{{ intermediate_uuid.stdout }}"

            cp /mnt/btrfsroot/etc/fstab /mnt/btrfsroot/etc/fstab.backup

            sed -i.old '/^[^#].*[[:space:]]\/[[:space:]]/d' /mnt/btrfsroot/etc/fstab
            sed -i '/^[^#].*[[:space:]]\/var\/log[[:space:]]/d' /mnt/btrfsroot/etc/fstab
            sed -i '/^[^#].*[[:space:]]\/var\/lib\/postgresql[[:space:]]/d' /mnt/btrfsroot/etc/fstab

            cat >> /mnt/btrfsroot/etc/fstab << EOF
            UUID=$uuid / btrfs compress=zstd:6 0 1
            /swap.img none swap sw 0 0
            EOF
          changed_when: true

        - name: Display new fstab
          ansible.builtin.shell: cat /mnt/btrfsroot/etc/fstab
          register: new_fstab
          changed_when: false

        - name: Show new fstab
          ansible.builtin.debug:
            var: new_fstab.stdout_lines

    - name: Phase 5 - Update bootloader for intermediate btrfs
      tags: [never, phase5, bootloader1]
      block:
        - name: Ensure conversion metadata exists
          ansible.builtin.fail:
            msg: "Conversion metadata not found. Run with --tags=stage0 first to detect and save conversion parameters."
          when: not metadata_file.stat.exists

        - name: Mount required filesystems for chroot
          ansible.builtin.shell: |
            mount --bind /dev /mnt/btrfsroot/dev
            mount --bind /proc /mnt/btrfsroot/proc
            mount --bind /sys /mnt/btrfsroot/sys
            mount --bind /run /mnt/btrfsroot/run
          changed_when: true

        - name: Check if /boot is separate partition
          ansible.builtin.shell: |
            findmnt -n /boot || echo "no_separate_boot"
          register: boot_check
          changed_when: false

        - name: Mount boot if it exists as separate partition
          ansible.builtin.shell: |
            mount --bind /boot /mnt/btrfsroot/boot
          changed_when: true
          when: boot_check.stdout != "no_separate_boot"

        - name: Check if /boot/efi exists
          ansible.builtin.stat:
            path: /boot/efi
          register: boot_efi_stat

        - name: Mount boot/efi if it exists
          ansible.builtin.shell: |
            mount --bind /boot/efi /mnt/btrfsroot/boot/efi
          changed_when: true
          when: boot_efi_stat.stat.exists

        - name: Update initramfs and grub in chroot
          ansible.builtin.shell: |
            chroot /mnt/btrfsroot /bin/bash -c "update-initramfs -u && update-grub"
          changed_when: true

        - name: Unmount chroot filesystems in reverse order
          ansible.builtin.shell: |
            umount /mnt/btrfsroot/boot/efi 2>/dev/null || true
            umount /mnt/btrfsroot/boot 2>/dev/null || true
            umount /mnt/btrfsroot/run
            umount /mnt/btrfsroot/sys
            umount /mnt/btrfsroot/proc
            umount /mnt/btrfsroot/dev
          changed_when: true
          failed_when: false

        - name: Unmount intermediate btrfs
          ansible.builtin.shell: |
            umount /mnt/btrfsroot
          changed_when: true

        - name: Display completion message
          ansible.builtin.debug:
            msg:
              - "Phase 5 complete - bootloader updated"
              - "System is ready to reboot into intermediate btrfs"
              - "Run with --tags=reboot1 when ready"

    - name: Phase 6 - Reboot to intermediate btrfs
      tags: [never, reboot1]
      block:
        - name: Reboot system to intermediate btrfs
          ansible.builtin.reboot:
            msg: "Rebooting to intermediate btrfs root filesystem"
            reboot_timeout: 600
            post_reboot_delay: 30

        - name: Wait for system to become reachable
          ansible.builtin.wait_for_connection:
            timeout: 600
            delay: 10

        - name: Verify boot from intermediate btrfs
          ansible.builtin.shell: |
            root_source=$(findmnt -n -o SOURCE /)
            root_fstype=$(findmnt -n -o FSTYPE /)
            echo "Root device: $root_source"
            echo "Root fstype: $root_fstype"
            if [ "$root_fstype" != "btrfs" ]; then
              echo "ERROR: Not booted to btrfs (still on $root_fstype)"
              exit 1
            fi
            if echo "$root_source" | grep -q "{{ intermediate_partition_number }}"; then
              echo "SUCCESS: Booted from intermediate partition"
              exit 0
            else
              echo "WARNING: On btrfs but may not be intermediate partition"
              echo "Expected partition number: {{ intermediate_partition_number }}"
              exit 1
            fi
          register: boot_verify
          changed_when: false

        - name: Display boot verification
          ansible.builtin.debug:
            var: boot_verify.stdout_lines

        - name: Check btrfs filesystem
          ansible.builtin.shell: |
            btrfs filesystem show /
            btrfs subvolume list /
          register: btrfs_check
          changed_when: false

        - name: Display btrfs status
          ansible.builtin.debug:
            var: btrfs_check.stdout_lines

    - name: Phase 7 - Delete old ext4 partition and create final btrfs
      tags: [never, phase7, finalize]
      block:
        - name: Ensure conversion metadata exists
          ansible.builtin.fail:
            msg: "Conversion metadata not found. Run with --tags=stage0 first to detect and save conversion parameters."
          when: not metadata_file.stat.exists

        - name: Verify we're on intermediate btrfs
          ansible.builtin.shell: |
            root_fstype=$(findmnt -n -o FSTYPE /)
            root_source=$(findmnt -n -o SOURCE /)
            if [ "$root_fstype" != "btrfs" ]; then
              echo "ERROR: Not on btrfs, cannot proceed to phase7"
              exit 1
            fi
            if ! echo "$root_source" | grep -q "{{ intermediate_partition_number }}"; then
              echo "ERROR: Not on intermediate partition, cannot proceed"
              exit 1
            fi
          changed_when: false

        - name: Stop services before finalizing
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          loop:
            - postgresql
            - podman
          failed_when: false

        - name: Sync filesystem
          ansible.builtin.command: sync
          changed_when: false

        - name: Remove old ext4 partition
          ansible.builtin.shell: |
            parted -s {{ root_device }} rm 1
          changed_when: true

        - name: Get current filesystem usage in bytes
          ansible.builtin.shell: |
            df -B1 / | tail -1 | awk '{print $3}'
          register: actual_usage_bytes
          changed_when: false

        - name: Display size info
          ansible.builtin.debug:
            msg:
              - "Current usage: {{ (actual_usage_bytes.stdout | int / 1024 / 1024 / 1024) | round(1) }}GB"
              - "Final partition size: {{ ((final_partition_size_sectors | int * sector_size | int) / 1024 / 1024 / 1024) | round(1) }}GB"

        - name: Create final btrfs partition
          ansible.builtin.shell: |
            parted -s {{ root_device }} unit s mkpart primary {{ root_start_sector }} {{ final_end_sector }}
          register: partition_create
          changed_when: true

        - name: Reload partition table
          ansible.builtin.command: partprobe {{ root_device }}
          changed_when: true

        - name: Wait for new partition
          ansible.builtin.wait_for:
            path: "{{ final_btrfs_partition }}"
            timeout: 15

        - name: Create final btrfs filesystem
          ansible.builtin.command: |
            mkfs.btrfs --label ROOT --checksum xxhash --features block-group-tree,squota {{ final_btrfs_partition }}
          changed_when: true

        - name: Ensure final mount point exists
          ansible.builtin.file:
            path: /mnt/finalroot
            state: directory
            mode: "0755"

        - name: Mount final btrfs (top level)
          ansible.builtin.shell: |
            mount {{ final_btrfs_partition }} /mnt/finalroot
          changed_when: true

        - name: Create subvolumes on final btrfs
          ansible.builtin.command: btrfs subvolume create /mnt/finalroot/{{ item }}
          loop:
            - "@"
            - "@log"
            - "@containers"
            - "@postgres"
          changed_when: true

        - name: Unmount final btrfs top level
          ansible.builtin.shell: umount /mnt/finalroot
          changed_when: true

        - name: Mount final root subvolume
          ansible.builtin.shell: |
            mount -o compress=zstd:6,subvol=@ {{ final_btrfs_partition }} /mnt/finalroot
          changed_when: true

        - name: Create directory structure in final root
          ansible.builtin.file:
            path: "/mnt/finalroot/{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - var/log
            - var/lib/containers
            - var/lib/postgresql

        - name: Mount final subvolumes
          ansible.builtin.shell: |
            mount -o compress=zstd:6,subvol=@log {{ final_btrfs_partition }} /mnt/finalroot/var/log
            mount -o compress=zstd:6,subvol=@containers {{ final_btrfs_partition }} /mnt/finalroot/var/lib/containers
            mount -o compress=zstd:6,subvol=@postgres {{ final_btrfs_partition }} /mnt/finalroot/var/lib/postgresql
          changed_when: true

        - name: Create swap file on final btrfs
          ansible.builtin.command: btrfs filesystem mkswapfile --size 4G /mnt/finalroot/swap.img
          changed_when: true

    - name: Phase 8 - Copy to final btrfs
      tags: [never, phase8, finalcopy]
      block:
        - name: Ensure conversion metadata exists
          ansible.builtin.fail:
            msg: "Conversion metadata not found. Run with --tags=stage0 first to detect and save conversion parameters."
          when: not metadata_file.stat.exists

        - name: Rsync to final root
          ansible.builtin.shell: |
            rsync -aAXH --info=progress2 \
              --exclude={"/dev/*","/proc/*","/sys/*","/tmp/*","/run/*","/mnt/*","/media/*","/lost+found","/swap.img","/var/log/*","/var/lib/containers/*","/var/lib/postgresql/*"} \
              / /mnt/finalroot/
          changed_when: true

        - name: Rsync logs to final
          ansible.builtin.shell: |
            rsync -aAXH --info=progress2 /var/log/ /mnt/finalroot/var/log/
          changed_when: true

        - name: Rsync containers to final
          ansible.builtin.shell: |
            rsync -aAXH --info=progress2 /var/lib/containers/ /mnt/finalroot/var/lib/containers/
          changed_when: true
          failed_when: false

        - name: Stop postgresql for final copy
          ansible.builtin.systemd:
            name: postgresql
            state: stopped
          failed_when: false

        - name: Final rsync of postgresql data
          ansible.builtin.shell: |
            rsync -aAXH --info=progress2 /var/lib/postgresql/ /mnt/finalroot/var/lib/postgresql/
          changed_when: true

        - name: Get UUID for final partition
          ansible.builtin.shell: |
            blkid -s UUID -o value {{ final_btrfs_partition }}
          register: final_uuid
          changed_when: false

        - name: Display final UUID
          ansible.builtin.debug:
            msg: "Final btrfs UUID: {{ final_uuid.stdout }}"

        - name: Backup fstab from final root
          ansible.builtin.copy:
            src: /mnt/finalroot/etc/fstab
            dest: /mnt/finalroot/etc/fstab.pre-final
            remote_src: true
            mode: preserve

        - name: Update fstab for final root
          ansible.builtin.shell: |
            set -e
            uuid="{{ final_uuid.stdout }}"

            sed -i.old '/^[^#].*[[:space:]]\/[[:space:]]/d' /mnt/finalroot/etc/fstab
            sed -i '/^[^#].*[[:space:]]\/var\/log[[:space:]]/d' /mnt/finalroot/etc/fstab
            sed -i '/^[^#].*[[:space:]]\/var\/lib\/postgresql[[:space:]]/d' /mnt/finalroot/etc/fstab
            sed -i '/nvme1n1/d' /mnt/finalroot/etc/fstab
            sed -i '/nvme2n1/d' /mnt/finalroot/etc/fstab

            cat >> /mnt/finalroot/etc/fstab << EOF
            UUID=$uuid / btrfs compress=zstd:6,subvol=@ 0 1
            UUID=$uuid /var/log btrfs compress=zstd:6,subvol=@log 0 2
            UUID=$uuid /var/lib/containers btrfs compress=zstd:6,subvol=@containers 0 2
            UUID=$uuid /var/lib/postgresql btrfs compress=zstd:6,subvol=@postgres 0 2
            /swap.img none swap sw 0 0
            EOF
          changed_when: true

        - name: Display final fstab
          ansible.builtin.shell: cat /mnt/finalroot/etc/fstab
          register: final_fstab
          changed_when: false

        - name: Show final fstab
          ansible.builtin.debug:
            var: final_fstab.stdout_lines

    - name: Phase 9 - Update bootloader for final btrfs
      tags: [never, phase9, bootloader2]
      block:
        - name: Ensure conversion metadata exists
          ansible.builtin.fail:
            msg: "Conversion metadata not found. Run with --tags=stage0 first to detect and save conversion parameters."
          when: not metadata_file.stat.exists

        - name: Mount filesystems for final chroot
          ansible.builtin.shell: |
            mount --bind /dev /mnt/finalroot/dev
            mount --bind /proc /mnt/finalroot/proc
            mount --bind /sys /mnt/finalroot/sys
            mount --bind /run /mnt/finalroot/run
          changed_when: true

        - name: Check for separate boot partition
          ansible.builtin.shell: |
            findmnt -n /boot || echo "no_separate_boot"
          register: boot_check_final
          changed_when: false

        - name: Mount boot for final
          ansible.builtin.shell: |
            mount --bind /boot /mnt/finalroot/boot
          changed_when: true
          when: boot_check_final.stdout != "no_separate_boot"

        - name: Check for boot/efi
          ansible.builtin.stat:
            path: /boot/efi
          register: boot_efi_stat_final

        - name: Mount boot/efi for final
          ansible.builtin.shell: |
            mount --bind /boot/efi /mnt/finalroot/boot/efi
          changed_when: true
          when: boot_efi_stat_final.stat.exists

        - name: Update initramfs and grub for final boot
          ansible.builtin.shell: |
            chroot /mnt/finalroot /bin/bash -c "update-initramfs -u && update-grub"
          changed_when: true

        - name: Unmount final chroot filesystems
          ansible.builtin.shell: |
            umount /mnt/finalroot/boot/efi 2>/dev/null || true
            umount /mnt/finalroot/boot 2>/dev/null || true
            umount /mnt/finalroot/run
            umount /mnt/finalroot/sys
            umount /mnt/finalroot/proc
            umount /mnt/finalroot/dev
          changed_when: true
          failed_when: false

        - name: Unmount final btrfs mounts
          ansible.builtin.shell: |
            umount /mnt/finalroot/var/lib/postgresql
            umount /mnt/finalroot/var/lib/containers
            umount /mnt/finalroot/var/log
            umount /mnt/finalroot
          changed_when: true

        - name: Display ready for reboot message
          ansible.builtin.debug:
            msg:
              - "Phase 9 complete - final bootloader updated"
              - "System is ready for final reboot"
              - "Run with --tags=reboot2 when ready"

    - name: Phase 10 - Reboot to final btrfs
      tags: [never, reboot2]
      block:
        - name: Reboot to final btrfs
          ansible.builtin.reboot:
            msg: "Rebooting to final btrfs root filesystem"
            reboot_timeout: 600
            post_reboot_delay: 30

        - name: Wait for system
          ansible.builtin.wait_for_connection:
            timeout: 600
            delay: 10

        - name: Verify final boot
          ansible.builtin.shell: |
            root_source=$(findmnt -n -o SOURCE /)
            root_fstype=$(findmnt -n -o FSTYPE /)
            echo "Root device: $root_source"
            echo "Root fstype: $root_fstype"
            if [ "$root_fstype" != "btrfs" ]; then
              echo "ERROR: Not booted to btrfs"
              exit 1
            fi
            if ! echo "$root_source" | grep -q "{{ intermediate_partition_number }}"; then
              echo "SUCCESS: Booted from final partition (not intermediate)"
              exit 0
            else
              echo "WARNING: Still on intermediate partition"
              exit 1
            fi
          register: final_boot_verify
          changed_when: false

        - name: Display final boot verification
          ansible.builtin.debug:
            var: final_boot_verify.stdout_lines

        - name: Display filesystem information
          ansible.builtin.shell: |
            echo "=== Mount points ==="
            df -h / /var/log /var/lib/containers /var/lib/postgresql
            echo ""
            echo "=== Btrfs filesystem ==="
            btrfs filesystem show /
            echo ""
            echo "=== Subvolumes ==="
            btrfs subvolume list /
          register: fs_info
          changed_when: false

        - name: Show filesystem information
          ansible.builtin.debug:
            var: fs_info.stdout_lines

    - name: Phase 11 - Cleanup and resize
      tags: [never, phase11, cleanup]
      block:
        - name: Ensure conversion metadata exists
          ansible.builtin.fail:
            msg: "Conversion metadata not found. Run with --tags=stage0 first to detect and save conversion parameters."
          when: not metadata_file.stat.exists

        - name: Remove intermediate partition
          ansible.builtin.shell: |
            parted -s {{ root_device }} rm {{ intermediate_partition_number }}
          changed_when: true
          failed_when: false

        - name: Move GPT backup to end of disk
          ansible.builtin.shell: |
            sgdisk -e {{ root_device }}
          changed_when: true
          failed_when: false

        - name: Get current filesystem usage in bytes
          ansible.builtin.shell: |
            btrfs filesystem usage / | grep 'Device size:' | awk '{print $3}'
          register: btrfs_device_size
          changed_when: false

        - name: Get actual data usage
          ansible.builtin.shell: |
            btrfs filesystem usage / | grep 'Used:' | head -1 | awk '{print $2}'
          register: btrfs_used
          changed_when: false

        - name: Get actual usage in bytes
          ansible.builtin.shell: |
            df -B1 / | tail -1 | awk '{print $3}'
          register: actual_usage_bytes
          changed_when: false

        - name: Calculate target size in bytes
          ansible.builtin.set_fact:
            target_size_bytes: "{{ [((actual_usage_bytes.stdout | int) + (extra_space_gb | int * 1024 * 1024 * 1024)), ((minimum_final_size_gb | int * 1024 * 1024 * 1024) - (boot_overhead_sectors | int * sector_size | int))] | max }}"

        - name: Get current partition size in sectors
          ansible.builtin.shell: |
            fdisk -l {{ root_device }} | grep '^{{ root_partition }}' | awk '{print $3}'
          register: current_partition_end_sector
          changed_when: false

        - name: Calculate current partition size in bytes
          ansible.builtin.set_fact:
            current_partition_size_bytes: "{{ ((current_partition_end_sector.stdout | int - root_start_sector | int + 1) * sector_size | int) }}"
            current_partition_size_gb: "{{ (((current_partition_end_sector.stdout | int - root_start_sector | int + 1) * sector_size | int) / 1024 / 1024 / 1024) | round(1) }}"
            target_size_gb: "{{ (target_size_bytes | int / 1024 / 1024 / 1024) | round(1) }}"

        - name: Display size information
          ansible.builtin.debug:
            msg:
              - "Current partition size: {{ current_partition_size_gb }}GB"
              - "Target size: {{ target_size_gb }}GB"
              - "Btrfs device size: {{ btrfs_device_size.stdout }}"
              - "Btrfs used: {{ btrfs_used.stdout }}"

        - name: Resize filesystem if needed
          ansible.builtin.shell: |
            if [ {{ target_size_bytes | int }} -lt {{ current_partition_size_bytes | int }} ]; then
              echo "Resizing filesystem to {{ target_size_gb }}G"
              btrfs filesystem resize {{ target_size_gb }}G /
            else
              echo "No filesystem resize needed"
            fi
          register: fs_resize_result
          changed_when: "'Resizing filesystem' in fs_resize_result.stdout"

        - name: Calculate target end sector
          ansible.builtin.set_fact:
            target_end_sector: "{{ (root_start_sector | int + ((target_size_bytes | int + sector_size | int - 1) / sector_size | int) - 1) | int }}"

        - name: Resize partition if needed
          ansible.builtin.shell: |
            if [ {{ target_end_sector | int }} -lt {{ current_partition_end_sector.stdout | int }} ]; then
              echo "Resizing partition to end at sector {{ target_end_sector }}"
              parted -s {{ root_device }} rm 1
              parted -s {{ root_device }} unit s mkpart primary {{ root_start_sector }} {{ target_end_sector }}
            else
              echo "No partition resize needed"
            fi
          register: part_resize_result
          changed_when: "'Resizing partition' in part_resize_result.stdout"

        - name: Reload partition table after resize
          ansible.builtin.command: partprobe {{ root_device }}
          changed_when: true
          when: part_resize_result.changed

        - name: Rescan btrfs devices after partition recreation
          ansible.builtin.command: btrfs device scan
          changed_when: true
          when: part_resize_result.changed

        - name: Expand filesystem to fill partition after recreation
          ansible.builtin.command: btrfs filesystem resize max /
          changed_when: true
          when: part_resize_result.changed

        - name: Update grub after partition resize
          ansible.builtin.command: update-grub
          changed_when: true
          when: part_resize_result.changed

        - name: Calculate AWS disk shrink size from sectors
          ansible.builtin.set_fact:
            final_partition_size_gb: "{{ (target_size_bytes | int / 1024 / 1024 / 1024) | round(1) }}"
            aws_shrink_size_gb: "{{ ((boot_overhead_sectors | int * sector_size | int + target_size_bytes | int) / 1024 / 1024 / 1024) | round(0, 'ceil') | int }}"

        - name: Display completion information
          ansible.builtin.debug:
            msg:
              - "==============================================================================="
              - "CONVERSION COMPLETE"
              - "==============================================================================="
              - ""
              - "Final partition size: {{ final_partition_size_gb }}GB"
              - "Current EBS volume size: {{ total_disk_space_needed_gb }}GB"
              - "Recommended final EBS size: {{ aws_shrink_size_gb }}GB"
              - ""
              - "==============================================================================="
              - "NEXT STEP: SHRINK EBS VOLUME (OPTIONAL - SAVES COSTS)"
              - "==============================================================================="
              - ""
              - "You can now shrink the EBS volume to {{ aws_shrink_size_gb }}GB to save costs."
              - ""
              - "Steps:"
              - "  1. Go to AWS Console → EC2 → Instances"
              - "  2. Find the instance named {{ inventory_hostname }}"
              - "  3. Go to Storage tab → Click on the root volume"
              - "  4. Actions → Modify volume"
              - "  5. Change size to {{ aws_shrink_size_gb }}GB and confirm"
              - "  6. Wait for modification to complete"
              - ""
              - "Note: Volume shrinking requires stopping the instance first."
              - "      Only shrink if you need to reclaim the temporary space."
              - ""
              - "==============================================================================="
              - ""

        - name: Show final filesystem status
          ansible.builtin.shell: |
            echo "=== Disk usage ==="
            df -h /
            echo ""
            echo "=== Btrfs filesystem usage ==="
            btrfs filesystem usage /
            echo ""
            echo "=== Subvolumes ==="
            btrfs subvolume list /
            echo ""
            echo "=== Partition layout ==="
            lsblk {{ root_device }}
          register: final_status
          changed_when: false

        - name: Display final status
          ansible.builtin.debug:
            var: final_status.stdout_lines

        - name: Rename conversion metadata file as completed
          ansible.builtin.command:
            cmd: mv /root/.disk-conversion-metadata-{{ metadata_version }}.json /root/.disk-conversion-metadata-{{ metadata_version }}-completed.json
          changed_when: true

        - name: Conversion metadata preserved
          ansible.builtin.debug:
            msg: "Conversion complete! Metadata saved to /root/.disk-conversion-metadata-{{ metadata_version }}-completed.json for record keeping."
