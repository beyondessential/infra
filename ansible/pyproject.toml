[project]
name = "ansible-setup"
version = "0.1.0"
description = "Ansible setup with mitogen for faster execution"
requires-python = ">=3.10"
dependencies = [
    "ansible>=10.0.0",
    "ansible-core>=2.17.0",
    "dnspython>=2.6.0",
    "mitogen>=0.3.0",
]

[project.scripts]
ansible-setup = "ansible_setup:setup"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
