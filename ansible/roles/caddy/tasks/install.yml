---
- name: Download caddy {{ caddy_version }}
  become: true
  ansible.builtin.get_url:
    url: https://tools.ops.tamanu.io/caddy/{{ caddy_version }}/caddy-{{ ansible_architecture }}-unknown-linux-gnu
    dest: /usr/bin/caddy
    mode: a=rx,u=rwx
  notify:
    - Regenerate caddy manpages
    - Regenerate caddy completions
    - Restart caddy

- name: Add caddy group
  become: true
  ansible.builtin.group:
    name: caddy
    system: true

- name: Add caddy user
  become: true
  ansible.builtin.user:
    group: caddy
    name: caddy
    shell: /usr/bin/false
    home: /var/lib/caddy
    create_home: true
    system: true

- name: Check if we're installing caddy.socket for the first time
  ansible.builtin.stat:
    path: /etc/systemd/system/caddy.socket
  register: socket_first_install

- name: Stop caddy.service if we're about to switch to socket activation
  become: true
  when: not socket_first_install.stat.exists
  ansible.builtin.systemd_service:
    name: caddy.service
    state: stopped

- name: Add caddy socket file
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.socket
    src: "{{ lookup('ansible.builtin.fileglob', 'caddy.socket') }}"
  notify:
    - Reload systemd

- name: Add caddy service file
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service
    src: "{{ lookup('ansible.builtin.fileglob', 'caddy.service') }}"
  notify:
    - Reload systemd

- name: Enable caddy socket
  become: true
  ansible.builtin.systemd:
    name: caddy.socket
    enabled: true
    daemon_reload: true
    state: started

- name: Disable caddy service
  become: true
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: false
