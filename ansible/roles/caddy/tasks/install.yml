---
- name: Download caddy {{ caddy_version }}
  become: true
  ansible.builtin.get_url:
    url: https://tools.ops.tamanu.io/caddy/{{ caddy_version }}/caddy-{{ ansible_architecture }}-unknown-linux-gnu
    dest: /usr/bin/caddy
    mode: a=rx,u=rwx
  notify:
    - Regenerate caddy manpages
    - Regenerate caddy completions

- name: Add caddy group
  become: true
  ansible.builtin.group:
    name: caddy
    system: true

- name: Add caddy user
  become: true
  ansible.builtin.user:
    group: caddy
    name: caddy
    shell: /usr/bin/false
    home: /var/lib/caddy
    create_home: true
    system: true

- name: Add caddy service file
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service
    src: "{{ lookup('ansible.builtin.fileglob', 'caddy.service') }}"
  notify:
    - Reload systemd

- name: Enable caddy
  become: true
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    daemon_reload: true
    state: started
