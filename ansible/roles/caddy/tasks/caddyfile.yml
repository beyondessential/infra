---
- name: Reset Caddyfile
  become: true
  ansible.builtin.get_url:
    url: https://github.com/beyondessential/third-party-builds/raw/refs/heads/main/caddy-files/Caddyfile
    dest: /etc/caddy/Caddyfile

- name: Add issuer config
  become: true
  ansible.builtin.template:
    dest: /etc/caddy/config/issuer
    src: "{{ lookup('ansible.builtin.fileglob', 'issuer.j2') }}"
  notify: Restart caddy
