---
- name: Add kopia backup for caddy (service)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-caddy.service') }}"
    dest: /etc/systemd/system/kopia-backup-caddy.service
  notify:
    - Reload systemd

- name: Add kopia expiry caddy (timer)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-caddy.timer') }}"
    dest: /etc/systemd/system/kopia-backup-caddy.timer
  notify:
    - Reload systemd

- name: Enable kopia backup for caddy
  become: true
  ansible.builtin.systemd:
    name: kopia-backup-caddy.timer
    daemon_reload: true
    state: started
    enabled: true
