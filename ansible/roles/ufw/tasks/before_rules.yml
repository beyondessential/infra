---
# UFW's command syntax can't match on IP header length, so this goes in as raw
# iptables in before.rules, after the chain declarations and before the first
# -A line. The anchor is the last chain declaration rather than the "End
# required lines" comment: blockinfile appends at the end of the file when the
# anchor is missing, which lands after COMMIT, and ufw can't run without the
# declaration anyway. An IPv4 header longer than 20 bytes carries options.
# spec: LNXSRV#host-firewall
- name: Drop TCP with IPv4 options (CVE-2026-98432)
  become: true
  ansible.builtin.blockinfile:
    path: /etc/ufw/before.rules
    insertafter: '^:ufw-not-local - \[0:0\]'
    marker: "# {mark} ANSIBLE MANAGED: drop TCP with IPv4 options"
    block: |
      # CVE-2026-98432: drop TCP with IPv4 options
      -A ufw-before-input -p tcp -m u32 --u32 "0>>22&0x3C=24:60" -j DROP
      -A ufw-before-forward -p tcp -m u32 --u32 "0>>22&0x3C=24:60" -j DROP
  register: ufw_ip_options_rule

- name: Reload ufw after changing before.rules  # noqa: no-handler
  when: ufw_ip_options_rule is changed
  become: true
  ansible.builtin.command: ufw reload
  register: ufw_reload_result
  changed_when: ufw_reload_result.rc == 0
  failed_when:
    - ufw_reload_result.rc != 0
    - "'Firewall not enabled' not in ufw_reload_result.stderr"
