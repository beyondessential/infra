---
# TODO: flip default to true once we know this works fully
ufw_managed: false
dangerously_leave_ufw_alone: false

# Read-only Postgres role bestool-alertd's doctor connects as, via peer auth
# (pg_ident maps root -> this role), so there's no DB password to keep in sync.
# Defined here in `common` so both the postgres role (which creates the role and
# its auth) and the bestool role (which builds alertd's connection URLs) can see
# it — they run in different plays.
alertd_db_role: alertd
# Database alertd's generic cluster-health checks connect to (DATABASE_URL). The
# maintenance DB always exists wherever Postgres runs, so this works even on a
# host with no application database.
alertd_cluster_db: postgres
# Database alertd's schema-aware checks connect to (TAMANU_DATABASE_URL). Empty
# means the host has no such database and that URL is omitted.
alertd_app_db: tamanu
