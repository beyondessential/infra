---
- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reboot
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: Rebooting to apply changes
    pre_reboot_delay: 5

- name: Update package facts
  ansible.builtin.package_facts:

- name: Reload systemd-networkd
  become: true
  ansible.builtin.systemd:
    name: systemd-networkd
    state: reloaded

- name: Restart postgres
  when: postgresql_installed_version is defined
  become: true
  ansible.builtin.systemd:
    name: postgresql@{{ postgresql_installed_version }}-main
    state: restarted

- name: Reload postgres
  when: postgresql_installed_version is defined
  become: true
  ansible.builtin.systemd:
    name: postgresql@{{ postgresql_installed_version }}-main
    state: reloaded

- name: Restart caddy
  become: true
  ansible.builtin.systemd:
    name: caddy
    state: restarted

- name: Reload caddy
  become: true
  ansible.builtin.systemd:
    name: caddy
    state: reloaded

- name: Flush systemd-resolved cache
  become: true
  ansible.builtin.command:
    cmd: resolvectl flush-caches
  failed_when: false
  listen: Reload caddy
