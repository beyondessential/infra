---
- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reboot
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: Rebooting to apply changes
    pre_reboot_delay: 5 # required for mitogen

- name: Update package facts
  ansible.builtin.package_facts:

- name: Restart postgres
  become: true
  ansible.builtin.systemd:
    name: postgresql@{{ postgresql_version }}-main
    state: restarted

- name: Reload postgres
  become: true
  ansible.builtin.systemd:
    name: postgresql@{{ postgresql_version }}-main
    state: reloaded

- name: Restart caddy
  become: true
  ansible.builtin.systemd:
    name: caddy
    state: restarted

- name: Reload caddy
  become: true
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
