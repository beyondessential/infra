---
- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart bestool-alertd
  become: true
  ansible.builtin.systemd:
    name: bestool-alertd.service
    state: restarted

# Re-read the backups directory after a definition changes. The packaged unit
# (bestool >= 1.26) defines a reload, so this re-registers without dropping the
# daemon; the older self-templated unit has no ExecReload, so reload-or-restart
# falls back to a restart there. The daemon also watches the directory, so this
# is belt-and-braces.
- name: Reload bestool-alertd
  become: true
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl reload-or-restart bestool-alertd.service
  changed_when: true

- name: Reboot
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: Rebooting to apply changes
    pre_reboot_delay: 5

- name: Update package facts
  ansible.builtin.package_facts:

- name: Reload systemd-networkd
  become: true
  ansible.builtin.systemd:
    name: systemd-networkd
    state: reloaded

- name: Restart systemd-resolved
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Restart postgres
  when: postgresql_installed_version is defined
  become: true
  ansible.builtin.systemd:
    name: postgresql@{{ postgresql_installed_version }}-main
    state: restarted

- name: Reload postgres
  when: postgresql_installed_version is defined
  become: true
  ansible.builtin.systemd:
    name: postgresql@{{ postgresql_installed_version }}-main
    state: reloaded

- name: Restart caddy
  become: true
  ansible.builtin.systemd:
    name: caddy
    state: restarted

- name: Reload caddy
  become: true
  ansible.builtin.systemd:
    name: caddy
    state: reloaded

- name: Flush systemd-resolved cache
  become: true
  ansible.builtin.command:
    cmd: resolvectl flush-caches
  changed_when: true
  failed_when: false
  listen: Reload caddy
