---
- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reboot
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: Rebooting to apply changes
    pre_reboot_delay: 5 # required for mitogen

- name: Update package facts
  ansible.builtin.package_facts:

- name: Reload systemd-networkd
  become: true
  ansible.builtin.systemd:
    name: systemd-networkd
    state: reloaded

- name: Restart postgres
  become: true
  block:
    - name: Get postgresql_version if not set
      when: postgresql_version is not defined
      ansible.builtin.shell: |
        systemctl list-units --type=service --all | grep postgresql@ | sed 's/.*postgresql@\([0-9]*\)-main.*/\1/' | head -1
      register: postgres_running_version
      changed_when: false
      failed_when: false
    
    - name: Set postgresql_version from running service
      when: postgres_running_version.stdout | length > 0
      ansible.builtin.set_fact:
        postgresql_version: "{{ postgres_running_version.stdout }}"
    
    - name: Restart postgresql service
      ansible.builtin.systemd:
        name: postgresql@{{ postgresql_version }}-main
        state: restarted


- name: Reload postgres
  become: true
  block:
    - name: Get postgresql_version if not set
      when: postgresql_version is not defined
      ansible.builtin.shell: |
        systemctl list-units --type=service --all | grep postgresql@ | sed 's/.*postgresql@\([0-9]*\)-main.*/\1/' | head -1
      register: postgres_running_version
      changed_when: false
      failed_when: false
    
    - name: Set postgresql_version from running service
      when: postgres_running_version.stdout | length > 0
      ansible.builtin.set_fact:
        postgresql_version: "{{ postgres_running_version.stdout }}"
    
    - name: Reload postgresql service
      ansible.builtin.systemd:
        name: postgresql@{{ postgresql_version }}-main
        state: reloaded


- name: Restart caddy
  become: true
  ansible.builtin.systemd:
    name: caddy
    state: restarted

- name: Reload caddy
  become: true
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
