---
- name: Upgrade mSupply
  when: msupply_enabled | bool
  block:
    # spec: LNXMSP#installation-and-upgrades
    - name: Restart mSupply service
      become: true
      ansible.builtin.systemd:
        name: msupply.service
        state: restarted
        enabled: true
      notify:
        - Reload caddy
