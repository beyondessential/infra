---
- name: Set up the Munin data directory
  ansible.builtin.include_tasks: data-dir.yml

- name: Install Munin
  become: true
  ansible.builtin.apt:
    name:
      - munin # master: the munin-cron gather/render cycle
      - munin-node # local node daemon + plugins
    state: present

- name: Ensure the Munin data directory is owned by munin
  become: true
  ansible.builtin.file:
    path: /var/lib/munin
    state: directory
    owner: munin
    group: munin
    mode: "0755"

# spec: LNXSRV#metrics
- name: Bind munin-node to loopback only
  become: true
  ansible.builtin.lineinfile:
    path: /etc/munin/munin-node.conf
    regexp: '^\s*host\s'
    line: host 127.0.0.1
  notify: Restart munin-node

- name: Enable and start munin-node
  become: true
  ansible.builtin.systemd:
    name: munin-node
    state: started
    enabled: true

- name: Check whether Caddy is present
  ansible.builtin.stat:
    path: /etc/caddy/servers
  register: munin_caddy_servers_dir

- name: Configure the Caddy tailnet vhost for Munin
  when:
    - munin_caddy_servers_dir.stat.exists
    - tailscale_name is defined
  become: true
  ansible.builtin.template:
    src: munin-server.j2
    dest: /etc/caddy/servers/munin
    mode: "0644"
  notify: Reload caddy
