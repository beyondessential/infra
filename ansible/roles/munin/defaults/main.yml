---
# Munin runs entirely on-box (node + master + rendering on the same host); the
# rendered HTML is exposed only over the tailnet. Enabled fleet-wide by default;
# set munin_enabled: false per inventory to opt a deployment out.
munin_enabled: true

# Port Caddy serves the rendered Munin UI on over the tailnet. Distinct from
# munin-node's canonical 4949 (which stays on loopback) to avoid the same port
# appearing inside and out, and below the Linux ephemeral range so the listener
# never loses a boot-time bind race. This port is the Tailscale ACL target.
munin_tailscale_port: 4950
