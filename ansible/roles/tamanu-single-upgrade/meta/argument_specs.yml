---
argument_specs:
  main:
    description: |
      Upgrade a single Tamanu server (API and frontend).
    options:
      type:
        type: str
        required: true
        choices:
          - central
          - facility
        description: |
          Type of server to configure.
          Must be one of 'central' or 'facility'.

      db_name:
        type: str
        required: true
        description: |
          Name of the Tamanu database.
