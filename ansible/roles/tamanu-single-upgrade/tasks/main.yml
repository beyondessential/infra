---
- name: Report what this upgrade will do
  ansible.builtin.debug:
    msg: >-
      tamanu_version: {{ previous_tamanu_version | default('(none)') }} -> {{ tamanu_version }};
      tamanu_frontend_version: {{ previous_tamanu_frontend_version | default('(none)') }} -> {{ tamanu_frontend_version }}

- name: Collect which services are running
  ansible.builtin.service_facts:
- name: Print service facts
  ansible.builtin.debug:
    msg: "{{ ansible_facts.services | list | select('match', '^tamanu-' + tamanu_server_type + '.*') | reject('match', '.+@[.]service$') }}"

# Stops only the kind-scoped API/tasks/sync/fhir services. The trailing
# dash filters out the legacy `tamanu-facility` singleton (no dash after
# `facility`) and tamanu-frontend (no kind segment), so the frontend keeps
# serving traffic while we migrate.
- name: Stop the API/tasks/sync/fhir services
  become: true
  ansible.builtin.command: /usr/bin/bestool tamanu stop tamanu-{{ tamanu_server_type }}-
  changed_when: true

- name: Stop old singleton patient portal service
  when: tamanu_server_type == 'central'
  become: true
  ansible.builtin.systemd:
    name: tamanu-patientportal
    state: stopped
    enabled: false
  failed_when: false
  notify: Reload caddy

- name: Mask old singleton patient portal service
  when: tamanu_server_type == 'central'
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/tamanu-patientportal.service
    src: /dev/null
    state: link
    force: true
  notify: Reload systemd

- name: Stop old single facility service
  when: tamanu_server_type == 'facility'
  become: true
  ansible.builtin.systemd:
    name: tamanu-facility
    state: stopped
    enabled: false
  failed_when: false
  notify: Reload caddy

- name: Remove old single facility quadlet
  when: tamanu_server_type == 'facility'
  become: true
  ansible.builtin.file:
    path: /etc/containers/systemd/tamanu-facility.container
    state: absent
  notify: Reload systemd

- name: Mask old single facility service
  when: tamanu_server_type == 'facility'
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/tamanu-facility.service
    src: /dev/null
    state: link
    force: true
  notify: Reload systemd

- name: Reload caddy
  ansible.builtin.meta: flush_handlers
- name: Roll the frontend service
  when: tamanu_server_type == 'facility'
  become: true
  ansible.builtin.command: /usr/bin/bestool tamanu restart tamanu-frontend
  changed_when: true

- name: Roll the frontend and patient portal services
  when: tamanu_server_type == 'central'
  become: true
  ansible.builtin.command: /usr/bin/bestool tamanu restart tamanu-frontend tamanu-patientportal
  changed_when: true

# cleanup any legacy or experiments; bestool's frontend and patient portal
# expectations only admit @a/@b, so any other instance has to be cleaned
# up by hand.
- name: Stop frontend services that don't need to be running
  loop: "{{ ansible_facts.services | list | select('match', '^tamanu-frontend@.*') | reject('match', '^tamanu-frontend@(a|b)[.]service$') | reject('match', '.+@[.]service$')
    }}"
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  notify: Reload caddy

- name: Stop patient portal services that don't need to be running
  when: tamanu_server_type == 'central'
  loop: "{{ ansible_facts.services | list | select('match', '^tamanu-patientportal@.*') | reject('match', '^tamanu-patientportal@(a|b)[.]service$') | reject('match',
    '.+@[.]service$') }}"
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  notify: Reload caddy

- name: Reload caddy
  ansible.builtin.meta: flush_handlers
- name: Drop reporting schema if present
  become: true
  become_user: postgres
  community.postgresql.postgresql_schema:
    login_db: "{{ db_name }}"
    name: reporting
    state: absent
    cascade_drop: true

- name: Migrate the database
  ansible.builtin.command: tamanu-run {{ tamanu_version }} migrate
  changed_when: true

- name: Create reporting schema owned by tamanu
  become: true
  become_user: postgres
  community.postgresql.postgresql_schema:
    login_db: "{{ db_name }}"
    name: reporting
    owner: tamanu
    state: present

# Bring everything that should be Up back up. Idempotent: services already
# running are left alone, so this also doubles as recovery for a partial
# previous run that left things stopped.
- name: Start the standard services
  become: true
  ansible.builtin.command: /usr/bin/bestool tamanu start
  changed_when: true
  notify: Reload caddy

- name: Reload caddy
  ansible.builtin.meta: flush_handlers
