---
- name: Set patient portal enabled fact
  ansible.builtin.set_fact:
    patient_portal_enabled: "{{ tamanu_server_type == 'central' and ((ansible_system_vendor == 'Amazon EC2' and ansible_ec2_tag_PatientPortalFQDN is defined) or (patient_portal_fqdn is defined)) }}"

- name: Collect which services are running
  ansible.builtin.service_facts:
- name: Print service facts
  ansible.builtin.debug:
    msg: "{{ ansible_facts.services | list | select('match', '^tamanu-' + tamanu_server_type + '.*') | reject('match', '.+@[.]service$') }}"

- name: Stop the application services
  loop: "{{ ansible_facts.services | list | select('match', '^tamanu-' + tamanu_server_type + '.*') | reject('match', '.+@[.]service$') }}"
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  notify: Reload caddy

- name: Stop old single facility service
  when: tamanu_server_type == 'facility'
  become: true
  ansible.builtin.systemd:
    name: tamanu-facility
    state: stopped
    enabled: false
  notify: Reload caddy

- name: Reload caddy
  meta: flush_handlers

- name: Upgrade the frontend service A
  become: true
  ansible.builtin.systemd:
    name: tamanu-frontend@a
    state: restarted
    enabled: true
  notify: Reload caddy

- name: Reload caddy
  meta: flush_handlers

- name: Wait for new frontend to start
  ansible.builtin.wait_for:
    timeout: 10
    # This used to be a check for the frontend to exist in DNS, but that was
    # unreliable as it depended on the system DNS connecting to the netavark
    # DNS, which was not always the case. Waiting for 10 seconds is suboptimal,
    # but it's better than nothing.

- name: Upgrade the frontend service B
  become: true
  ansible.builtin.systemd:
    name: tamanu-frontend@b
    state: restarted
    enabled: true
  notify: Reload caddy

- name: Reload caddy
  meta: flush_handlers

- name: Upgrade the patient portal service
  when: patient_portal_enabled
  become: true
  ansible.builtin.systemd:
    name: tamanu-patientportal
    state: restarted
    enabled: true
  notify: Reload caddy

- name: Reload caddy
  when: patient_portal_enabled
  meta: flush_handlers

# cleanup any legacy or experiments;
# two frontend services is way more than enough and only really serves
# to provide a way to do a rolling upgrade
- name: Stop frontend services that don't need to be running
  loop: "{{ ansible_facts.services | list | select('match', '^tamanu-frontend@.*') | reject('match', '^tamanu-frontend@(a|b)[.]service$') | reject('match', '.+@[.]service$') }}"
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  notify: Reload caddy

- name: Reload caddy
  meta: flush_handlers

- name: Migrate the database
  ansible.builtin.command: tamanu-run {{ tamanu_version }} migrate

# we ensure that the standard loadout is up
# we used to restore all services as they
# existed on the machine, but that led to drift

- name: Start the standard facility services
  when: tamanu_server_type == 'facility'
  loop:
    - "api@1"
    - "api@2"
    - tasks
    - sync
  become: true
  ansible.builtin.systemd:
    name: "tamanu-facility-{{ item }}.service"
    state: started
    enabled: true
  notify: Reload caddy

- name: Start the standard central services
  when: tamanu_server_type == 'central'
  loop:
    - "api@1"
    - "api@2"
    - tasks
    - fhir-refresh
    - fhir-resolve
  become: true
  ansible.builtin.systemd:
    name: "tamanu-central-{{ item }}.service"
    state: started
    enabled: true
  notify: Reload caddy

- name: Reload caddy
  meta: flush_handlers
