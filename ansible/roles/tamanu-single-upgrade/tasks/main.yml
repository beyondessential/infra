---
# tamanu_version_changed / tamanu_frontend_version_changed are set in
# tamanu-single-install/tasks/facts.yml during the pre-upgrade play.
# A frontend-only bump (tamanu_version unchanged) skips API service churn
# and patient portal restart — only the frontend reloads. DB migration
# always runs (idempotent) so a partial-failure rerun still applies it.
#
# When the pre play is skipped (--skip-tags pre), those facts aren't set,
# and the env file already has the new version so re-reading it would
# falsely report "unchanged". Default to true to do all the work.
- name: Default version-changed facts when pre play was skipped
  ansible.builtin.set_fact:
    tamanu_version_changed: "{{ tamanu_version_changed | default(true) }}"
    tamanu_frontend_version_changed: "{{ tamanu_frontend_version_changed | default(true) }}"

- name: Report what this upgrade will do
  ansible.builtin.debug:
    msg: >-
      tamanu_version: {{ previous_tamanu_version | default('(none)') }} -> {{ tamanu_version }}
      ({{ 'changed' if tamanu_version_changed else 'unchanged' }});
      tamanu_frontend_version: {{ previous_tamanu_frontend_version | default('(none)') }} -> {{ tamanu_frontend_version }}
      ({{ 'changed' if tamanu_frontend_version_changed else 'unchanged' }})

- name: Collect which services are running
  ansible.builtin.service_facts:
- name: Print service facts
  ansible.builtin.debug:
    msg: "{{ ansible_facts.services | list | select('match', '^tamanu-' + tamanu_server_type + '.*') | reject('match', '.+@[.]service$') }}"

# Stops only the kind-scoped API/tasks/sync/fhir services. The trailing
# dash filters out the legacy `tamanu-facility` singleton (no dash after
# `facility`) and tamanu-frontend (no kind segment), so the frontend keeps
# serving traffic while we migrate. Patient portal is handled separately
# below because it's pinned to tamanu_version, not tamanu_frontend_version.
- name: Stop the API/tasks/sync/fhir services
  when: tamanu_version_changed
  become: true
  ansible.builtin.command: /usr/bin/bestool tamanu stop tamanu-{{ tamanu_server_type }}-

- name: Stop old single facility service
  when: tamanu_server_type == 'facility'
  become: true
  ansible.builtin.systemd:
    name: tamanu-facility
    state: stopped
    enabled: false
  failed_when: false
  notify: Reload caddy

- name: Remove old single facility quadlet
  when: tamanu_server_type == 'facility'
  become: true
  ansible.builtin.file:
    path: /etc/containers/systemd/tamanu-facility.container
    state: absent
  notify: Reload systemd

- name: Mask old single facility service
  when: tamanu_server_type == 'facility'
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/tamanu-facility.service
    src: /dev/null
    state: link
    force: true
  notify: Reload systemd

- name: Reload caddy
  meta: flush_handlers

# Frontend pods mount /etc/tamanu/${TAMANU_VERSION}:/config, so a tamanu_version
# bump also forces a frontend restart even when the frontend image tag itself
# is unchanged. `bestool tamanu restart` does the rolling A->B dance with a
# readiness probe and caddy reload between instances.
- name: Roll the frontend services
  when: tamanu_version_changed or tamanu_frontend_version_changed
  become: true
  ansible.builtin.command: /usr/bin/bestool tamanu restart tamanu-frontend

# Patient portal is pinned to tamanu_version (not tamanu_frontend_version),
# so a frontend-only bump doesn't touch it. The actual on/off decision is
# the `features.patientPortal` setting in the Tamanu DB, which bestool
# reads — if the portal is disabled there, the expectation is Down and
# this restart is a silent no-op, no need to mirror the flag in ansible.
- name: Restart the patient portal
  when:
    - tamanu_server_type == 'central'
    - tamanu_version_changed
  become: true
  ansible.builtin.command: /usr/bin/bestool tamanu restart tamanu-patientportal

# cleanup any legacy or experiments; bestool's frontend expectation only
# admits @a/@b, so any other instance has to be cleaned up by hand.
- name: Stop frontend services that don't need to be running
  loop: "{{ ansible_facts.services | list | select('match', '^tamanu-frontend@.*') | reject('match', '^tamanu-frontend@(a|b)[.]service$') | reject('match', '.+@[.]service$') }}"
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  notify: Reload caddy

- name: Reload caddy
  meta: flush_handlers

# The reporting schema is rebuilt from definitions on each migrate, but its
# objects can reference columns that the upcoming migration drops or renames.
# Drop it cascade beforehand so the migration is unblocked; migrate recreates it.
- name: Drop reporting schema if present
  become: true
  become_user: postgres
  community.postgresql.postgresql_schema:
    login_db: "{{ db_name }}"
    name: reporting
    state: absent
    cascade_drop: true

- name: Migrate the database
  ansible.builtin.command: tamanu-run {{ tamanu_version }} migrate

# Bring everything that should be Up back up. Idempotent: services already
# running (frontend, patient portal) are left alone.
- name: Start the standard services
  when: tamanu_version_changed
  become: true
  ansible.builtin.command: /usr/bin/bestool tamanu start
  notify: Reload caddy

- name: Reload caddy
  meta: flush_handlers
