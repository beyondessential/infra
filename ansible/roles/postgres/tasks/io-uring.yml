---
# The baseline limits io_uring to root. PostgreSQL does its I/O through
# io_uring, so its group is let in here, where the group exists.
- name: Look up the postgres group
  ansible.builtin.getent:
    database: group
    key: postgres

# spec: LNXSRV#kernel-parameters
- name: Let the postgres group use io_uring
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-postgres-io-uring.conf
    mode: "0644"
    content: |
      # Managed by ansible (postgres/io-uring.yml).
      kernel.io_uring_group = {{ ansible_facts.getent_group.postgres[1] }}
  notify: Reload sysctl

# New PostgreSQL backends need the group before they open their rings.
- name: Apply the io_uring group now
  ansible.builtin.meta: flush_handlers
