---
- name: Detect filesystem type for PostgreSQL data directory
  ansible.builtin.shell: df -T /var/lib/postgresql | tail -1 | awk '{print $2}'
  register: postgresql_filesystem_type
  changed_when: false

- name: Check if snapper has a postgres configuration
  when: postgresql_filesystem_type.stdout == 'btrfs'
  become: true
  ansible.builtin.shell: snapper -c postgres list >/dev/null 2>&1
  register: snapper_postgres_config
  changed_when: false
  ignore_errors: true

- name: Set backup method based on filesystem
  ansible.builtin.set_fact:
    postgres_backup_method: "{{ 'btrfs' if (postgresql_filesystem_type.stdout == 'btrfs' and snapper_postgres_config is defined and snapper_postgres_config.rc == 0) else 'ext4' }}"

- name: Display backup method
  ansible.builtin.debug:
    msg: "Using {{ postgres_backup_method }} backup method for postgres (filesystem: {{ postgresql_filesystem_type.stdout }})"

- name: Set archive command
  become: true
  become_user: postgres
  community.postgresql.postgresql_alter_system:
    param: archive_command
    value: "/bin/true"

- name: Cleanup ext4 backup method before switching to btrfs
  when: postgres_backup_method == 'btrfs'
  ansible.builtin.include_tasks: backup/cleanup-ext4.yml

- name: Include btrfs backup tasks
  when: postgres_backup_method == 'btrfs'
  ansible.builtin.include_tasks: backup/on-btrfs.yml

- name: Cleanup btrfs backup method before switching to ext4
  when: postgres_backup_method == 'ext4'
  ansible.builtin.include_tasks: backup/cleanup-btrfs.yml

- name: Include ext4 backup tasks
  when: postgres_backup_method == 'ext4'
  ansible.builtin.include_tasks: backup/on-ext4.yml

- name: Add kopia backup for postgres (timer)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-postgres.timer') }}"
    dest: /etc/systemd/system/kopia-backup-postgres.timer
  notify:
    - Reload systemd

- name: Enable kopia backup for postgres
  become: true
  ansible.builtin.systemd:
    name: kopia-backup-postgres.timer
    daemon_reload: true
    state: started
    enabled: true
