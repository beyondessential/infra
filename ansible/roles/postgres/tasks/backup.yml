---
- name: Install mergerfs and bindfs
  become: true
  ansible.builtin.apt:
    name:
      - mergerfs
      - bindfs
  notify:
    - Update package facts

- name: Create kopia pgdata mountpoint
  become: true
  ansible.builtin.file:
    path: /var/lib/kopia/pgdata
    state: directory
    owner: kopia
    group: kopia

- name: Create postgres kopia user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: kopia
    role_attr_flags: SUPERUSER

- name: Allow kopia peer access to postgres
  become: true
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/current/main/pg_hba.conf
    contype: local
    users: kopia
    databases: postgres
    method: peer
    address: "" # workaround for https://github.com/ansible-collections/community.postgresql/issues/777 (fixed in 3.9.1)
  notify: Reload postgres

- name: Set archive command
  become: true
  become_user: postgres
  community.postgresql.postgresql_set:
    name: archive_command
    value: "/bin/true"

- name: Add kopia backup for postgres (script)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-postgres.sh') }}"
    dest: /var/lib/kopia/backup-postgres.sh
    mode: "0755"

- name: Add kopia backup for postgres (service)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-postgres.service') }}"
    dest: /etc/systemd/system/kopia-backup-postgres.service
  notify:
    - Reload systemd

- name: Add kopia backup for postgres (timer)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-postgres.timer') }}"
    dest: /etc/systemd/system/kopia-backup-postgres.timer
  notify:
    - Reload systemd

- name: Enable kopia backup for postgres
  become: true
  ansible.builtin.systemd:
    name: kopia-backup-postgres.timer
    daemon_reload: true
    state: started
    enabled: true
