---
- name: Add pgdg apt key
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'apt.asc') }}"
    dest: /etc/apt/keyrings/pgdg.asc

- name: Add pgdg repo
  become: true
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main
    filename: apt_postgresql_org_pub_repos_apt
    state: present

- name: Remove duplicate postgres apt source line
  become: true
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/apt_postgresql_org_pub_repos_apt.list
    line: "deb https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: absent

- name: Prioritise pgdg repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-pgdg
    content: |
      Package: *
      Pin: release o=apt.postgresql.org
      Pin-Priority: 900

- name: Install postgresql
  become: true
  ansible.builtin.apt:
    name: postgresql-{{ postgresql_version }}
    state: present
  notify:
    - Update package facts
    - Restart postgres

# during first install, the service is not started (handlers are not run) until
# after the play completes, and thus the symlink step below fails. Workaround by
# forcing the handlers to run now.
- name: Make sure postgresql is running now
  meta: flush_handlers

- name: Symlink current postgresql version configuration
  become: true
  ansible.builtin.file:
    src: /etc/postgresql/{{ postgresql_version }}
    dest: /etc/postgresql/current
    state: link

- name: Symlink current postgresql version data
  become: true
  ansible.builtin.file:
    src: /var/lib/postgresql/{{ postgresql_version }}/main
    dest: /var/lib/postgresql/current
    state: link
