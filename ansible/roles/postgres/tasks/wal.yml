---
- name: Set WAL expiry
  become: true
  become_user: postgres
  community.postgresql.postgresql_alter_system:
    param: archive_timeout
    value: "300"
    # recommended to be no shorter than 1 minute
    # this helps keep pg_wal size reasonable

- name: Enable archive mode in postgres
  become: true
  become_user: postgres
  community.postgresql.postgresql_alter_system:
    param: archive_mode
    value: "on"
    # Changing archive_mode requires a restart, so we turn it on up front:
    # this lets us switch on real WAL archiving (for point-in-time recovery)
    # later without a restart-under-load. Today we do NOT archive anywhere --
    # archive_command is a no-op (/bin/true, see backup.yml) and each kopia
    # backup is a self-contained base backup. So archive_mode=on currently
    # buys only the no-restart future option, nothing more.
