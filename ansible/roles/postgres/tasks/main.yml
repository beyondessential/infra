---
- ansible.builtin.include_tasks: detect-version.yml
- ansible.builtin.include_tasks: repo.yml
- ansible.builtin.include_tasks: upgrade.yml
  when: postgresql_upgrade_enabled
- ansible.builtin.include_tasks: packages.yml
- ansible.builtin.include_tasks: psql.yml
- ansible.builtin.include_tasks: access.yml
- ansible.builtin.include_tasks: btrfs-tune.yml
  when: not (aws_postgres_uses_ext4 is defined and aws_postgres_uses_ext4)
- ansible.builtin.include_tasks: wal.yml
- ansible.builtin.include_tasks: backup.yml
- ansible.builtin.set_fact:
    postgresql_configured: true
    postgresql_version: "{{ postgresql_version }}"
