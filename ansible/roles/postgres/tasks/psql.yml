---
- name: Find psqlrc location
  ansible.builtin.command: pg_config --sysconfdir
  register: pg_config_output

- name: Configure system-wide psqlrc
  become: true
  ansible.builtin.copy:
    dest: "{{ pg_config_output.stdout }}/psqlrc"
    src: "{{ lookup('ansible.builtin.fileglob', 'psqlrc') }}"
