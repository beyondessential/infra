---
- name: Unhold old postgresql packages for upgrade
  become: true
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - postgresql-{{ installed_postgresql_version }}
    - postgresql-client-{{ installed_postgresql_version }}
  failed_when: false

- name: Detect filesystem type for PostgreSQL data directory
  ansible.builtin.shell: df -T /var/lib/postgresql | tail -1 | awk '{print $2}'
  register: postgresql_filesystem_type
  changed_when: false

- name: Set pg_upgrade method based on filesystem
  ansible.builtin.set_fact:
    pg_upgrade_method: "{{ '--clone' if postgresql_filesystem_type.stdout == 'btrfs' else '--link' }}"

- name: Display upgrade method
  ansible.builtin.debug:
    msg: "Using pg_upgrade method: {{ pg_upgrade_method }} (filesystem: {{ postgresql_filesystem_type.stdout }})"

- name: Determine snapshot method for upgrade
  ansible.builtin.set_fact:
    postgresql_snapshot_method: "{{ 'btrfs' if postgresql_filesystem_type.stdout == 'btrfs' else 'none' }}"

- name: Display chosen snapshot method
  ansible.builtin.debug:
    msg: "Snapshot method for this upgrade: {{ postgresql_snapshot_method }}"

- name: Create pre-upgrade snapshot with btrfs
  when: postgresql_snapshot_method == 'btrfs'
  become: true
  block:
    - name: Get UUID of /var/lib/postgresql mount
      ansible.builtin.command:
        cmd: findmnt -n -o UUID /var/lib/postgresql
      register: pg_mount_uuid
      changed_when: false

    - name: Get FSROOT of /var/lib/postgresql mount
      ansible.builtin.command:
        cmd: findmnt -n -o FSROOT /var/lib/postgresql
      register: pg_mount_fsroot
      changed_when: false

    - name: Set btrfs snapshot facts
      ansible.builtin.set_fact:
        pg_btrfs_subvol_name: "{{ pg_mount_fsroot.stdout | trim | regex_replace('^/', '') }}"
        pg_btrfs_snapshot_name: "{{ pg_mount_fsroot.stdout | trim | regex_replace('^/', '') }}-pre-pgupgrade-{{ installed_postgresql_version }}-to-{{ postgresql_desired_version }}-{{ ansible_date_time.iso8601_basic_short }}"

    - name: Mount btrfs top-level for snapshot
      ansible.builtin.shell:
        cmd: |
          set -e
          mkdir -p /mnt/btrfs-toplevel
          mountpoint -q /mnt/btrfs-toplevel || mount -o subvolid=5 UUID={{ pg_mount_uuid.stdout }} /mnt/btrfs-toplevel
      changed_when: true

    - name: Create read-only pre-upgrade snapshot
      ansible.builtin.command:
        cmd: btrfs subvolume snapshot -r /mnt/btrfs-toplevel/{{ pg_btrfs_subvol_name }} /mnt/btrfs-toplevel/{{ pg_btrfs_snapshot_name }}
      register: btrfs_pre_snapshot

    - name: Unmount btrfs top-level
      ansible.builtin.command:
        cmd: umount /mnt/btrfs-toplevel
      changed_when: true

    - name: Display btrfs snapshot information
      ansible.builtin.debug:
        msg: "Created pre-upgrade btrfs snapshot: {{ pg_btrfs_snapshot_name }} (visible at top-level subvolid=5)"

- name: Warn when no snapshot is taken
  when: postgresql_snapshot_method == 'none'
  ansible.builtin.debug:
    msg: "No snapshot will be taken (filesystem is {{ postgresql_filesystem_type.stdout }}, not btrfs); the upgrade will proceed without a rollback point."

- name: Install new PostgreSQL version
  become: true
  ansible.builtin.apt:
    name: postgresql-{{ postgresql_desired_version }}
    state: present
    update_cache: true

- name: Create new PostgreSQL version directory
  become: true
  ansible.builtin.file:
    path: /var/lib/postgresql/{{ postgresql_desired_version }}
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: Ensure new PostgreSQL version directory has correct ownership
  become: true
  ansible.builtin.file:
    path: /var/lib/postgresql/{{ postgresql_desired_version }}
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: Stop new PostgreSQL service (if auto-started)
  become: true
  ansible.builtin.systemd:
    name: "postgresql@{{ postgresql_desired_version }}-main"
    state: stopped
  ignore_errors: true

- name: Check if new cluster was auto-initialized
  become: true
  ansible.builtin.stat:
    path: /var/lib/postgresql/{{ postgresql_desired_version }}/main/PG_VERSION
  register: new_cluster_exists

- name: Remove auto-initialized new cluster
  when: new_cluster_exists.stat.exists
  become: true
  ansible.builtin.file:
    path: /var/lib/postgresql/{{ postgresql_desired_version }}/main
    state: absent

- name: Create new PostgreSQL configuration directory
  become: true
  ansible.builtin.file:
    path: /etc/postgresql/{{ postgresql_desired_version }}/main
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: Copy PostgreSQL configuration files from old version
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: /etc/postgresql/{{ installed_postgresql_version }}/main/
    dest: /etc/postgresql/{{ postgresql_desired_version }}/main/
    owner: postgres
    group: postgres

- name: Update data_directory in new PostgreSQL config
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgresql_desired_version }}/main/postgresql.conf
    regexp: "^data_directory\\s*="
    line: "data_directory = '/var/lib/postgresql/{{ postgresql_desired_version }}/main'"

- name: Update cluster_name in new PostgreSQL config
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgresql_desired_version }}/main/postgresql.conf
    regexp: "^cluster_name\\s*="
    line: "cluster_name = '{{ postgresql_desired_version }}/main'"

- name: Update external_pid_file in new PostgreSQL config
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgresql_desired_version }}/main/postgresql.conf
    regexp: "^external_pid_file\\s*="
    line: "external_pid_file = '/var/run/postgresql/{{ postgresql_desired_version }}-main.pid'"

- name: Update hba_file in new PostgreSQL config
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgresql_desired_version }}/main/postgresql.conf
    regexp: "^hba_file\\s*="
    line: "hba_file = '/etc/postgresql/{{ postgresql_desired_version }}/main/pg_hba.conf'"

- name: Update ident_file in new PostgreSQL config
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgresql_desired_version }}/main/postgresql.conf
    regexp: "^ident_file\\s*="
    line: "ident_file = '/etc/postgresql/{{ postgresql_desired_version }}/main/pg_ident.conf'"

- name: Ensure new PostgreSQL data directory is empty
  become: true
  ansible.builtin.shell:
    cmd: rm -rf /var/lib/postgresql/{{ postgresql_desired_version }}/main/* /var/lib/postgresql/{{ postgresql_desired_version }}/main/.[!.]* 2>/dev/null || true

- name: Initialize new PostgreSQL cluster
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: /usr/lib/postgresql/{{ postgresql_desired_version }}/bin/initdb -D /var/lib/postgresql/{{ postgresql_desired_version }}/main
  register: initdb_result

- name: Stop all PostgreSQL services
  become: true
  ansible.builtin.systemd:
    name: "postgresql@{{ installed_postgresql_version }}-main"
    state: stopped

- name: Stop new PostgreSQL service
  become: true
  ansible.builtin.systemd:
    name: "postgresql@{{ postgresql_desired_version }}-main"
    state: stopped

- name: Check data checksum status on old cluster
  become: true
  become_user: postgres
  ansible.builtin.shell:
    cmd: >
      /usr/lib/postgresql/{{ installed_postgresql_version }}/bin/pg_controldata
      /var/lib/postgresql/{{ installed_postgresql_version }}/main
      | awk -F': *' '/Data page checksum version/ {print $2}'
  register: old_cluster_checksum_version
  changed_when: false

- name: Notify before enabling data checksums
  when: old_cluster_checksum_version.stdout | trim == '0'
  ansible.builtin.debug:
    msg: >-
      Data checksums are disabled on the old cluster. Enabling them now with
      pg_checksums; this rewrites every page and may take a long time on large
      databases.

- name: Enable data checksums on old cluster
  when: old_cluster_checksum_version.stdout | trim == '0'
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >
      /usr/lib/postgresql/{{ installed_postgresql_version }}/bin/pg_checksums
      --enable
      --pgdata=/var/lib/postgresql/{{ installed_postgresql_version }}/main
  register: pg_checksums_result

- name: Check upgrade compatibility
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >
      /usr/lib/postgresql/{{ postgresql_desired_version }}/bin/pg_upgrade
      --old-bindir=/usr/lib/postgresql/{{ installed_postgresql_version }}/bin
      --new-bindir=/usr/lib/postgresql/{{ postgresql_desired_version }}/bin
      --old-datadir=/var/lib/postgresql/{{ installed_postgresql_version }}/main
      --new-datadir=/var/lib/postgresql/{{ postgresql_desired_version }}/main
      --old-options="-c config_file=/etc/postgresql/{{ installed_postgresql_version }}/main/postgresql.conf"
      --new-options="-c config_file=/etc/postgresql/{{ postgresql_desired_version }}/main/postgresql.conf"
      --socketdir=/tmp
      {{ pg_upgrade_method }}
      --check
    chdir: /var/lib/postgresql
  register: pg_upgrade_check
  changed_when: false
  ignore_errors: true

- name: Check if clone method failed
  ansible.builtin.set_fact:
    clone_failed: "{{ pg_upgrade_check.rc != 0 and 'could not clone file' in (pg_upgrade_check.stdout | default('')) }}"

- name: Fallback to copy method if clone failed
  when: clone_failed
  ansible.builtin.set_fact:
    pg_upgrade_method: ""

- name: Display fallback to copy method
  when: clone_failed
  ansible.builtin.debug:
    msg: "Clone method failed with 'could not clone file' error. Retrying with copy method."

- name: Retry upgrade compatibility check with copy method
  when: clone_failed
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >
      /usr/lib/postgresql/{{ postgresql_desired_version }}/bin/pg_upgrade
      --old-bindir=/usr/lib/postgresql/{{ installed_postgresql_version }}/bin
      --new-bindir=/usr/lib/postgresql/{{ postgresql_desired_version }}/bin
      --old-datadir=/var/lib/postgresql/{{ installed_postgresql_version }}/main
      --new-datadir=/var/lib/postgresql/{{ postgresql_desired_version }}/main
      --old-options="-c config_file=/etc/postgresql/{{ installed_postgresql_version }}/main/postgresql.conf"
      --new-options="-c config_file=/etc/postgresql/{{ postgresql_desired_version }}/main/postgresql.conf"
      --socketdir=/tmp
      --check
    chdir: /var/lib/postgresql
  register: pg_upgrade_check_retry
  changed_when: false
  ignore_errors: true

- name: Update pg_upgrade_check with retry result
  when: clone_failed
  ansible.builtin.set_fact:
    pg_upgrade_check: "{{ pg_upgrade_check_retry }}"

- name: Get pg_upgrade server log contents
  when: pg_upgrade_check.rc != 0
  become: true
  ansible.builtin.shell:
    cmd: find /var/lib/postgresql/{{ postgresql_desired_version }}/main/pg_upgrade_output.d -name "pg_upgrade_server.log" -exec tail -100 {} \; 2>/dev/null || echo "No log file found"
  register: pg_upgrade_log_content
  changed_when: false

- name: Show pg_upgrade log contents
  when: pg_upgrade_check.rc != 0
  ansible.builtin.debug:
    msg: "{{ pg_upgrade_log_content.stdout_lines }}"

- name: Fail if pg_upgrade check failed
  when: pg_upgrade_check.rc != 0
  ansible.builtin.fail:
    msg: "pg_upgrade --check failed. See log output above for details."

- name: Display upgrade check results
  ansible.builtin.debug:
    var: pg_upgrade_check.stdout_lines

- name: Perform PostgreSQL upgrade
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >
      /usr/lib/postgresql/{{ postgresql_desired_version }}/bin/pg_upgrade
      --old-bindir=/usr/lib/postgresql/{{ installed_postgresql_version }}/bin
      --new-bindir=/usr/lib/postgresql/{{ postgresql_desired_version }}/bin
      --old-datadir=/var/lib/postgresql/{{ installed_postgresql_version }}/main
      --new-datadir=/var/lib/postgresql/{{ postgresql_desired_version }}/main
      --old-options="-c config_file=/etc/postgresql/{{ installed_postgresql_version }}/main/postgresql.conf"
      --new-options="-c config_file=/etc/postgresql/{{ postgresql_desired_version }}/main/postgresql.conf"
      --socketdir=/tmp
      {{ pg_upgrade_method }}
    chdir: /var/lib/postgresql
  register: pg_upgrade_result

- name: Display upgrade results
  ansible.builtin.debug:
    var: pg_upgrade_result.stdout_lines

- name: Start new PostgreSQL service
  become: true
  ansible.builtin.systemd:
    name: "postgresql@{{ postgresql_desired_version }}-main"
    state: started
    enabled: true

- name: Update PostgreSQL configuration symlink
  become: true
  ansible.builtin.file:
    src: /etc/postgresql/{{ postgresql_desired_version }}
    dest: /etc/postgresql/current
    state: link
    force: true

- name: Update PostgreSQL data symlink
  become: true
  ansible.builtin.file:
    src: /var/lib/postgresql/{{ postgresql_desired_version }}/main
    dest: /var/lib/postgresql/current
    state: link
    force: true

- name: Run vacuumdb after upgrade
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: /usr/lib/postgresql/{{ postgresql_desired_version }}/bin/vacuumdb --all --analyze-in-stages
  async: 3600
  poll: 0
  register: vacuumdb_job

- name: Delete old PostgreSQL cluster
  when: postgresql_cleanup_old_cluster is defined and postgresql_cleanup_old_cluster
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: /var/lib/postgresql/delete_old_cluster.sh
    chdir: /var/lib/postgresql
  register: delete_old_cluster

- name: Delete upgrade scripts
  become: true
  ansible.builtin.file:
    path: "/var/lib/postgresql/{{ item }}"
    state: absent
  loop:
    - analyze_new_cluster.sh
    - delete_old_cluster.sh

- name: Remove old PostgreSQL package
  become: true
  ansible.builtin.apt:
    name: postgresql-{{ installed_postgresql_version }}
    state: absent
    autoremove: true

- name: Hold new postgresql packages after upgrade
  become: true
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - postgresql-{{ postgresql_desired_version }}
    - postgresql-client-{{ postgresql_desired_version }}

- name: Refresh version facts so later tasks and handlers use the new version
  ansible.builtin.set_fact:
    installed_postgresql_version: "{{ postgresql_desired_version }}"
    postgresql_installed_version: "{{ postgresql_desired_version }}"
    postgresql_version: "{{ postgresql_desired_version }}"
