---
- name: Check if tailscale is available (IPv4)
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ipv4
  changed_when: false
  failed_when: false

- name: Get tailscale IPv6 address
  ansible.builtin.command: tailscale ip -6
  register: tailscale_ipv6
  changed_when: false
  failed_when: false
  when: tailscale_ipv4.rc == 0

- name: Set postgres listen_addresses
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/current/main/postgresql.conf
    line: "listen_addresses = '{{ ('localhost,' ~ tailscale_ipv4.stdout | trim ~ ',' ~ tailscale_ipv6.stdout | trim) if tailscale_ipv4.rc == 0 else 'localhost' }}'"
    regexp: "^#?listen_addresses\\s*="
  register: listen_addresses_result

- name: Restart postgres for listen_addresses change
  ansible.builtin.debug:
    msg: "listen_addresses changed, restarting postgres"
  changed_when: true
  notify: Restart postgres
  when:
    - listen_addresses_result is changed
    - tailscale_name is defined
    - "'prod' not in tailscale_name"

- name: Warn about pending postgres restart on prod
  ansible.builtin.debug:
    msg: >-
      listen_addresses was changed but postgres was NOT restarted automatically
      because this is a prod server ({{ tailscale_name | default('unknown') }}).
      Schedule a manual restart of postgresql to apply the change.
  when:
    - listen_addresses_result is changed
    - tailscale_name is defined
    - "'prod' in tailscale_name"

