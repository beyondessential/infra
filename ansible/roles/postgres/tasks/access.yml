---
- name: Make postgres listen on all addresses
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/current/main/postgresql.conf
    line: "listen_addresses = '*'"
    regexp: "^#?listen_addresses\\s*="
  notify: Restart postgres

- name: Raise password hashing iterations
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/current/main/postgresql.conf
    line: "scram_iterations = 50000"
    regexp: "^#?scram_iterations\\s*="
  notify: Reload postgres

