# Default cipher suites still allow various old cipher suites; we can
# reasonably exclude everything before the TLS 1.2 era.
- name: Restrict cipher suites for postgres TLS connections
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/current/main/postgresql.conf
    line: "ssl_ciphers = 'HIGH:!SSLv3:!TLSv1'"
    regexp: "^#?ssl_ciphers\\s*="
  notify: Reload postgres

# lineinfile (postgresql.conf) settings are machine-local
# postgresql_alter_system settings are saved in backups

- name: Raise password hashing iterations
  become: true
  become_user: postgres
  community.postgresql.postgresql_alter_system:
    param: scram_iterations
    value: "50000"

# bestool/Canopy backs up postgres as the superuser over the local socket (peer
# auth, no password), issuing a CHECKPOINT for the snapshot path and falling
# back to pg_basebackup over the replication protocol when a volume snapshot
# isn't possible. The stock Debian pg_hba carries both lines; assert them so the
# backup (and its fallback) work even on a trimmed pg_hba.
- name: Ensure local peer auth for the postgres superuser
  become: true
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/current/main/pg_hba.conf
    contype: local
    databases: all
    users: postgres
    method: peer
  notify: Reload postgres

- name: Ensure local replication peer auth (pg_basebackup fallback)
  become: true
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/current/main/pg_hba.conf
    contype: local
    databases: replication
    users: all
    method: peer
  notify: Reload postgres
