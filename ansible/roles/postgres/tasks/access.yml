# Default cipher suites still allow various old cipher suites; we can
# reasonably exclude everything before the TLS 1.2 era.
- name: Restrict cipher suites for postgres TLS connections
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/current/main/postgresql.conf
    line: "ssl_ciphers = 'HIGH:!SSLv3:!TLSv1'"
    regexp: "^#?ssl_ciphers\\s*="
  notify: Reload postgres
