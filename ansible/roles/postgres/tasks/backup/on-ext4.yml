---
- name: Install tools needed for ext4 backup script
  become: true
  ansible.builtin.apt:
    name:
      - bindfs
      - inotify-tools
  notify:
    - Update package facts

- name: Set mergerfs_architecture
  ansible.builtin.set_fact:
    mergerfs_architecture: |-
      {{
        "amd64" if ansible_facts['architecture'] == "x86_64"
        else (
          "arm64" if ansible_facts['architecture'] == "aarch64"
          else ansible_facts['architecture']
        )
      }}

- name: Install mergerfs {{ mergerfs_version }}
  become: true
  ansible.builtin.apt:
    deb: https://github.com/trapexit/mergerfs/releases/download/{{ mergerfs_version }}/mergerfs_{{ mergerfs_version }}.{{ ansible_facts['distribution'] | lower
      }}-{{ ansible_facts['lsb']['codename'] }}_{{ mergerfs_architecture }}.deb

- name: Allow FUSE allow_other to be used by users
  become: true
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: "^user_allow_other"
    line: user_allow_other

- name: Create kopia pgdata mountpoint
  become: true
  ansible.builtin.file:
    path: /var/lib/kopia/pgdata
    state: directory
    owner: kopia
    group: kopia
    mode: "0755"

- name: Create postgres kopia user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: kopia
    role_attr_flags: SUPERUSER

- name: Allow kopia peer access to postgres
  become: true
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/current/main/pg_hba.conf
    contype: local
    users: kopia
    databases: postgres
    method: peer
    address: ""
  notify: Reload postgres

- name: Add kopia backup for postgres (ext4 script)
  become: true
  ansible.builtin.copy:
    src: kopia-backup-postgres-ext4.sh
    dest: /var/lib/kopia/backup-postgres.sh
    mode: "0755"
    owner: kopia
    group: kopia

- name: Add kopia backup for postgres (ext4 service)
  become: true
  ansible.builtin.copy:
    src: kopia-backup-postgres-ext4.service
    dest: /etc/systemd/system/kopia-backup-postgres.service
    mode: "0644"
  notify:
    - Reload systemd
