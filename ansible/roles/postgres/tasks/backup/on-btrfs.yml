---
- name: Stop and disable obsolete postgres snapshot timer
  become: true
  ansible.builtin.systemd:
    name: postgres-snapshot-btrfs.timer
    state: stopped
    enabled: false
  failed_when: false

- name: Remove obsolete postgres snapshot units and script
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/postgres-snapshot-btrfs.timer
    - /etc/systemd/system/postgres-snapshot-btrfs.service
    - /usr/local/bin/postgres-snapshot-btrfs.sh
  notify:
    - Reload systemd

- name: Add kopia backup for postgres (btrfs script)
  become: true
  ansible.builtin.copy:
    src: kopia-backup-postgres-btrfs.sh
    dest: /var/lib/kopia/backup-postgres.sh
    mode: "0755"
    owner: root
    group: root

- name: Add kopia backup for postgres (btrfs service)
  become: true
  ansible.builtin.copy:
    src: kopia-backup-postgres-btrfs.service
    dest: /etc/systemd/system/kopia-backup-postgres.service
    mode: "0644"
  notify:
    - Reload systemd
