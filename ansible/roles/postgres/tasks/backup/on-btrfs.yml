---
- name: Set archive command
  become: true
  become_user: postgres
  community.postgresql.postgresql_alter_system:
    name: archive_command
    value: "/bin/true"

- name: Add kopia backup for postgres (btrfs script)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-postgres-btrfs.sh') }}"
    dest: /var/lib/kopia/backup-postgres.sh
    mode: "0755"
    owner: root
    group: root

- name: Add kopia backup for postgres (btrfs service)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-postgres-btrfs.service') }}"
    dest: /etc/systemd/system/kopia-backup-postgres.service
  notify:
    - Reload systemd
