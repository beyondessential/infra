---
# Tuning for BTRFS with CoW enabled

# btrfs compression is filesystem-wide, so every btrfs line in fstab has to agree
- name: Set btrfs compression to zstd:1 in fstab
  become: true
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: 'compress=zstd:(?!1\b)\d+'
    replace: "compress=zstd:1"

- name: Read live mount options for /var/lib/postgresql
  ansible.builtin.command: findmnt -no OPTIONS -T /var/lib/postgresql
  register: pg_mount_options
  changed_when: false

- name: Apply btrfs compression level live
  become: true
  ansible.builtin.command: mount -o remount,compress=zstd:1 /var/lib/postgresql  # noqa: command-instead-of-module
  when: pg_mount_options.stdout is search('compress=zstd:(?!1\b)\d+')
  changed_when: true

- name: Set wal_init_zero to off
  become: true
  become_user: postgres
  notify:
    - Restart postgres
  community.postgresql.postgresql_alter_system:
    param: wal_init_zero
    value: "off"

- name: Set wal_recycle to off
  become: true
  become_user: postgres
  notify:
    - Restart postgres
  community.postgresql.postgresql_alter_system:
    param: wal_recycle
    value: "off"
