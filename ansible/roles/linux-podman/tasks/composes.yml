---
- name: Install podman-compose (legacy)
  become: true
  ansible.builtin.apt:
    package: podman-compose

- name: Download docker-compose (standalone)
  become: true
  ansible.builtin.get_url:
    url: https://github.com/docker/compose/releases/download/v{{ compose_version }}/docker-compose-linux-{{ ansible_architecture }}
    dest: /usr/bin/docker-compose
    mode: a=rx,u=rwx
