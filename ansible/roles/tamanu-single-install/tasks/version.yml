---
- name: Create versioned tamanu config directory
  become: true
  ansible.builtin.file:
    path: /etc/tamanu/{{ tamanu_version }}
    mode: "0770"
    owner: tamanu
    group: tamanu
    state: directory

- name: Copy current app config to new version
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: /etc/tamanu/current/production.json5
    dest: /etc/tamanu/{{ tamanu_version }}/production.json5
    mode: "0660"
    owner: tamanu
    group: tamanu
    force: false # preserve modifications
  ignore_errors: true
  register: copy_current

- name: Add new tamanu app config
  when: copy_current.failed
  become: true
  ansible.builtin.template:
    dest: /etc/tamanu/{{ tamanu_version }}/production.json5
    src: "{{ tamanu_server_type }}.json5.j2"
    mode: "0660"
    owner: tamanu
    group: tamanu
    force: false # preserve modifications

- name: Apply local tamanu config
  ansible.builtin.include_tasks: local-config.yml

- name: Set permissions of tamanu app config
  become: true
  ansible.builtin.file:
    path: /etc/tamanu/{{ tamanu_version }}/production.json5
    mode: "0660"
    owner: tamanu
    group: tamanu
    state: file

- name: Move current symlink
  become: true
  ansible.builtin.file:
    src: /etc/tamanu/{{ tamanu_version }}
    dest: /etc/tamanu/current
    owner: tamanu
    group: tamanu
    state: link
    force: true
  notify: Restart bestool-alertd

- name: Add version file
  become: true
  ansible.builtin.copy:
    dest: /etc/tamanu/env
    # 0640: carries the core DB password in DATABASE_URL, so not world-readable;
    # group read-only (not writable) since only Ansible writes this file.
    mode: "0640"
    owner: tamanu
    group: tamanu
    content: |
      # this is controlled by Ansible and will be overwritten if you make changes
      TZ={{ timezone }}
      TAMANU_VERSION={{ tamanu_version }}
      TAMANU_VERSION_DOMAIN={{ tamanu_version | replace('.', '-') }}
      TAMANU_FRONTEND_VERSION={{ tamanu_frontend_version }}
      TAMANU_FRONTEND_VERSION_DOMAIN={{ tamanu_frontend_version | replace('.', '-') }}
      DATABASE_URL=postgresql://{{ tamanu_db_user }}:{{ lookup('ansible.builtin.password', '/dev/null', seed = ansible_facts['machine_id'] + salt + 'postgres' + tamanu_db_user, chars=['ascii_letters', 'digits']) }}@/{{ tamanu_db_name }}?host=/var/run/postgresql

- name: Pull the Tamanu images
  become: true
  loop: "{{ [tamanu_image_server, tamanu_image_frontend] + ([tamanu_image_patient_portal] if patient_portal_enabled else []) }}"
  containers.podman.podman_image:
    name: "{{ item }}"

# The relative source path resolves against the image's working directory.
# default.json5 holds the app's built-in defaults that production.json5
# layers over; keep a read-only copy next to it for reference.
- name: Extract default app config from tamanu image
  become: true
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cid=$(podman create {{ tamanu_image_server }})
      trap 'podman rm "$cid" >/dev/null' EXIT
      podman cp "$cid:config/default.json5" /etc/tamanu/{{ tamanu_version }}/default.json5
      chown tamanu:tamanu /etc/tamanu/{{ tamanu_version }}/default.json5
      chmod 0440 /etc/tamanu/{{ tamanu_version }}/default.json5
    creates: /etc/tamanu/{{ tamanu_version }}/default.json5
    executable: /bin/bash
