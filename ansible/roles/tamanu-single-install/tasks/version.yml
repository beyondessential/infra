---
- name: Create versioned tamanu config directory
  become: true
  ansible.builtin.file:
    path: /etc/tamanu/{{ tamanu_version }}
    mode: '0770'
    owner: tamanu
    group: tamanu
    state: directory

- name: Copy current app config to new version
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: /etc/tamanu/current/production.json5
    dest: /etc/tamanu/{{ tamanu_version }}/production.json5
    mode: '0660'
    owner: tamanu
    group: tamanu
    force: false # preserve modifications
  ignore_errors: true
  register: copy_current

- name: Add new tamanu app config
  when: copy_current.failed
  become: true
  ansible.builtin.template:
    dest: /etc/tamanu/{{ tamanu_version }}/production.json5
    src: "{{ lookup('ansible.builtin.fileglob', tamanu_server_type + '.json5.j2') }}"
    mode: '0660'
    owner: tamanu
    group: tamanu
    force: false # preserve modifications

# local.json5 is generated entirely by ansible — tamanu and operators only
# read it, so lock down to read-only for the tamanu group. Root (running
# ansible) ignores mode bits when rewriting.
- name: Add tamanu local config
  become: true
  ansible.builtin.template:
    dest: /etc/tamanu/{{ tamanu_version }}/local.json5
    src: "{{ lookup('ansible.builtin.fileglob', 'local.json5.j2') }}"
    mode: '0440'
    owner: root
    group: tamanu
    force: true

- name: Set permissions of tamanu app config
  become: true
  ansible.builtin.file:
    path: /etc/tamanu/{{ tamanu_version }}/production.json5
    mode: '0660'
    owner: tamanu
    group: tamanu
    state: file

- name: Move current symlink
  become: true
  ansible.builtin.file:
    src: /etc/tamanu/{{ tamanu_version }}
    dest: /etc/tamanu/current
    owner: tamanu
    group: tamanu
    state: link
    force: true
  notify: Restart bestool-alertd

- name: Add version file
  become: true
  ansible.builtin.copy:
    dest: /etc/tamanu/env
    mode: '0664'
    owner: tamanu
    group: tamanu
    content: |
      # this is controlled by Ansible and will be overwritten if you make changes
      TZ={{ timezone }}
      TAMANU_VERSION={{ tamanu_version }}
      TAMANU_VERSION_DOMAIN={{ tamanu_version | replace('.', '-') }}
      TAMANU_FRONTEND_VERSION={{ tamanu_frontend_version }}
      TAMANU_FRONTEND_VERSION_DOMAIN={{ tamanu_frontend_version | replace('.', '-') }}

- name: Pull the Tamanu images
  become: true
  loop: "{{ [tamanu_image_server, tamanu_image_frontend] + ([tamanu_image_patient_portal] if patient_portal_enabled else []) }}"
  containers.podman.podman_image:
    name: "{{ item }}"

- name: Extract bundled alert definitions from tamanu image
  become: true
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      mkdir -p /etc/tamanu/{{ tamanu_version }}/alerts
      cid=$(podman create {{ tamanu_image_server }})
      trap 'podman rm "$cid" >/dev/null' EXIT
      podman cp "$cid:/app/alerts/." /etc/tamanu/{{ tamanu_version }}/alerts/
    creates: /etc/tamanu/{{ tamanu_version }}/alerts
    executable: /bin/bash
