- name: Remove DNS-cached tamanu central entries from /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ tamanu_central_hostname }}\s*$'
    state: absent

- name: Custom IP record for tamanu central in /etc/hosts
  become: true
  when: tamanu_central_ip is truthy
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ tamanu_central_ip }}  {{ tamanu_central_hostname }}"
    state: present
