---
- name: Add kopia user to tamanu group
  become: true
  ansible.builtin.user:
    name: kopia
    groups: tamanu
    append: true

- name: Add kopia backup for tamanu config (service)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-tamanu-config.service') }}"
    dest: /etc/systemd/system/kopia-backup-tamanu-config.service
    mode: "0644"
  notify:
    - Reload systemd

- name: Add kopia expiry tamanu config (timer)
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-backup-tamanu-config.timer') }}"
    dest: /etc/systemd/system/kopia-backup-tamanu-config.timer
    mode: "0644"
  notify:
    - Reload systemd

- name: Enable kopia backup for tamanu config
  become: true
  ansible.builtin.systemd:
    name: kopia-backup-tamanu-config.timer
    daemon_reload: true
    state: started
    enabled: true
