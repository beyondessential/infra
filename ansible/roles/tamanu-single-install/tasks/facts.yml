---
- name: Fetch PatientPortalFQDN EC2 tag
  when: tamanu_server_type == 'central'
  ansible.builtin.include_tasks: ../../../tasks/fetch-ec2-tag.yml
  vars:
    ec2_tag_name: PatientPortalFQDN

- name: Set patient portal enabled fact
  ansible.builtin.set_fact:
    patient_portal_enabled: "{{ tamanu_server_type == 'central' and ((ansible_facts['system_vendor'] == 'Amazon EC2' and ansible_ec2_tag_PatientPortalFQDN is defined) or (patient_portal_fqdn is defined)) }}"

- name: Set patient portal FQDN fact
  when: patient_portal_enabled
  ansible.builtin.set_fact:
    patient_portal_fqdn: "{{ ansible_ec2_tag_PatientPortalFQDN | default(patient_portal_fqdn) }}"

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Set bestool installed version fact
  when: "'bestool' in ansible_facts.packages"
  ansible.builtin.set_fact:
    # Strip any Debian-style revision/build suffix so `is version()` compares
    # against pure upstream semver.
    bestool_installed_version: "{{ ansible_facts.packages['bestool'][0].version | regex_replace('[-+~].*$', '') }}"

# Capture the versions currently in /etc/tamanu/env *before* version.yml
# overwrites the file. Consumed by the upgrade role to decide whether a
# frontend-only bump can skip API service churn and DB migration. Empty
# string when the env file is missing (fresh install) or the matching line
# is absent.
- name: Read previous tamanu version from env
  become: true
  ansible.builtin.shell: >-
    [ -f /etc/tamanu/env ] || exit 0;
    sed -n 's/^TAMANU_VERSION=//p' /etc/tamanu/env | head -n1
  args:
    executable: /bin/bash
  register: previous_tamanu_version_cmd
  changed_when: false
  check_mode: false

- name: Read previous tamanu frontend version from env
  become: true
  ansible.builtin.shell: >-
    [ -f /etc/tamanu/env ] || exit 0;
    sed -n 's/^TAMANU_FRONTEND_VERSION=//p' /etc/tamanu/env | head -n1
  args:
    executable: /bin/bash
  register: previous_tamanu_frontend_version_cmd
  changed_when: false
  check_mode: false

# If the env file has no TAMANU_FRONTEND_VERSION line — either a first run
# after this change rolls out, or any time it was hand-removed — assume the
# previous frontend version matched TAMANU_VERSION. Otherwise a same-version
# rerun would be misread as a frontend bump.
- name: Set previous-version and version-changed facts
  ansible.builtin.set_fact:
    previous_tamanu_version: "{{ previous_tamanu_version_cmd.stdout | trim }}"
    previous_tamanu_frontend_version: >-
      {{ previous_tamanu_frontend_version_cmd.stdout | trim
         or previous_tamanu_version_cmd.stdout | trim }}
    tamanu_version_changed: "{{ (previous_tamanu_version_cmd.stdout | trim) != tamanu_version }}"
    tamanu_frontend_version_changed: >-
      {{ (previous_tamanu_frontend_version_cmd.stdout | trim
          or previous_tamanu_version_cmd.stdout | trim)
         != tamanu_frontend_version }}
