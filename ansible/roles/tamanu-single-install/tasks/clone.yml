---
# The password is random and generated on the clone central, so it exists only on the
# clone hosts: never derived from inventory, never written on the control node.
# To rotate one, delete its password file on the central, re-run, then run clone-setup.sh.
- name: Set up clone sync account
  when: tamanu_server_type == 'facility'
  become: true
  block:
    - name: Make clone sync account store on central
      delegate_to: "{{ tamanu_clone_central }}"
      ansible.builtin.file:
        path: /etc/bestool/clone-sync
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Generate clone sync password on central
      delegate_to: "{{ tamanu_clone_central }}"
      ansible.builtin.shell:
        cmd: >-
          umask 077 &&
          openssl rand -hex 32 > {{ tamanu_clone_sync_file }}.password &&
          chown postgres:postgres {{ tamanu_clone_sync_file }}.password &&
          chmod 0400 {{ tamanu_clone_sync_file }}.password
        creates: "{{ tamanu_clone_sync_file }}.password"

    - name: Install clone sync account on central
      delegate_to: "{{ tamanu_clone_central }}"
      ansible.builtin.template:
        src: clone-sync-account.sql.j2
        dest: "{{ tamanu_clone_sync_file }}.sql"
        owner: postgres
        group: postgres
        mode: "0400"

    - name: Read clone sync password
      delegate_to: "{{ tamanu_clone_central }}"
      ansible.builtin.slurp:
        src: "{{ tamanu_clone_sync_file }}.password"
      register: tamanu_clone_sync_password
      no_log: true

    - name: Store clone sync password
      ansible.builtin.copy:
        content: "{{ tamanu_clone_sync_password.content | b64decode }}"
        dest: /etc/tamanu/clone-sync-password
        owner: root
        group: root
        mode: "0400"
      no_log: true

- name: Install clone setup script
  become: true
  ansible.builtin.template:
    src: clone-setup-{{ tamanu_server_type }}.sh.j2
    dest: /etc/bestool/clone-setup.sh
    owner: root
    group: root
    mode: "0700"
