---
- name: Get IMDSv2 token
  when: ansible_system_vendor == 'Amazon EC2' and tamanu_server_type == 'central'
  ansible.builtin.uri:
    url: http://169.254.169.254/latest/api/token
    method: PUT
    headers:
      X-aws-ec2-metadata-token-ttl-seconds: "60"
    return_content: true
  register: imds_token

- name: Fetch PatientPortalFQDN tag from EC2 metadata service
  when: ansible_system_vendor == 'Amazon EC2' and tamanu_server_type == 'central'
  ansible.builtin.uri:
    url: http://169.254.169.254/latest/meta-data/tags/instance/PatientPortalFQDN
    headers:
      X-aws-ec2-metadata-token: "{{ imds_token.content }}"
    return_content: true
    status_code: [200, 404]
  register: ec2_patient_portal_fqdn_tag
  failed_when: false

- name: Set PatientPortalFQDN fact from EC2 tag
  when: ansible_system_vendor == 'Amazon EC2' and tamanu_server_type == 'central' and ec2_patient_portal_fqdn_tag.status == 200
  ansible.builtin.set_fact:
    ansible_ec2_tag_PatientPortalFQDN: "{{ ec2_patient_portal_fqdn_tag.content }}"

- name: Set patient portal enabled fact
  ansible.builtin.set_fact:
    patient_portal_enabled: "{{ tamanu_server_type == 'central' and ((ansible_system_vendor == 'Amazon EC2' and ansible_ec2_tag_PatientPortalFQDN is defined) or (patient_portal_fqdn is defined)) }}"

- name: Set patient portal FQDN fact
  when: patient_portal_enabled
  ansible.builtin.set_fact:
    patient_portal_fqdn: "{{ ansible_ec2_tag_PatientPortalFQDN | default(patient_portal_fqdn) }}"

- name: Add tamanu group
  become: true
  ansible.builtin.group:
    name: tamanu
    system: true

- name: Add tamanu user
  become: true
  ansible.builtin.user:
    group: tamanu
    name: tamanu
    shell: /usr/bin/false

- name: Add login user to tamanu group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: tamanu
    append: true

- name: Add tamanu caddy config
  become: true
  ansible.builtin.template:
    dest: /etc/caddy/servers/tamanu
    src: "{{ lookup('ansible.builtin.fileglob', 'Caddyfile.j2') }}"
    owner: tamanu
    group: tamanu
  notify: Reload caddy

- name: Add tamanu patient portal caddy config
  when: patient_portal_enabled
  become: true
  ansible.builtin.template:
    dest: /etc/caddy/servers/tamanu-patientportal
    src: "{{ lookup('ansible.builtin.fileglob', 'Caddyfile-patientportal.j2') }}"
    owner: tamanu
    group: tamanu
  notify: Reload caddy

- name: Create tamanu config directory
  become: true
  ansible.builtin.file:
    path: /etc/tamanu
    mode: "0775"
    owner: tamanu
    group: tamanu
    state: directory

- name: Add tamanu-run script
  become: true
  ansible.builtin.template:
    dest: /usr/local/bin/tamanu-run
    src: "{{ lookup('ansible.builtin.fileglob', 'tamanu-run.j2') }}"
    mode: "0755"

- name: Install common container quadlets
  become: true
  with_fileglob: tamanu-frontend@.container
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/containers/systemd/{{ item | basename }}
  notify: Reload systemd

- name: Install patient portal container quadlet
  when: patient_portal_enabled
  become: true
  with_fileglob: tamanu-patientportal.container
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/containers/systemd/{{ item | basename }}
  notify: Reload systemd

- name: Install specific container quadlets
  become: true
  with_fileglob: tamanu-{{ tamanu_server_type }}*.container
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/containers/systemd/{{ item | basename }}
  notify: Reload systemd

- name: Create drop-in directory for quadlets
  become: true
  ansible.builtin.file:
    path: /etc/containers/systemd/tamanu-.container.d
    state: directory

- name: Enable IPv6 for quadlets
  when: tamanu_ipv6
  become: true
  ansible.builtin.file:
    path: /etc/containers/systemd/tamanu-.container.d/noipv6.conf
    state: absent
  notify: Reload systemd

- name: Disable IPv6 for quadlets
  when: not tamanu_ipv6
  become: true
  ansible.builtin.copy:
    dest: /etc/containers/systemd/tamanu-.container.d/noipv6.conf
    content: |
      [Container]
      Sysctl=net.ipv6.conf.all.disable_ipv6=1
  notify: Reload systemd

- name: Remove old container-specific noipv6.conf files
  become: true
  with_fileglob: tamanu-{{ tamanu_server_type }}*.container
  ansible.builtin.file:
    path: /etc/containers/systemd/{{ item | basename }}.d/noipv6.conf
    state: absent
  notify: Reload systemd

- name: Install quadlet override for extra_certs
  when: tamanu_extra_certs
  become: true
  ansible.builtin.copy:
    dest: /etc/containers/systemd/tamanu-.container.d/host-ca-certs.conf
    content: |
      [Container]
      Volume=/etc/ssl/certs:/host/etc/ssl/certs:ro
      Environment=NODE_EXTRA_CA_CERTS=/host/etc/ssl/certs/ca-certificates.crt
  notify: Reload systemd

- name: Uninstall quadlet override for extra_certs
  when: not tamanu_extra_certs
  become: true
  ansible.builtin.file:
    path: /etc/containers/systemd/tamanu-.container.d/host-ca-certs.conf
    state: absent
  notify: Reload systemd

- name: Remove old container-specific host-ca-certs.conf files
  become: true
  with_fileglob: tamanu-{{ tamanu_server_type }}*.container
  ansible.builtin.file:
    path: /etc/containers/systemd/{{ item | basename }}.d/host-ca-certs.conf
    state: absent
  notify: Reload systemd

- name: Remove old container-specific override directory
  become: true
  with_fileglob: tamanu-{{ tamanu_server_type }}*.container
  ansible.builtin.file:
    path: /etc/containers/systemd/{{ item | basename }}.d
    state: absent
