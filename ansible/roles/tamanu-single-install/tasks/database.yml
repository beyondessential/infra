---
- name: Add reporting database users
  loop:
    - reporting
    - raw
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ item }}"
    password: "{{ lookup('ansible.builtin.password', '/dev/null', seed = ansible_facts['machine_id'] + salt + 'postgres' + item) }}"

- name: Allow reporting users access to postgres
  loop:
    - reporting
    - raw
  become: true
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/current/main/pg_hba.conf
    contype: local
    users: "{{ item }}"
    databases: tamanu
    method: scram-sha-256
    address: "" # workaround for https://github.com/ansible-collections/community.postgresql/issues/777 (fixed in 3.9.1)
  notify: Reload postgres

- name: Create backup folders
  become: true
  loop:
    - /opt/tamanu-backup
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0770"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory

- name: Install logical backup timer but not enabled
  become: true
  loop:
    - tamanu-backup.timer
    - tamanu-backup.service
  ansible.builtin.template:
    dest: /etc/systemd/system/{{ item }}
    src: "{{ lookup('ansible.builtin.fileglob', item ~ '.j2') }}"
    mode: "0660"
    force: true
  notify: Reload systemd
