---
- ansible.builtin.include_tasks: reporting-users.yml

- name: Create backup folders
  become: true
  loop:
    - /opt/tamanu-backup
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0770"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory

- name: Install logical backup timer but not enabled
  become: true
  loop:
    - tamanu-backup.timer
    - tamanu-backup.service
  ansible.builtin.template:
    dest: /etc/systemd/system/{{ item }}
    src: "{{ lookup('ansible.builtin.fileglob', item ~ '.j2') }}"
    mode: "0660"
    force: true
  notify: Reload systemd
