---
- name: Add tamanu group
  become: true
  ansible.builtin.group:
    name: tamanu
    system: true

- name: Add tamanu user
  become: true
  ansible.builtin.user:
    group: tamanu
    name: tamanu
    shell: /usr/bin/false

- name: Add login user to tamanu group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: tamanu
    append: true
