---
- ansible.builtin.include_tasks: facts.yml
- ansible.builtin.include_tasks: user.yml
- ansible.builtin.include_tasks: config.yml
- ansible.builtin.include_tasks: quadlets.yml
- ansible.builtin.include_tasks: database.yml
- ansible.builtin.include_tasks: version.yml
- ansible.builtin.include_tasks: dns.yml
  when: tamanu_server_type != 'central'
- ansible.builtin.include_tasks: backup.yml
- ansible.builtin.include_tasks: alertd.yml
- ansible.builtin.include_tasks: doctor.yml
  when: bestool_installed_version is defined and bestool_installed_version is version('1.8.0', '>=')
