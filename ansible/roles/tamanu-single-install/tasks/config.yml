---
- name: Create tamanu config directory
  become: true
  ansible.builtin.file:
    path: /etc/tamanu
    mode: "0775"
    owner: tamanu
    group: tamanu
    state: directory

- name: Add tamanu-run script
  become: true
  ansible.builtin.template:
    dest: /usr/local/bin/tamanu-run
    src: tamanu-run.j2
    mode: "0755"

- name: Permit Caddy to fetch certificates from alertd
  ansible.builtin.include_role:
    name: bestool
    tasks_from: caddy-certificates

- name: Add upstream snippet
  become: true
  ansible.builtin.template:
    dest: /etc/caddy/snippets/tamanu-upstreams
    src: caddy/upstreams.j2
    mode: "0644"
  notify: Reload caddy

- name: Add common server snippet
  become: true
  ansible.builtin.template:
    dest: /etc/caddy/snippets/tamanu-common
    src: caddy/common.j2
    mode: "0644"
  notify: Reload caddy

- name: Add tamanu server
  become: true
  ansible.builtin.template:
    dest: /etc/caddy/servers/tamanu
    src: caddy/tamanu.j2
    mode: "0644"
  notify: Reload caddy

- name: Add patientportal server
  when: patient_portal_enabled
  become: true
  ansible.builtin.template:
    dest: /etc/caddy/servers/tamanu-patientportal
    src: caddy/patientportal.j2
    mode: "0644"
  notify: Reload caddy
