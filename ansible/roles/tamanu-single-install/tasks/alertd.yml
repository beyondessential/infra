---
# Lets bestool-alertd (and the older bestool-doctor) run the kopia_backup
# check, which invokes `sudo -u kopia -- /usr/bin/kopia snapshot list`.
- name: Allow tamanu user to run kopia as the kopia user
  become: true
  community.general.sudoers:
    name: tamanu-kopia
    state: present
    user: tamanu
    runas: kopia
    commands: /usr/bin/kopia
    nopassword: true

- name: Install bestool-alertd systemd unit
  become: true
  ansible.builtin.template:
    src: "{{ lookup('ansible.builtin.fileglob', 'bestool-alertd.service.j2') }}"
    dest: /etc/systemd/system/bestool-alertd.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart bestool-alertd

- name: Enable and start bestool-alertd
  become: true
  ansible.builtin.systemd:
    name: bestool-alertd.service
    state: started
    enabled: true
    daemon_reload: true
