---
# bestool-alertd's doctor runs read-only DB checks. Give it a dedicated Postgres
# role it reaches over the socket via peer auth (pg_ident maps the root OS user
# the daemon runs as to this role), so there's no password to keep in sync with
# the app's db user. The role is read-only: pg_read_all_data covers SELECT on
# every table the checks read, pg_monitor covers the stat views; nothing more.
- name: Create read-only monitoring role for bestool-alertd
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ tamanu_monitoring_db_user }}"
    role_attr_flags: "LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,INHERIT"
    # No password: authentication is peer-only (see pg_hba + pg_ident below).

- name: Grant read-only monitoring roles to the alertd user
  become: true
  become_user: postgres
  community.postgresql.postgresql_membership:
    target_roles: "{{ tamanu_monitoring_db_user }}"
    groups:
      - pg_read_all_data
      - pg_monitor
    state: present

- name: Grant the alertd user CONNECT on the tamanu database
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: "{{ tamanu_db_name }}"
    type: database
    objs: "{{ tamanu_db_name }}"
    privs: CONNECT
    roles: "{{ tamanu_monitoring_db_user }}"
    state: present

- name: Allow the alertd monitoring user peer access to postgres
  become: true
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/current/main/pg_hba.conf
    contype: local
    users: "{{ tamanu_monitoring_db_user }}"
    databases: "{{ tamanu_db_name }}"
    method: peer
    options: "map=alertd"
    address: "" # workaround for https://github.com/ansible-collections/community.postgresql/issues/777 (fixed in 3.9.1)
  notify: Reload postgres

# pg_ident maps the root OS user (the rootful bestool-alertd daemon) to the
# monitoring role for the `map=alertd` peer rule above. No module manages
# pg_ident, so edit the file directly.
- name: Map root to the alertd monitoring role (pg_ident)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/postgresql/current/main/pg_ident.conf
    regexp: '^\s*alertd\s+root\s+'
    line: "alertd  root  {{ tamanu_monitoring_db_user }}"
    state: present
  notify: Reload postgres
