type = "tamanu-secrets"
# The store is only meaningful alongside the database it decrypts, so it rides
# each database backup rather than keeping its own schedule.
after = "tamanu-postgres"

[simple]
# podman's secret store, holding tamanu-config-key: the AES key every
# local_system_secrets value is encrypted with. A database restored onto a host
# without it reads none of them.
path = "/var/lib/containers/storage/secrets"

# A secret is materialised into a container when the container starts, so a
# restored store is inert until the units restart. The glob reaches systemctl
# itself (hooks are argv, no shell), and matches whichever units this server
# type runs.
[[post_restore]]
command = ["/usr/bin/systemctl", "restart", "tamanu-*.service"]
