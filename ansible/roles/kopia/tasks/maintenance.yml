---
- name: Add kopia maintenance service
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-maintenance.service') }}"
    dest: /etc/systemd/system/kopia-maintenance.service
    mode: "0644"
  notify:
    - Reload systemd

- name: Add kopia maintenance timer
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-maintenance.timer') }}"
    dest: /etc/systemd/system/kopia-maintenance.timer
    mode: "0644"
  notify:
    - Reload systemd

- name: Enable kopia maintenance timer
  become: true
  ansible.builtin.systemd:
    name: kopia-maintenance.timer
    daemon_reload: true
    state: started
    enabled: true

# Claim maintenance ownership for this central host. Full maintenance only runs
# for the repo's recorded owner; migrating central servers leaves ownership
# stranded on the old host, so the timer's `kopia maintenance run --full`
# silently no-ops until we take it over here. Also disable kopia's built-in
# automatic maintenance so it only runs via the timer above, not
# opportunistically during other operations.
- name: Claim maintenance ownership and disable automatic kopia maintenance
  become: true
  become_user: kopia
  ansible.builtin.command:
    cmd: kopia maintenance set --owner=me --enable-full=false --enable-quick=false
  environment:
    KOPIA_CHECK_FOR_UPDATES: "false"
  when: kopia_config.stat.exists
  changed_when: true
  failed_when: false
