---
- name: Add kopia expiry service
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-expiry.service') }}"
    dest: /etc/systemd/system/kopia-expiry.service
    mode: "0644"
  notify:
    - Reload systemd

- name: Add kopia expiry timer
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'kopia-expiry.timer') }}"
    dest: /etc/systemd/system/kopia-expiry.timer
    mode: "0644"
  notify:
    - Reload systemd

- name: Enable kopia expiry timer
  become: true
  ansible.builtin.systemd:
    name: kopia-expiry.timer
    daemon_reload: true
    state: started
    enabled: true
