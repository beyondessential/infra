---
- name: Create kopia group
  become: true
  ansible.builtin.group:
    name: kopia
    system: true
    state: present

- name: Create kopia user
  become: true
  ansible.builtin.user:
    name: kopia
    groups: kopia
    system: true
    append: true
    create_home: true
    home: /var/lib/kopia
