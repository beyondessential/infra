---
# Apply kopia policies if repository is configured
# NOTE: These policies must be kept in sync with bes-setup-kopia
# See: ops/ansible/roles/kopia/files/bes-setup-kopia

- name: Check if kopia repository is configured
  become: true
  ansible.builtin.stat:
    path: /var/lib/kopia/.config/kopia/repository.config
  register: kopia_config

- name: Apply kopia compression policy
  become: true
  become_user: kopia
  ansible.builtin.command:
    cmd: kopia policy set --compression=zstd-fastest --add-ignore 'lost+found' --global
  environment:
    KOPIA_CHECK_FOR_UPDATES: "false"
  when: kopia_config.stat.exists
  changed_when: true
