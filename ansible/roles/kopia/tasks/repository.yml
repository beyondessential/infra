---
- name: Install bes-setup-kopia script
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'bes-setup-kopia') }}"
    dest: /usr/local/bin/bes-setup-kopia
    mode: "0755"
    owner: root
    group: root

- name: Check if kopia is configured
  ansible.builtin.stat:
    path: /var/lib/kopia/.config/kopia/repository.config
  register: kopia_ready

- name: Display kopia configuration status
  when: not kopia_ready.stat.exists
  ansible.builtin.debug:
    msg: |
      Kopia is not yet configured on this host.
      After Ansible completes, run: sudo bes-setup-kopia
      This will prompt for S3 credentials and repository password.
