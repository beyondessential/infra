---
- name: Create kopia repository
  when: "'central' in group_names"
  become: true
  become_user: kopia
  environment:
    KOPIA_PASSWORD: "{{ kopia_password }}"
  ansible.builtin.command:
    creates: /var/lib/kopia/.config/kopia/repository.config
    cmd: |
      kopia repository create s3
        --bucket={{ kopia_s3_bucket }}
        --access-key={{ kopia_s3_key }}
        --secret-access-key={{ kopia_s3_secret }}
        --ecc-overhead-percent=1
        --region={{ kopia_s3_region | default(ansible_facts['ec2_placement_region']) | default('ap-southeast-2') }}
        --retention-mode=GOVERNANCE
        --retention-period=30d

- name: Connect to kopia repository
  when: "'central' not in group_names"
  become: true
  become_user: kopia
  environment:
    KOPIA_PASSWORD: "{{ kopia_password }}"
  ansible.builtin.command:
    creates: /var/lib/kopia/.config/kopia/repository.config
    cmd: >
      kopia repository connect s3
        --bucket={{ kopia_s3_bucket }}
        --access-key={{ kopia_s3_key }}
        --secret-access-key={{ kopia_s3_secret }}
        --region={{ kopia_s3_region | default(ansible_facts['ec2_placement_region']) | default('ap-southeast-2') }}

- name: Set compression global policy
  become: true
  become_user: kopia
  ansible.builtin.command:
    cmd: kopia policy set --compression=zstd-fastest --global
