---
# bestool drives the kopia binary, so kopia is still installed. Scheduling,
# retention, maintenance and cache management are now owned by Canopy, so the
# central-host timers and policy this role used to manage are torn down.
- name: Install kopia
  ansible.builtin.include_tasks: install.yml
- name: Tear down self-managed kopia scheduling
  ansible.builtin.include_tasks: teardown.yml
