---
- name: Add kopia apt key
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'apt.gpg') }}"
    dest: /etc/apt/keyrings/kopia-keyring.gpg
    mode: "0644"

- name: Add kopia apt repo
  become: true
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/kopia-keyring.gpg] http://packages.kopia.io/apt/ stable main
    state: present
    filename: kopia

- name: Remove duplicate kopia apt source
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/packages_kopia_io_apt.list
    state: absent

- name: Prioritise kopia repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-kopia
    mode: "0644"
    content: |
      Package: *
      Pin: release o=packages.kopia.io
      Pin-Priority: 900

- name: Install kopia
  become: true
  ansible.builtin.apt:
    name: kopia
  notify:
    - Update package facts

# Kopia user/home is created in baseline

- name: Install bes-setup-kopia script
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'bes-setup-kopia') }}"
    dest: /usr/local/bin/bes-setup-kopia
    mode: "0755"
    owner: root
    group: root

- name: Check if kopia is configured
  become: true
  ansible.builtin.stat:
    path: /var/lib/kopia/.config/kopia/repository.config
  register: kopia_ready

- name: Display kopia configuration status
  when: not kopia_ready.stat.exists
  ansible.builtin.debug:
    msg:
      - "Kopia is not yet configured on this host."
      - "After Ansible completes, run: sudo bes-setup-kopia"
      - "This will prompt for S3 credentials and repository password."
