---
- name: Add kopia apt key
  become: true
  ansible.builtin.copy:
    src: apt.gpg
    dest: /etc/apt/keyrings/kopia-keyring.gpg
    mode: "0644"

- name: Add kopia apt repo
  become: true
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/kopia-keyring.gpg] http://packages.kopia.io/apt/ stable main
    state: present
    filename: kopia

- name: Remove duplicate kopia apt source
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/packages_kopia_io_apt.list
    state: absent

- name: Prioritise kopia repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-kopia
    mode: "0644"
    content: |
      Package: *
      Pin: release o=packages.kopia.io
      Pin-Priority: 900

- name: Install kopia
  become: true
  ansible.builtin.apt:
    name: kopia
  notify:
    - Update package facts

# Kopia user/home is created in baseline. The binary is all we install: bestool
# drives kopia against a Canopy-provided repository, so there is no local
# repository to set up.
