---
- name: Stop and disable otelcol service
  become: true
  ansible.builtin.systemd:
    name: otelcol
    state: stopped
    enabled: false
  ignore_errors: true

- name: Remove otelcol service file
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/otelcol.service
    state: absent
  notify:
    - Reload systemd

- name: Remove otelcol binary
  become: true
  ansible.builtin.file:
    path: /usr/bin/otelcol
    state: absent

- name: Remove otelcol config folder
  become: true
  ansible.builtin.file:
    path: /etc/otelcol
    state: absent

- name: Remove otelcol storage folder
  become: true
  ansible.builtin.file:
    path: /var/log/otel
    state: absent

- name: Remove otelcol home directory
  become: true
  ansible.builtin.file:
    path: /var/lib/otelcol
    state: absent

- name: Remove otelcol user
  become: true
  ansible.builtin.user:
    name: otelcol
    state: absent
    remove: true

- name: Remove otelcol group
  become: true
  ansible.builtin.group:
    name: otelcol
    state: absent
