---
- name: Set osquery_architecture
  set_fact:
    osquery_architecture: |-
      {{
        "amd64" if ansible_architecture == "x86_64"
        else (
          "arm64" if ansible_architecture == "aarch64"
          else ansible_architecture
        )
      }}

- name: Add osquery apt key
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings/osquery.asc
    content: "{{ lookup('ansible.builtin.file', 'osquery.asc') }}"

- name: Add osquery repo
  become: true
  ansible.builtin.apt_repository:
    repo: deb [arch={{ osquery_architecture }} signed-by=/etc/apt/keyrings/osquery.asc] https://pkg.osquery.io/deb deb main
    state: present

- name: Prioritise osquery repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-osquery
    content: |
      Package: *
      Pin: release o=pkg.osquery.io
      Pin-Priority: 900

- name: Install osquery
  become: true
  ansible.builtin.apt:
    name: osquery
    state: present
  notify:
    - Update package facts

- name: Enable osquery
  become: true
  ansible.builtin.systemd:
    name: osqueryd
    state: started
    enabled: true
