---
- name: Download otelcol {{ otel_collector_version }}
  become: true
  ansible.builtin.get_url:
    url: https://tools.ops.tamanu.io/otelcol/{{ otel_collector_version }}/otelcol-{{ ansible_architecture }}-unknown-linux-gnu-{{ otel_collector_version }}
    dest: /usr/bin/otelcol
    mode: a=rx,u=rwx
  notify:
    - Restart otelcol
    - Regenerate otelcol completions

- name: Add otelcol group
  become: true
  ansible.builtin.group:
    name: otelcol
    system: true

- name: Add otelcol user
  become: true
  ansible.builtin.user:
    group: otelcol
    name: otelcol
    shell: /usr/bin/false
    home: /var/lib/otelcol
    create_home: true

- name: Add otelcol service file
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/otelcol.service
    src: "{{ lookup('ansible.builtin.fileglob', 'otelcol.service') }}"
  notify:
    - Reload systemd

- name: Make otelcol config folder
  become: true
  ansible.builtin.file:
    path: /etc/otelcol
    state: directory

- name: Make otelcol storage folder
  become: true
  ansible.builtin.file:
    path: /var/log/otel
    state: directory
    owner: otelcol
    group: otelcol

- name: Configure otel collector
  become: true
  ansible.builtin.template:
    src: "{{ lookup('ansible.builtin.fileglob', 'config.yml.j2') }}"
    dest: /etc/otelcol/config.yml
    owner: root
    group: root
    mode: 0644
  notify:
    - Update package facts
    - Restart otelcol

- name: Enable otel collector
  become: true
  ansible.builtin.systemd:
    name: otelcol
    state: started
    enabled: true
