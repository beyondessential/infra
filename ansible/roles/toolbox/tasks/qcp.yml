---
- name: Set qcp_arch
  set_fact:
    qcp_target: "{{ ansible_architecture }}"

- name: Set qcp_arch
  when: ansible_architecture == "aarch64"
  set_fact:
    qcp_arch: arm64

- name: Install qcp {{ qcp_version }}
  become: true
  ansible.builtin.apt:
    deb: https://github.com/crazyscot/qcp/releases/download/v{{ qcp_version }}/qcp_{{ qcp_version }}_{{ qcp_arch }}.deb
