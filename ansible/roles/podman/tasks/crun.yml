---
- name: Set default crun_target
  set_fact:
    crun_target: "{{ ansible_architecture }}-unknown-linux-gnu"

- name: Set crun_target for 22.04 or bookworm
  set_fact:
    crun_target: "{{ ansible_architecture }}-unknown-linux-gnu35"
  when:
    - (ansible_lsb.codename == 'jammy') or (ansible_lsb.codename == 'bookworm')

- name: Install crun {{ crun_version }}
  become: true
  ansible.builtin.apt:
    deb: https://tools.ops.tamanu.io/crun/{{ crun_version }}/crun-{{ crun_target }}-{{ crun_version }}.deb

    #- name: Make sure crun runs
    #ansible.builtin.shell: crun --version
