---
- name: Make container network directory
  become: true
  ansible.builtin.file:
    path: /etc/containers/networks
    state: directory
    mode: "0755"

# spec: LNXRUN#container-runtime
- name: Configure default podman network
  become: true
  ansible.builtin.template:
    src: networks-podman.json.j2
    dest: /etc/containers/networks/podman.json
    mode: "0644"

- name: Configure resolved to look into the podman network
  become: true
  ansible.builtin.template:
    src: podman.network.j2
    dest: /etc/systemd/network/podman.network
    mode: "0644"
  notify:
    - Reload systemd-networkd
    - Restart systemd-resolved
