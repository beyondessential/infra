---
- name: Install netavark
  become: true
  ansible.builtin.apt:
    package: netavark

- name: Install podman {{ podman_version }}
  become: true
  ansible.builtin.apt:
    deb: https://tools.ops.tamanu.io/podman/{{ podman_version }}/podman-{{ ansible_architecture }}-unknown-linux-gnu35-{{ podman_version }}.deb

- name: Make sure podman runs
  ansible.builtin.shell: podman --version

- name: Install containers.conf
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: /usr/share/containers/containers.conf
    dest: /etc/containers/containers.conf
    force: false

- name: Use netavark for container networking
  become: true
  ansible.builtin.lineinfile:
    path: /etc/containers/containers.conf
    line: network_backend = "netavark"
    regexp: '^#?network_backend\\s*='

- name: Set podman image auto-cleanup
  become: true
  ansible.builtin.copy:
    dest: /etc/cron.daily/podman-image-cleanup
    mode: '0755'
    content: |
      #!/bin/sh
      podman image prune --all --filter until=24h --force

- name: Make quadlet directory
  become: true
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory

# For quadlet compatibility
- name: Symlink podman binaries into /usr/bin
  loop:
    - podman
    - podman-remote
    - podmansh
  become: true
  ansible.builtin.file:
    src: /usr/local/bin/{{ item }}
    dest: /usr/bin/{{ item }}
    state: link
