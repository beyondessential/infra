---
tamanu_version: "{{ version | default('v2.10.0') }}"
tamanu_frontend_version: "{{ frontend_version | default(tamanu_version) }}"
tamanu_db_name: "{{ db_name }}"
tamanu_db_user: "{{ db_user | default(db_name) }}"
tamanu_server_type: "{{ type }}"
tamanu_image_server: "ghcr.io/beyondessential/tamanu-{{ tamanu_server_type }}:{{ tamanu_version }}"
tamanu_image_frontend: "ghcr.io/beyondessential/tamanu-frontend:{{ tamanu_frontend_version }}"
tamanu_image_patient_portal: "ghcr.io/beyondessential/tamanu-patient-portal:{{ tamanu_version }}"
tamanu_sync_email: admin@tamanu.io
tamanu_sync_password: admin
tamanu_default_department: GenericClinic
tamanu_default_location: GenericClinic
tamanu_letterhead_title: Tamanu Health
tamanu_letterhead_subtitle: BES International
tamanu_country_name: Utopia
tamanu_country_alpha2: UT
tamanu_country_alpha3: UTO
tamanu_ipv6: true
tamanu_central_hostname: "{{ tamanu_central_canonical_url | urlsplit('hostname') }}"
tamanu_central_ip: false
tamanu_caddy_tls: true
tamanu_caddy_extra_hostnames: []
tamanu_caddy_extra_hostnames_redirect: true
tamanu_extra_certs: false # if true, the host's /etc/ssl/certs/ca-certificates.crt will be added to node inside the container
tailnet: tail53aef
tamanu_tailscale_tls: true
