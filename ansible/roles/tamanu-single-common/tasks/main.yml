---
# Shared tamanu-host setup, run as a dependency of every tamanu-single-* role
# so it's present regardless of which phase (install/upgrade/frontend) runs.

# Resolve the alertd monitoring connection string here, where db_name is in
# scope, into a host fact the (later, separate) bestool role can read to set
# TAMANU_DATABASE_URL on the alertd unit. db_name is a role-scoped param of the
# tamanu-single-* roles, so the bestool role can't reach tamanu_db_name itself;
# a fact bridges it. Peer auth (see tamanu-single-install/monitoring-user.yml)
# means no password in the URL. Hosts without a tamanu install never set this,
# so the unit there simply omits the override.
- name: Expose the alertd monitoring database URL to the bestool role
  ansible.builtin.set_fact:
    tamanu_alertd_database_url: "postgresql://{{ tamanu_monitoring_db_user }}@/{{ tamanu_db_name }}?host=/var/run/postgresql"

- name: Add tamanu group
  become: true
  ansible.builtin.group:
    name: tamanu
    system: true

- name: Add tamanu user
  become: true
  ansible.builtin.user:
    group: tamanu
    name: tamanu
    shell: /usr/bin/false

- name: Add login user to tamanu group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: tamanu
    append: true

# Lets a bestool run as the tamanu user (the legacy bestool-doctor) execute the
# kopia_backup check via `sudo -u kopia -- /usr/bin/kopia ...`. The rootful
# bestool-alertd reads the kopia repo directly and doesn't need this.
- name: Allow tamanu user to run kopia as the kopia user
  become: true
  community.general.sudoers:
    name: tamanu-kopia
    state: present
    user: tamanu
    runas: kopia
    commands: /usr/bin/kopia
    nopassword: true

# bestool-alertd runs as root with CAP_DAC_OVERRIDE dropped, so it can only
# write here as the directory owner. setgid + group tamanu so files written by
# the root service stay accessible to the tamanu group, which the login user
# belongs to — bestool gets run interactively as that user, and as kopia/tamanu,
# against the same config. (The service's UMask is relaxed to 0007 to keep those
# group bits.)
- name: Create bestool config directory
  become: true
  ansible.builtin.file:
    path: /etc/bestool
    mode: "2775"
    owner: root
    group: tamanu
    state: directory

# Pre-existing contents may have been left by the old alertd that ran as tamanu
# (so tamanu:tamanu), which the now-rootful service can't rewrite without owning
# them. Re-home everything to root:tamanu with the same group-shared perms — dirs
# get setgid 2775, files 0660 (find is needed because those modes differ).
- name: Find existing bestool config subdirectories
  become: true
  ansible.builtin.find:
    paths: /etc/bestool
    recurse: true
    file_type: directory
  register: bestool_existing_dirs

- name: Normalise existing bestool config subdirectories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "2775"
    owner: root
    group: tamanu
  loop: "{{ bestool_existing_dirs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find existing bestool config files
  become: true
  ansible.builtin.find:
    paths: /etc/bestool
    recurse: true
    file_type: file
  register: bestool_existing_files

- name: Normalise existing bestool config files
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0660"
    owner: root
    group: tamanu
  loop: "{{ bestool_existing_files.files }}"
  loop_control:
    label: "{{ item.path }}"
