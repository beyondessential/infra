---
- name: Regenerate locales
  become: true
  ansible.builtin.command:
    cmd: locale-gen

- name: Restart systemd-journald
  become: true
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Reload chrony sources
  become: true
  ansible.builtin.command:
    cmd: chronyc reload sources
