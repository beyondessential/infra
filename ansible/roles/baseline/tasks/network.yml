---
- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ public_hostname | regex_replace('\\.local$') }}"
    use: systemd

- name: Add full hostname to /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ public_hostname }}"

- name: Install resolved
  become: true
  ansible.builtin.apt:
    name:
      - systemd-resolved
  notify: Restart systemd-resolved

- name: Create resolved override directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-resolved.service.d
    state: directory

- name: Limit resolved CPU usage
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-resolved.service.d/90-cpu-limit.conf
    content: |
      [Service]
      CPUWeight=20
      CPUQuota=30%
  notify:
    - Reload systemd
    - Restart systemd-resolved

- name: Enable resolved
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: yes
    state: started

- name: Set resolved as DNS
  become: true
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link

# avahi-daemon publishes the host's .local name on the LAN — Raspbian ITIs ship
# with this enabled by default, Ubuntu doesn't. Free port 5353 from resolved
# first so avahi can bind it; libnss-mdns routes local .local lookups straight
# to avahi via NSS.
- when: is_iti | default(false)
  name: Create resolved config drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory

- when: is_iti | default(false)
  name: Disable resolved mDNS to leave port 5353 for avahi
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/90-no-mdns.conf
    content: |
      [Resolve]
      MulticastDNS=no
  notify: Restart systemd-resolved

- when: is_iti | default(false)
  name: Install avahi-daemon
  become: true
  ansible.builtin.apt:
    name:
      - avahi-daemon
      - libnss-mdns
    state: present

- when: is_iti | default(false)
  name: Enable avahi-daemon
  become: true
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started
