---
- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ public_hostname | regex_replace('\\.local$') }}"
    use: systemd

- name: Add full hostname to /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ public_hostname }}"

- name: Install resolved
  become: true
  ansible.builtin.apt:
    name:
      - systemd-resolved
  notify: Restart systemd-resolved

- name: Limit resolved CPU usage
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-resolved.service.d/90-cpu-limit.conf
    content: |
      [Service]
      CPUWeight=20
      CPUQuota=30%
  notify:
    - Reload systemd
    - Restart systemd-resolved

- name: Enable resolved
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: yes
    state: started

- name: Set resolved as DNS
  become: true
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
