---
- name: Check if root filesystem is btrfs
  ansible.builtin.shell: |
    findmnt -n -o FSTYPE /
  register: root_fstype
  changed_when: false

- name: Check root mount options
  ansible.builtin.shell: |
    findmnt -n -o OPTIONS / | grep -E 'subvol=/?(/@|@)($|,)'
  register: root_subvol
  changed_when: false
  failed_when: false

- name: Set btrfs eligibility fact
  ansible.builtin.set_fact:
    btrfs_snapshots_eligible: "{{ root_fstype.stdout == 'btrfs' and root_subvol.rc == 0 }}"

- name: Skip snapper management if not eligible
  ansible.builtin.debug:
    msg: "Skipping snapper management: root is not btrfs with subvol=@ (fstype={{ root_fstype.stdout }}, subvol check={{ root_subvol.rc }})"
  when: not btrfs_snapshots_eligible

- name: Manage snapper
  when: btrfs_snapshots_eligible
  block:
    - name: Install snapper
      become: true
      ansible.builtin.apt:
        name:
          - snapper
        state: present

    - name: List existing snapper configs
      become: true
      ansible.builtin.shell: |
        snapper list-configs | tail -n +3 | awk '{print $1}'
      register: existing_snapper_configs
      changed_when: false
      failed_when: false

    - name: Delete non-postgres snapper configs and their snapshots
      become: true
      ansible.builtin.shell:
        cmd: |
          set -e
          config="{{ item }}"
          if [ ! -f "/etc/snapper/configs/$config" ]; then
            exit 0
          fi

          subvolume=$(. "/etc/snapper/configs/$config"; echo "$SUBVOLUME")
          snapshots_dir="$subvolume/.snapshots"

          if snapper -c "$config" delete-config; then
            exit 0
          fi

          # Fallback: snapper couldn't clean up (e.g. nested subvolumes inside snapshots).
          if [ -d "$snapshots_dir" ]; then
            for snap_dir in "$snapshots_dir"/*/; do
              [ -d "$snap_dir" ] || continue
              if [ -d "${snap_dir}snapshot" ]; then
                btrfs subvolume delete "${snap_dir}snapshot" || true
              fi
              rm -rf "$snap_dir" || true
            done
            btrfs subvolume delete "$snapshots_dir" 2>/dev/null || rm -rf "$snapshots_dir" 2>/dev/null || true
          fi

          # Config file and SNAPPER_CONFIGS entry may linger if delete-config bailed early.
          rm -f "/etc/snapper/configs/$config"
          if [ -f /etc/default/snapper ]; then
            current=$(. /etc/default/snapper; echo "$SNAPPER_CONFIGS")
            new=$(echo "$current" | tr ' ' '\n' | grep -vx "$config" | tr '\n' ' ' | sed 's/ *$//')
            sed -i -E "s|^SNAPPER_CONFIGS=.*|SNAPPER_CONFIGS=\"$new\"|" /etc/default/snapper
          fi
      loop: "{{ existing_snapper_configs.stdout_lines | reject('match', '^postgres$') | list }}"

    - name: Apply retention settings to postgres snapper config
      become: true
      ansible.builtin.shell:
        cmd: |
          set -e
          if [ ! -f "/etc/snapper/configs/postgres" ]; then
            exit 0
          fi
          snapper -c postgres set-config \
            TIMELINE_CREATE=no \
            {{ snapper_timeline_settings | dict2items | map(attribute='key') | zip(snapper_timeline_settings | dict2items | map(attribute='value')) | map('join', '=') | join(' ') }}

    - name: Run snapper cleanup for postgres config
      become: true
      ansible.builtin.shell:
        cmd: |
          set -e
          if [ ! -f "/etc/snapper/configs/postgres" ]; then
            exit 0
          fi
          snapper -c postgres cleanup timeline
          snapper -c postgres cleanup number
      changed_when: false

    - name: Disable snapper timeline timer
      become: true
      ansible.builtin.systemd:
        name: snapper-timeline.timer
        enabled: false
        state: stopped
      failed_when: false

    - name: Enable snapper cleanup timer
      become: true
      ansible.builtin.systemd:
        name: snapper-cleanup.timer
        enabled: true
        state: started
