---
- name: Remove rpi-connect if present
  become: true
  ansible.builtin.apt:
    name: rpi-connect
    state: absent

- name: Update all packages
  become: true
  ansible.builtin.apt:
    cache_valid_time: 3600
    clean: true
    upgrade: dist
    autoremove: true

- name: Install basic tooling
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - bash-completion
      - ca-certificates
      - curl
      - gnupg
      - python3-psycopg2 # required for ansible postgres modules
      - software-properties-common
      - tzdata
      - xz-utils # for .deb installs via ansible
  notify: Update package facts

- name: Set apt repo auto-update
  become: true
  ansible.builtin.copy:
    dest: /etc/cron.daily/apt-update
    mode: '0755'
    content: |
      #!/bin/sh
      apt update

- name: Set ssh auto-upgrade
  become: true
  ansible.builtin.copy:
    dest: /etc/cron.weekly/apt-upgrade-ssh
    mode: '0755'
    content: |
      #!/bin/sh
      apt install -y openssh-server
