---
- name: Remove rpi-connect if present
  become: true
  ansible.builtin.apt:
    name: rpi-connect
    state: absent

- name: Update all packages
  become: true
  ansible.builtin.apt:
    cache_valid_time: 3600
    clean: true
    upgrade: dist
    autoremove: true
  async: 1000
  poll: 0
  register: apt_update

- name: Wait until apt update is finished
  become: true
  async_status:
    jid: "{{ apt_update.ansible_job_id }}"
  register: job_result
  until: job_result.finished
  retries: 1000
  delay: 10

- name: Clean up async file
  become: true
  ignore_errors: true
  ansible.builtin.async_status:
    jid: "{{ apt_update.ansible_job_id }}"
    mode: cleanup

- name: Install basic tooling
  become: true
  ansible.builtin.apt:
    name:
      - acl # required for some become/postgres tasks
      - apt-transport-https
      - bash-completion
      - ca-certificates
      - curl
      - gnupg
      - python3-psycopg2 # required for ansible postgres modules
      - software-properties-common
      - tzdata
      - xz-utils # for .deb installs via ansible
  notify: Update package facts

# Raspberry Pi userland tools — provides vcgencmd, which bestool's
# iti temperature/battery subcommands shell out to. On 26.04+ vcgencmd
# lives in raspi-utils-core (Pi 5-era split); on older Ubuntu it was
# in libraspberrypi-bin.
- when: is_iti | default(false)
  name: Install Raspberry Pi userland tools
  become: true
  ansible.builtin.apt:
    name: raspi-utils-core
    state: present
  notify: Update package facts

- name: Set apt repo auto-update
  become: true
  ansible.builtin.copy:
    dest: /etc/cron.daily/apt-update
    mode: "0755"
    content: |
      #!/bin/sh
      apt update

- name: Set ssh auto-upgrade
  become: true
  ansible.builtin.copy:
    dest: /etc/cron.weekly/apt-upgrade-ssh
    mode: "0755"
    content: |
      #!/bin/sh
      apt install -y openssh-server
