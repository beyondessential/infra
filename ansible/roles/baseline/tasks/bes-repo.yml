---
- name: Add bes-tools apt key
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.fileglob', 'bes-tools.gpg') }}"
    dest: /etc/apt/keyrings/bes-tools.gpg
    mode: "0644"

- name: Add bes-tools apt repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/bes-tools.list
    mode: "0644"
    content: |
      deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/bes-tools.gpg] https://tools.ops.tamanu.io/apt stable main
  register: bes_tools_repo

- name: Refresh apt cache after bes-tools repo change  # noqa: no-handler
  # Must refresh immediately so later tasks see the new repo; a deferred handler would run too late.
  become: true
  when: bes_tools_repo.changed
  ansible.builtin.apt:
    update_cache: true

- name: Remove duplicate bes-tools apt source
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tools_ops_tamanu_io_apt.list
    state: absent

- name: Prioritise bes-tools repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-bes-tools
    mode: "0644"
    content: |
      Package: *
      Pin: origin tools.ops.tamanu.io
      Pin-Priority: 999
