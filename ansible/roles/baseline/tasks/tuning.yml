---
# ipv4 tcp settings also apply to ipv6
# see https://www.infradead.org/~mchehab/kernel_docs/networking/ip-sysctl.html#proc-sys-net-ipv6-variables

# https://ably.com/blog/optimizing-global-message-transit-latency-a-journey-through-tcp-configuration
# spec: LNXSRV#network-tuning
- name: Disable TCP slow start after idle
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.tcp_slow_start_after_idle
    value: "0"
    sysctl_file: /etc/sysctl.d/tcp-tuning.conf

# enable BBR for TCP
- name: Load tcp_bbr module
  become: true
  community.general.modprobe:
    name: tcp_bbr
    state: present
    persistent: present
- name: Set default qdisc to fq
  become: true
  ansible.posix.sysctl:
    name: net.core.default_qdisc
    value: "fq"
    sysctl_file: /etc/sysctl.d/tcp-tuning.conf
- name: Set TCP congestion control to bbr
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.tcp_congestion_control
    value: "bbr"
    sysctl_file: /etc/sysctl.d/tcp-tuning.conf
