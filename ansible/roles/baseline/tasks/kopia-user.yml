---
# Create kopia user even if we don't install/use kopia
# just because it's easier to be able to assume it exists
# rather than create elaborate orderings of roles

- name: Create kopia group
  become: true
  ansible.builtin.group:
    name: kopia
    system: true
    state: present

- name: Create kopia user
  become: true
  ansible.builtin.user:
    name: kopia
    group: kopia
    system: true
    create_home: true
    home: /var/lib/kopia
