# Managed by ansible (baseline/kernel-parameters.yml).
# Sorts after the 10-*.conf files of Ubuntu and the systemd defaults, so these
# values win. The per-interface keys are globs: systemd-sysctl re-applies them
# for every interface that appears later (podman, Tailscale).

kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 2
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.kexec_load_disabled = 1
kernel.perf_event_paranoid = 3
# Ubuntu's value: keeps the SysRq keys for sync, remount read-only and reboot on
# the serial console.
kernel.sysrq = 176
kernel.apparmor_restrict_unprivileged_userns = 1
# Only root can use io_uring, unless the postgres role names a group in
# /etc/sysctl.d/99-postgres-io-uring.conf.
kernel.io_uring_disabled = 1
dev.tty.ldisc_autoload = 0
vm.unprivileged_userfaultfd = 0

fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.suid_dumpable = 0

net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.accept_source_route = 0
net.ipv6.conf.*.accept_source_route = 0
# Loose reverse path filtering: strict drops the asymmetric traffic of Tailscale.
net.ipv4.conf.*.rp_filter = 2
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
