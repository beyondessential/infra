---
- name: Add tailscale apt key
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings/tailscale.asc
    content: "{{ lookup('ansible.builtin.file', 'apt.asc') }}"

- name: Add tailscale repo
  become: true
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/tailscale.asc] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main
    filename: tailscale
    state: present

- name: Prioritise tailscale repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-tailscale
    content: |
      Package: *
      Pin: release o=pkgs.tailscale.com
      Pin-Priority: 900

- name: Install tailscale
  become: true
  ansible.builtin.apt:
    name: tailscale
    state: present
  notify:
    - Update package facts

- name: Enable tailscale
  become: true
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Set tailscale auto-upgrade
  become: true
  ansible.builtin.copy:
    dest: /etc/cron.weekly/apt-upgrade-tailscale
    mode: "0755"
    content: |
      #!/bin/sh
      apt install -y tailscale
