---
- name: Allow tailscale access to postgres
  loop:
    - 100.64.0.0/10
    - fd7a:115c:a1e0:ab12::/64
  become: true
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/current/main/pg_hba.conf
    contype: host
    users: all
    databases: all
    source: "{{ item }}"
    method: scram-sha-256
  notify: Reload postgres
