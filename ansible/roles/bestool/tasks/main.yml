---
# The bestool binary itself is installed (and kept up to date) by the toolbox
# role. This role owns the bestool-alertd daemon and the bits it needs to run.

# alertd's version-gated ExecStart (see the template) needs the installed
# version. On a full tamanu run tamanu-single-install/facts.yml has already set
# this, but this role must also work when that role is skipped, so gather it here.
- name: Gather package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Set bestool installed version fact
  when: "'bestool' in ansible_facts.packages"
  ansible.builtin.set_fact:
    bestool_installed_version: "{{ ansible_facts.packages['bestool'][0].version | regex_replace('[-+~].*$', '') }}"

# On tamanu servers tamanu-single-common has already created /etc/bestool as
# root:tamanu (setgid, group-shared). This is the fallback for any host where
# that didn't run: a plain root-owned dir is enough for the root-run daemon to
# write its config. We only create it when missing so we never clobber the
# group-shared perms set up by tamanu-single-common.
- name: Check for bestool config directory
  ansible.builtin.stat:
    path: /etc/bestool
  register: bestool_config_dir

- name: Create bestool config directory if absent
  when: not bestool_config_dir.stat.exists
  become: true
  ansible.builtin.file:
    path: /etc/bestool
    state: directory
    owner: root
    group: root
    mode: "0755"

# alertd talks to podman over the rootful API socket (CONTAINER_HOST in the
# unit) rather than forking a privileged podman, which is what lets the unit
# drop caps/namespaces/devices. Enabling it here keeps it tied to its only
# consumer, so it survives runs that skip the podman role.
- name: Enable podman API socket
  become: true
  ansible.builtin.systemd:
    name: podman.socket
    daemon_reload: true
    state: started
    enabled: true

# bestool 1.26.0 ships its own bestool-alertd.service in the package. From that
# version on we stop managing the unit file: a self-managed copy under
# /etc/systemd/system would shadow the packaged unit, so we delete it and inject
# only the host-specific database URL via a drop-in. Older bestool has no
# packaged unit, so keep templating the full unit for it (and when the version
# fact is somehow absent, fall back to templating rather than leave nothing).
- name: Determine whether bestool ships its own alertd unit
  ansible.builtin.set_fact:
    bestool_ships_alertd_unit: "{{ bestool_installed_version is defined and bestool_installed_version is version('1.26.0', '>=') }}"

- name: Install bestool-alertd systemd unit
  when: not bestool_ships_alertd_unit
  become: true
  ansible.builtin.template:
    src: bestool-alertd.service.j2
    dest: /etc/systemd/system/bestool-alertd.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart bestool-alertd

- name: Remove self-managed bestool-alertd unit superseded by the package
  when: bestool_ships_alertd_unit
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/bestool-alertd.service
    state: absent
  notify:
    - Reload systemd
    - Restart bestool-alertd

# The doctor's DB checks connect as a dedicated read-only Postgres role over the
# socket (peer auth). The fact is set by tamanu-single-common, so it's present
# only on tamanu hosts; absent elsewhere we leave the packaged unit's default.
- name: Create bestool-alertd unit drop-in directory
  when: bestool_ships_alertd_unit and tamanu_alertd_database_url is defined
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/bestool-alertd.service.d
    state: directory
    mode: "0755"

- name: Drop in bestool-alertd database URL
  when: bestool_ships_alertd_unit and tamanu_alertd_database_url is defined
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/bestool-alertd.service.d/10-database.conf
    content: |
      [Service]
      Environment=TAMANU_DATABASE_URL={{ tamanu_alertd_database_url }}
    mode: "0644"
  notify:
    - Reload systemd
    - Restart bestool-alertd

- name: Enable and start bestool-alertd
  become: true
  ansible.builtin.systemd:
    name: bestool-alertd.service
    state: started
    enabled: true
    daemon_reload: true
