---
- name: Set msupply image tag
  ansible.builtin.set_fact:
    msupply_tag: "{{ msupply_version }}{{ '-arm64' if ansible_architecture == 'aarch64' else '' }}"
    msupply_image: "msupplyfoundation/omsupply:{{ msupply_version }}{{ '-arm64' if ansible_architecture == 'aarch64' else '' }}"

- name: Fetch MsupplyFQDN EC2 tag
  ansible.builtin.include_tasks: ../../../tasks/fetch-ec2-tag.yml
  vars:
    ec2_tag_name: MsupplyFQDN

- name: Set msupply enabled fact
  ansible.builtin.set_fact:
    msupply_enabled: "{{ msupply_enabled or (ansible_facts['system_vendor'] == 'Amazon EC2' and ansible_ec2_tag_MsupplyFQDN is defined) }}"

- name: Set msupply hostname from EC2 tag
  when: ansible_facts['system_vendor'] == 'Amazon EC2' and ansible_ec2_tag_MsupplyFQDN is defined
  ansible.builtin.set_fact:
    msupply_hostname: "{{ ansible_ec2_tag_MsupplyFQDN }}"
