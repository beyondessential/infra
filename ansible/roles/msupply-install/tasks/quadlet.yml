---
- name: Install mSupply container quadlet
  become: true
  ansible.builtin.template:
    src: msupply.container.j2
    dest: /etc/containers/systemd/msupply.container
    mode: "0644"
  notify: Reload systemd

- name: Create the mSupply container drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/containers/systemd/msupply.container.d
    state: directory
    mode: "0755"

# spec: LNXSRV#containers
- name: Harden the mSupply container
  when: container_hardening_enabled | bool
  become: true
  ansible.builtin.copy:
    dest: /etc/containers/systemd/msupply.container.d/hardening.conf
    mode: "0644"
    content: |
      [Container]
      DropCapability=all
      AddCapability=NET_BIND_SERVICE
      NoNewPrivileges=true
  register: msupply_hardening_applied
  notify: Reload systemd

- name: Remove the hardening of the mSupply container
  when: not (container_hardening_enabled | bool)
  become: true
  ansible.builtin.file:
    path: /etc/containers/systemd/msupply.container.d/hardening.conf
    state: absent
  register: msupply_hardening_removed
  notify: Reload systemd

# The drop-in only reaches the container when it next starts, and it is
# long-running, so say so rather than leave a successful run to imply it.
- name: Warn that the mSupply container keeps its old capabilities until restarted
  when: msupply_hardening_applied is changed or msupply_hardening_removed is changed
  ansible.builtin.debug:
    msg: >-
      The container hardening changed, but the running mSupply container keeps
      its previous capabilities until it restarts. Restart it with
      `systemctl restart msupply`.
