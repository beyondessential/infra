---
- name: Create postgres user '{{ postgres_username }}'
  become: true
  become_user: postgres
  when: postgres_create_user | bool
  community.postgresql.postgresql_user:
    name: "{{ postgres_username }}"
    password: "{{ lookup('ansible.builtin.password', '/dev/null', seed=ansible_facts['machine_id'] + salt + 'postgres' + postgres_username, chars=['ascii_letters',
      'digits']) }}"

- name: Create postgres database '{{ postgres_database }}' with owner '{{ postgres_username }}'
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgres_database }}"
    owner: "{{ postgres_username }}"

- name: Allow local access to postgres
  when: postgres_unix_socket | bool
  become: true
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/current/main/pg_hba.conf
    contype: local
    users: "{{ postgres_username }}"
    databases: "{{ postgres_database }}"
    method: scram-sha-256
    address: "" # workaround for https://github.com/ansible-collections/community.postgresql/issues/777 (fixed in 3.9.1)
  notify: Reload postgres
