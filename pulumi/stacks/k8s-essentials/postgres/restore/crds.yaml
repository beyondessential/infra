apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresphysicalreplicas.pgro.bes.au
spec:
  group: pgro.bes.au
  names:
    categories:
    - all
    kind: PostgresPhysicalReplica
    plural: postgresphysicalreplicas
    shortNames:
    - ppr
    singular: postgresphysicalreplica
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.serviceName
      name: Service
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for PostgresPhysicalReplicaSpec via `CustomResource`
        properties:
          spec:
            properties:
              affinity:
                nullable: true
                type: object
                x-kubernetes-preserve-unknown-fields: true
              analyticsUsername:
                default: analytics
                description: Username for analytics connections
                type: string
              kopiaSecretRef:
                description: Reference to a Secret containing kopia repository credentials
                type: string
              minimumTtl:
                description: Don't restore a new snapshot within this duration of the last restore completing
                nullable: true
                type: string
              notifications:
                items:
                  properties:
                    events:
                      default: []
                      items:
                        enum:
                        - RestoreComplete
                        type: string
                      type: array
                    graphql:
                      nullable: true
                      properties:
                        headers:
                          additionalProperties:
                            anyOf:
                            - {}
                            - required:
                              - secretKeyRef
                            properties:
                              secretKeyRef:
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            x-kubernetes-preserve-unknown-fields: true
                          nullable: true
                          type: object
                        mutation:
                          type: string
                        url:
                          type: string
                        variablesTemplate:
                          type: string
                      required:
                      - mutation
                      - url
                      - variablesTemplate
                      type: object
                    includePassword:
                      default: false
                      description: Include password directly in notification payload
                      type: boolean
                    name:
                      type: string
                    webhook:
                      nullable: true
                      properties:
                        headers:
                          additionalProperties:
                            anyOf:
                            - {}
                            - required:
                              - secretKeyRef
                            properties:
                              secretKeyRef:
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            x-kubernetes-preserve-unknown-fields: true
                          nullable: true
                          type: object
                        method:
                          default: POST
                          type: string
                        url:
                          type: string
                      required:
                      - url
                      type: object
                  required:
                  - name
                  type: object
                type: array
              overlayDatabase:
                description: Optional overlay database configuration (FDW-based persistent database)
                nullable: true
                properties:
                  affinity:
                    description: Pod affinity/anti-affinity rules for the overlay database
                    nullable: true
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  imageCatalog:
                    description: |-
                      CNPG image catalog to use for PG version discovery and image resolution.
                      If absent, defaults to ClusterImageCatalog kind.
                    nullable: true
                    properties:
                      kind:
                        description: 'Kind: "ClusterImageCatalog" (default) or "ImageCatalog"'
                        nullable: true
                        type: string
                      name:
                        description: Name of the image catalog resource
                        type: string
                    required:
                    - name
                    type: object
                  postgresVersion:
                    description: |-
                      PostgreSQL major version for the CNPG cluster (e.g. "17").
                      If absent, resolved from the CNPG image catalog (see image_catalog).
                      Falls back to a hardcoded default ("17") if no catalog is available.
                    nullable: true
                    type: string
                  resources:
                    description: Resource requirements for the overlay database pods
                    nullable: true
                    properties:
                      limits:
                        additionalProperties:
                          type: string
                        nullable: true
                        type: object
                      requests:
                        additionalProperties:
                          type: string
                        nullable: true
                        type: object
                    type: object
                  schemaMapping:
                    additionalProperties:
                      type: string
                    description: |-
                      Schema mapping: if provided, only these schemas are imported.
                      Key = remote schema name, Value = local schema name in overlay DB.
                      If absent, all user schemas are imported at their original names.
                    nullable: true
                    type: object
                  serviceAnnotations:
                    additionalProperties:
                      type: string
                    description: Annotations to apply to the overlay database's -rw Service
                    nullable: true
                    type: object
                  storageClass:
                    description: Storage class for the overlay database PVC
                    nullable: true
                    type: string
                  storageSizeOverride:
                    description: |-
                      Override for the overlay database PVC size.
                      If absent, auto-sized: 5Gi + ceil(snapshot_size / 10) rounded up to whole Gi.
                      Auto-sizing only ever increases (ratchets up), never shrinks.
                    nullable: true
                    type: string
                  tolerations:
                    description: Tolerations for the overlay database pods
                    items:
                      properties:
                        effect:
                          nullable: true
                          type: string
                        key:
                          nullable: true
                          type: string
                        operator:
                          nullable: true
                          type: string
                        tolerationSeconds:
                          format: int64
                          nullable: true
                          type: integer
                        value:
                          nullable: true
                          type: string
                      type: object
                    type: array
                type: object
              podAnnotations:
                additionalProperties:
                  type: string
                nullable: true
                type: object
              postgresExtraConfig:
                description: Extra lines appended to postgresql.conf (e.g. shared_preload_libraries)
                nullable: true
                type: string
              readOnly:
                default: true
                description: Set database to read-only mode
                type: boolean
              resources:
                nullable: true
                properties:
                  limits:
                    additionalProperties:
                      type: string
                    nullable: true
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    nullable: true
                    type: object
                type: object
              schedule:
                description: Cron expression for scheduled restores
                nullable: true
                type: string
              scheduleJitter:
                default: 10m
                description: Random jitter added to scheduled restores
                type: string
              serviceAnnotations:
                additionalProperties:
                  type: string
                nullable: true
                type: object
              snapshotFilter:
                nullable: true
                properties:
                  hostPattern:
                    description: Glob pattern for filtering snapshot hosts
                    nullable: true
                    type: string
                  tags:
                    additionalProperties:
                      type: string
                    nullable: true
                    type: object
                type: object
              storageClass:
                nullable: true
                type: string
              storageSizeOverride:
                description: Override dynamic sizing with a fixed PVC size
                nullable: true
                type: string
              switchoverGracePeriod:
                default: 5m
                description: Wait before deleting old restore after switchover
                type: string
              tolerations:
                items:
                  properties:
                    effect:
                      nullable: true
                      type: string
                    key:
                      nullable: true
                      type: string
                    operator:
                      nullable: true
                      type: string
                    tolerationSeconds:
                      format: int64
                      nullable: true
                      type: integer
                    value:
                      nullable: true
                      type: string
                  type: object
                type: array
            required:
            - kopiaSecretRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectionInfo:
                nullable: true
                properties:
                  database:
                    type: string
                  host:
                    type: string
                  passwordSecret:
                    type: string
                  port:
                    format: uint16
                    maximum: 65535.0
                    minimum: 0.0
                    type: integer
                  username:
                    type: string
                required:
                - database
                - host
                - passwordSecret
                - port
                - username
                type: object
              currentRestore:
                nullable: true
                type: string
              lastRestoreCompletedAt:
                nullable: true
                type: string
              latestAvailableSnapshot:
                nullable: true
                type: string
              nextScheduledRestore:
                nullable: true
                type: string
              notifications:
                items:
                  properties:
                    lastError:
                      nullable: true
                      type: string
                    lastSentAt:
                      nullable: true
                      type: string
                    name:
                      type: string
                    success:
                      default: false
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
              overlayClusterName:
                description: Name of the CNPG Cluster CR for the overlay database
                nullable: true
                type: string
              overlayFdwRestore:
                description: Name of the restore whose schemas are currently imported via FDW
                nullable: true
                type: string
              overlayPostgresVersion:
                description: Resolved PG major version used for the overlay cluster
                nullable: true
                type: string
              overlayStorageSize:
                description: Current (possibly ratcheted) storage size of the overlay PVC
                nullable: true
                type: string
              phase:
                enum:
                - Pending
                - Restoring
                - Ready
                - Failed
                - null
                nullable: true
                type: string
              previousRestore:
                nullable: true
                type: string
              queuePosition:
                format: uint32
                minimum: 0.0
                nullable: true
                type: integer
              serviceName:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: PostgresPhysicalReplica
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresphysicalrestores.pgro.bes.au
spec:
  group: pgro.bes.au
  names:
    categories:
    - all
    kind: PostgresPhysicalRestore
    plural: postgresphysicalrestores
    shortNames:
    - pprestore
    singular: postgresphysicalrestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.replica
      name: Replica
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for PostgresPhysicalRestoreSpec via `CustomResource`
        properties:
          spec:
            properties:
              replica:
                description: Reference to parent PostgresPhysicalReplica
                type: string
              snapshot:
                description: Kopia snapshot ID to restore
                type: string
              snapshotSize:
                description: Size of the snapshot from kopia metadata
                type: string
              storageSize:
                description: Calculated PVC size (snapshot_size * 1.1)
                type: string
            required:
            - replica
            - snapshot
            - snapshotSize
            - storageSize
            type: object
          status:
            nullable: true
            properties:
              activatedAt:
                description: When service switched to this restore
                nullable: true
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                nullable: true
                type: string
              credentialsSecret:
                description: Shared credentials secret (owned by parent replica)
                nullable: true
                type: string
              deployment:
                nullable: true
                type: string
              phase:
                enum:
                - Pending
                - Restoring
                - Ready
                - Switching
                - Active
                - Failed
                - null
                nullable: true
                type: string
              postgresVersion:
                nullable: true
                type: string
              pvc:
                nullable: true
                type: string
              restoreJob:
                nullable: true
                properties:
                  completedAt:
                    nullable: true
                    type: string
                  name:
                    type: string
                  phase:
                    type: string
                required:
                - name
                - phase
                type: object
              restoredAt:
                description: When restore job completed
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: PostgresPhysicalRestore
        type: object
    served: true
    storage: true
    subresources:
      status: {}
