log_format log_tabbed
    '[$time_local] - $http_host\t$remote_addr->$upstream_addr/$connection_requests'
    '\t${request_time}sec\t$status\t$server_protocol $request_method\t$request_uri'
    '\t$body_bytes_sent/${bytes_sent}b'
    '\t"$http_referer"\t"$http_user_agent"\t"$http_x_forwarded_for"';

log_format log_tabbed_short
    '[$time_local] - $http_host\t$remote_addr->$upstream_addr/$connection_requests'
    '\t${request_time}sec\t$status\t$server_protocol $request_method\t$request_uri'
    '\t$body_bytes_sent/${bytes_sent}b';

log_format log_json escape=json
'{'
  '"request":{'
    '"host":"$http_host", '
    '"addr":"$remote_addr", '
    '"protocol":"$server_protocol", '
    '"method":"$request_method", '
    '"uri":"$request_uri", '
    '"tls":{'
      '"protocol":"$ssl_protocol", '
      '"cipher":"$ssl_cipher", '
      '"sni":"$ssl_server_name", '
      '"reused":"$ssl_session_reused", '
      '"early-data":"$ssl_early_data", '
      '"client":{'
        '"fingerprint":"$ssl_client_fingerprint", '
        '"serial":"$ssl_client_serial", '
        '"status":"$ssl_client_verify"'
      '}'
    '}, '
    '"bytes":"$request_length", '
    '"referrer":"$http_referer", '
    '"agent":"$http_user_agent", '
    '"forwarded-for":"$http_x_forwarded_for", '
    '"tamanu":{'
      '"client":"$http_x_tamanu_client", '
      '"version":"$http_x_version"'
    '}'
  '}, '
  '"server":{'
    '"addr":"$server_addr", '
    '"port":"$server_port", '
    '"name":"$server_name"'
  '}, '
  '"backend":{'
    '"upstream":"$upstream_addr", '
    '"reqnum": "$connection_requests", '
    '"bytes":{'
      '"sent":"$upstream_bytes_sent", '
      '"received":"$upstream_bytes_received"'
    '}, '
    '"cache":"$upstream_cache_status", '
    '"duration":{'
      '"connect":"$upstream_connect_time", '
      '"headers":"$upstream_header_time", '
      '"response":"$upstream_response_time"'
    '}'
  '}, '
  '"response":{'
    '"ts":"$time_iso8601", '
    '"status":"$status", '
    '"duration":"$request_time", '
    '"bytes":{'
      '"total":"$bytes_sent", '
      '"body":"$body_bytes_sent"'
    '}, '
    '"completion":"$request_completion", '
    '"tamanu":{'
      '"server":"$http_x_tamanu_server", '
      '"version":"$http_x_version"'
    '}'
  '}'
'}';
