name: Tamanu renderer contract

# What the stub in pulumi/tamanu/on-k8s sends a channel has to be accepted by the renderer that
# channel serves. Canary's is built from the same change and checked by the renderer's own tests
# (tests/stub.rs). Stable's is whatever was last promoted, so it is checked here, against the
# published image. docs/spec/tamanu/renderer-rollout.md, params.checked-per-channel.

on:
  push:
    branches: [main]
    paths:
      - "pulumi/tamanu/on-k8s/**"
      - "tamanu/on-k8s/renderer/tests/fixtures/stub/**"
      - ".github/workflows/tamanu-renderer-contract.yml"
  pull_request:
    paths:
      - "pulumi/tamanu/on-k8s/**"
      - "tamanu/on-k8s/renderer/tests/fixtures/stub/**"
      - ".github/workflows/tamanu-renderer-contract.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  stable:
    name: Stable renderer accepts the stub's parameters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      # r[impl params.checked-per-channel]
      - name: Render the stable parameters with the stable image
        run: |
          docker run --rm \
            -v "$PWD/tamanu/on-k8s/renderer/tests/fixtures/stub:/fixtures:ro" \
            ghcr.io/beyondessential/infra-argo-tamanu-renderer:stable \
            infra-argo-tamanu-renderer --params /fixtures/stable.json --format yaml > /dev/null
