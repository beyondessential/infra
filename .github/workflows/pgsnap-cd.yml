name: pgsnap CD

on:
  push:
    branches: [main]
    paths:
      - "pgsnap/**"
      - ".github/workflows/pgsnap-cd.yml"
    tags: ["pgsnap-v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  build-binaries:
    name: Build ${{ matrix.arch }} binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6

      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pgsnap
          key: ${{ matrix.arch }}-release

      - name: Build binaries
        working-directory: pgsnap
        run: cargo build --locked --target ${{ matrix.target }} --release --bin operator

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/${{ matrix.arch }}
          cp pgsnap/target/${{ matrix.target }}/release/operator artifacts/${{ matrix.arch }}/

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: artifacts/${{ matrix.arch }}/
          retention-days: 1

  build-image:
    name: Build container image
    runs-on: ubuntu-24.04
    needs: [build-binaries]
    steps:
      - uses: actions/checkout@v6

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Extract version
        id: version
        working-directory: pgsnap
        run: echo "version=$(cargo pkgid | cut -d# -f2)" >> "$GITHUB_OUTPUT"

      - name: Download AMD64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-amd64
          path: pgsnap/.build-context/amd64/

      - name: Download ARM64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-arm64
          path: pgsnap/.build-context/arm64/

      - name: Setup buildkit
        uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/beyondessential/pgsnap
          tags: |
            type=sha
            type=ref,event=branch
            type=match,pattern=pgsnap-v(.*),group=1
          labels: |
            org.opencontainers.image.vendor=BES
            org.opencontainers.image.title=pgsnap
            org.opencontainers.image.url=https://github.com/beyondessential/ops/
            org.opencontainers.image.source=https://github.com/beyondessential/ops/
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: pgsnap/.build-context
          file: pgsnap/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
