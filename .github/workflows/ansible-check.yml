name: Ansible check

on:
  pull_request:
    paths:
      - ansible/**
      - .github/workflows/ansible-check.yml
  push:
    branches:
      - main
    paths:
      - ansible/**
      - .github/workflows/ansible-check.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ansible

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ansible-lint

  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - name: Syntax-check every playbook
        run: |
          set -euo pipefail
          for pb in *.yml; do
            [ "$pb" = requirements.yml ] && continue
            echo "::group::$pb"
            uv run ansible-playbook --syntax-check "$pb"
            echo "::endgroup::"
          done

  plugin-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - name: Test the inventory plugins
        run: uv run python -m unittest discover -s tests -v

