name: infra-argo-tamanu-renderer CD

on:
  push:
    branches: [main]
    paths:
      - "tamanu/on-k8s/renderer/**"
      - ".github/workflows/infra-argo-tamanu-renderer-cd.yml"
  pull_request:
    paths:
      - "tamanu/on-k8s/renderer/**"
      - ".github/workflows/infra-argo-tamanu-renderer-cd.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt --no-self-update stable
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tamanu/on-k8s/renderer

      - name: Format
        working-directory: tamanu/on-k8s/renderer
        run: cargo fmt --check

      - name: Lint
        working-directory: tamanu/on-k8s/renderer
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: tamanu/on-k8s/renderer
        run: cargo test --locked

  build-binaries:
    name: Build ${{ matrix.arch }} binaries
    runs-on: ${{ matrix.runner }}
    needs: [test]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Configure toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tamanu/on-k8s/renderer
          key: ${{ matrix.arch }}-release

      - name: Build binaries
        working-directory: tamanu/on-k8s/renderer
        run: cargo build --locked --target ${{ matrix.target }} --release --bin infra-argo-tamanu-renderer

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/${{ matrix.arch }}
          cp tamanu/on-k8s/renderer/target/${{ matrix.target }}/release/infra-argo-tamanu-renderer artifacts/${{ matrix.arch }}/

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: artifacts/${{ matrix.arch }}/
          retention-days: 1

  build-image:
    name: Build container image
    runs-on: ubuntu-24.04
    needs: [build-binaries]
    steps:
      - uses: actions/checkout@v7

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Download AMD64 binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries-amd64
          path: tamanu/on-k8s/renderer/.build-context/amd64/

      - name: Download ARM64 binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries-arm64
          path: tamanu/on-k8s/renderer/.build-context/arm64/

      - name: Add plugin config
        run: cp tamanu/on-k8s/renderer/cmp/plugin.yaml tamanu/on-k8s/renderer/.build-context/plugin.yaml

      - name: Setup buildkit
        uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/beyondessential/infra-argo-tamanu-renderer
          tags: |
            type=sha
            type=ref,event=branch
          labels: |
            org.opencontainers.image.vendor=BES International
            org.opencontainers.image.title=infra-argo-tamanu-renderer
            org.opencontainers.image.url=https://github.com/beyondessential/infra/
            org.opencontainers.image.source=https://github.com/beyondessential/infra/
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: tamanu/on-k8s/renderer/.build-context
          file: tamanu/on-k8s/renderer/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

  # spec: K8STRO#promotion
  promote-canary:
    name: Promote to canary
    needs: [build-image]
    if: github.event_name == 'push'
    uses: ./.github/workflows/infra-argo-tamanu-renderer-promote.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    with:
      channel: canary
      sha: ${{ github.sha }}
