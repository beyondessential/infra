[package]
name = "tamanu-render"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
minijinja = "3.0.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
insta = { version = "1.49.0", features = ["yaml", "json"] }
